    <div style="background:linear-gradient(90deg,rgba(63,182,168,.10),rgba(63,182,168,.03));border:1px solid rgba(63,182,168,.35);border-left:4px solid var(--teal);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <span style="font-size:18px">✓</span>
      <div style="flex:1">
        <strong style="color:var(--teal)">已自动同步铺位测算参数</strong>
        <span style="color:var(--ink-3);font-size:12px;margin-left:8px">${escapeHtml(fp.biz||"")}/${escapeHtml(fp.sub||"")} · ${fmtNum(fp.area||0)}㎡ · 租金 ¥${fmtNum(fp.rent||0)}/㎡/月</span>
      </div>
      <button class="btn sm ghost" onclick="navigate('pricing')">← 返回铺位测算</button>
      <span style="color:var(--ink-4);font-size:11px">下方可微调任意参数</span>
    </div>` : `
    <div style="background:rgba(230,168,58,.06);border-left:3px solid var(--amber);border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--ink-2)">
      💡 <strong>建议:</strong>先在「铺位测算」录入铺位+业态,本页参数会自动同步。也可在此独立填写,作为深度模拟。
      <button class="btn sm" style="margin-left:10px" onclick="navigate('pricing')">→ 前往铺位测算</button>
    </div>`;

  root.innerHTML = `
    <div class="section-head">
      <div><h2>商户经营测算 · 深度模拟</h2><div class="desc">从铺位测算同步参数 · 可微调每项做敏感性分析</div></div>
      <div class="right"><button class="btn primary sm" id="btnRunMerchant">▶ 重新计算</button></div>
    </div>
    ${syncBanner}

    <div class="grid g-2" style="grid-template-columns:1fr 1.5fr;align-items:flex-start">
      <div class="card">
        <div class="card-head"><h3>输入参数 (可微调)</h3><span class="h-acc">默认值已同步 · 可手动覆盖</span></div>
        <div class="card-body">

          <div class="subhead">铺位与租赁</div>
          <div class="grid g-2">
            <div class="field"><label>业态大类</label><select class="select" id="m_biz">${Object.keys(state.benchmark).map(x=>`<option ${x===biz?"selected":""}>${x}</option>`).join("")}</select></div>
            <div class="field"><label>细分业态</label><select class="select" id="m_sub"></select></div>
            <div class="field" style="grid-column:1/-1">
              <label>选品牌带入参数 <span style="color:var(--ink-4);font-weight:400;text-transform:none">(可选,选品牌后自动调整面积/客单价等)</span></label>
              <select class="select" id="m_brand"><option value="">— 不选品牌(用业态平均值)—</option></select>
            </div>
            <div class="field"><label>实用面积 (㎡) <span id="m_areaHint" style="color:var(--ink-4);font-weight:400;text-transform:none;font-size:11px"></span></label><input class="input" type="number" id="m_area" value="${area}"></div>
            <div class="field"><label>租金 (元/㎡/月)</label><input class="input" type="number" id="m_rent" value="${rent}"></div>
            <div class="field"><label>管理费 (元/㎡/月) <span style="color:var(--ink-4);font-weight:400;text-transform:none;font-size:10px">已按城市/体量自动联动</span></label><input class="input" type="number" id="m_mgmt" value="${(()=>{const cur=Calc.mgmtFee({city:state.project.city,mall:state.project.mall,projectSize:state.project.projectSize}); const sig=`${state.project.city}|${state.project.mall}|${state.project.projectSize}`; return last.mgmt && last._mgmtSig===sig ? last.mgmt : cur;})()}"></div>
            <div class="field"><label>免租期 (月)</label><input class="input" type="number" id="m_free" value="${last.free||3}"></div>
            <div class="field"><label>合同年限</label><input class="input" type="number" id="m_years" value="${last.years||5}"></div>
            <div class="field"><label>年递增 (%)</label><input class="input" type="number" id="m_incr" value="${last.incr||5}"></div>
          </div>

          <div class="subhead" style="display:flex;align-items:center;gap:10px">
            <span>💰 投资估算 (万元)</span>
            <button class="btn sm ghost" id="m_invAuto" title="按当前业态 + 面积一键重算投资明细">一键按业态重算</button>
            <span style="flex:1"></span>
            <span id="m_invSum" style="color:var(--amber);font-weight:600;font-size:13px"></span>
          </div>
          <div style="background:rgba(63,182,168,.05);border-left:3px solid var(--teal);border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:var(--ink-3);line-height:1.55">
            <strong>投资构成</strong>:装修工程 + 设备/货架 + 首批货品 + 品牌加盟费 + 其他(保证金/办证/培训/押金等)= 开店总投资。装修与设备含安装费、消防整改、强弱电改造等。<strong>品牌加盟费</strong>是近年品牌扩张的主要方式(如塔斯汀30-50万、仟吉5万/年、蜜雪0.7-1.1万/年),加盟品牌需重点评估此项成本。<strong>装修单价已按「城市 × 商场档位」动态校准</strong>(当前项目装修系数 ×<span style="color:var(--amber);font-weight:600">${proj.fitOut.toFixed(2)}</span>;一线高端 ×1.20 vs 五线社区邻里 ×0.45,真实造价差异约 2.6 倍)。<strong>仅供参考</strong>——不同品牌投资差异显著(头部连锁可达基准 1.5-2 倍),<strong>实际投资以品牌方提供的预算为准</strong>。
          </div>
          <div class="grid g-2">
            <div class="field"><label>装修工程</label><input class="input" type="number" step="0.1" id="m_inv1" value="${last.inv1 ?? (Calc.estimateInvestmentV11({biz, subBiz:sub, city:state.project.city, cityName:state.project.cityName, brandTier, area})?.decoration || 0)}"></div>
            <div class="field"><label>设备/货架</label><input class="input" type="number" step="0.1" id="m_inv2" value="${last.inv2 ?? (Calc.estimateInvestmentV11({biz, subBiz:sub, city:state.project.city, cityName:state.project.cityName, brandTier, area})?.equipment || 0)}"></div>
            <div class="field"><label>首批货品</label><input class="input" type="number" step="0.1" id="m_inv3" value="${last.inv3 ?? (Calc.estimateInvestmentV11({biz, subBiz:sub, city:state.project.city, cityName:state.project.cityName, brandTier, area})?.goods || 0)}"></div>
            <div class="field"><label>其他(加盟/办证/培训)</label><input class="input" type="number" step="0.1" id="m_inv4" value="${last.inv4 ?? (Calc.estimateInvestmentV11({biz, subBiz:sub, city:state.project.city, cityName:state.project.cityName, brandTier, area})?.other || 0)}"></div>
          </div>

          <div class="subhead" style="display:flex;align-items:center;gap:10px">
            <span>经营参数</span>
            <span style="flex:1"></span>
            <span id="m_salesHint" style="color:var(--ink-4);font-size:11px;font-weight:400"></span>
          </div>
          <div style="background:rgba(230,168,58,.06);border-left:3px solid var(--amber);border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:var(--ink-3);line-height:1.55">
            ⚠ <strong>仅供参考</strong>:月营业额、坪效、客单价等数据为业态<strong>行业共性预估</strong>,不能涵盖所有品牌差异。实际值受品牌势能、运营能力、选址影响——头部品牌(如喜茶、海底捞、星巴克)实际坪效通常为基准的 1.5-2 倍;弱势品牌可能仅为基准的 60-80%。<strong>如对该品牌实际情况有了解,可直接修改下方数值</strong>。
          </div>
          <div class="grid g-2">
            <div class="field"><label>预估月营业额 (万元)</label><input class="input" type="number" step="0.1" id="m_sales" value="${last.sales ?? Calc.estimateTurnoverV11({biz, subBiz:sub, city:state.project.city, cityName:state.project.cityName, circle:state.project.circle, mall:state.project.mall, projectSize:state.project.projectSize, floor:fp.floor||'L1', area, brandTier}).monthlyWan}"></div>
            <div class="field"><label>毛利率 (%)</label><input class="input" type="number" step="0.1" id="m_margin" value="${last.margin ?? Math.round((b.grossMargin||0.5)*100)}"></div>
            <div class="field"><label>员工人数</label><input class="input" type="number" id="m_staff" value="${last.staff ?? (b.staff||4)}"></div>
            <div class="field"><label>人均月薪 (元)</label><input class="input" type="number" id="m_salary" value="${last.salary ?? Math.round((b.salary||4500)*proj.labor)}"></div>
            <div class="field"><label>月水电杂费 (元)</label><input class="input" type="number" id="m_util" value="${last.util ?? Math.round(area*30)}"></div>
            <div class="field"><label>客单价 (元)</label><input class="input" type="number" id="m_ticket" value="${last.ticket ?? Calc.estimateTicketV11({biz, subBiz:sub, city:state.project.city, cityName:state.project.cityName, mall:state.project.mall})}"></div>
            <div class="field" style="grid-column:1/-1"><label>日均过路客流 (人) <span style="color:var(--ink-4);font-weight:400;text-transform:none">可选,用于反推</span></label><input class="input" type="number" id="m_passby" value="${last.passby||0}" placeholder="估算或现场观察"></div>
          </div>
        </div>
      </div>

      <div id="merchantResult"></div>
    </div>
  `;

  /* v5.1:计算并显示投资合计 + 业态建议面积提示 */
  function refreshInvSum(){
    const sum = (+$("#m_inv1").value||0)+(+$("#m_inv2").value||0)+(+$("#m_inv3").value||0)+(+$("#m_inv4").value||0);
    $("#m_invSum").textContent = sum>0 ? `合计 ¥${sum.toFixed(1)} 万` : "";
  }
  function refreshAreaHint(){
    const cb = Calc.bench($("#m_biz").value, $("#m_sub").value);
    if(!cb){ $("#m_areaHint").textContent=""; return; }
    const a = +$("#m_area").value;
    const inRange = a >= (cb.areaMin||0) && a <= (cb.areaMax||99999);
    $("#m_areaHint").innerHTML = `· 建议 ${cb.areaMin||"—"}-${cb.areaMax||"—"}㎡ ${inRange?'<span style="color:var(--teal)">✓ 在区间内</span>':'<span style="color:var(--amber)">⚠ 偏离典型区间</span>'}`;
  }
  function refreshSalesHint(){
    const cb = Calc.bench($("#m_biz").value, $("#m_sub").value);
    if(!cb){ $("#m_salesHint").textContent=""; return; }
    const a = +$("#m_area").value || 0;
    const est = Calc.estimateTurnoverV11({biz:$("#m_biz").value, subBiz:$("#m_sub").value, city:state.project.city, cityName:state.project.cityName, circle:state.project.circle, mall:state.project.mall, projectSize:state.project.projectSize, floor:fp.floor||'L1', area:a, brandTier});
    $("#m_salesHint").innerHTML = `业态参考: ¥${est.monthlyWan} 万/月 (坪效¥${est.perSqm}/㎡)`;
  }
  /* 一键按业态重算投资明细 */
  function autoInv(){
    const cb = Calc.bench($("#m_biz").value, $("#m_sub").value);
    if(!cb) return;
    const a = +$("#m_area").value || 0;
    const est = Calc.estimateInvestmentV11({
      biz: $("#m_biz").value, subBiz: $("#m_sub").value,
      city: state.project.city, cityName: state.project.cityName,
      brandTier, area: a
    });
    if(!est) return;
    $("#m_inv1").value = est.decoration;
    $("#m_inv2").value = est.equipment;
    $("#m_inv3").value = est.goods;
    $("#m_inv4").value = est.other;
    refreshInvSum();
    toast(`已按「${$("#m_sub").value}」基准重算投资明细`,"ok");
  }
  ["m_inv1","m_inv2","m_inv3","m_inv4"].forEach(id=>{ const el=$("#"+id); if(el) el.oninput = refreshInvSum; });
  /* v11.3 关键字段变化时即时同步到 pricing,确保两边数据一致 */
  function syncToPricing(){
    if(!state.pricing) state.pricing = {};
    if(!state.pricing.input) state.pricing.input = {};
    const pi = state.pricing.input;
    pi.area = +$("#m_area").value || pi.area;
    pi.biz = $("#m_biz").value || pi.biz;
    pi.subBiz = $("#m_sub").value || pi.subBiz;
    if(state.merchant.fromPricing){
      state.merchant.fromPricing.area = +$("#m_area").value || state.merchant.fromPricing.area;
      state.merchant.fromPricing.rent = +$("#m_rent").value || state.merchant.fromPricing.rent;
      state.merchant.fromPricing.biz = $("#m_biz").value || state.merchant.fromPricing.biz;
      state.merchant.fromPricing.sub = $("#m_sub").value || state.merchant.fromPricing.sub;
    }
    Store.save();
  }
  $("#m_area").addEventListener("input", ()=>{ refreshAreaHint(); refreshSalesHint(); syncToPricing(); });
  $("#m_rent").addEventListener("input", syncToPricing);
  $("#m_invAuto").onclick = autoInv;
  refreshInvSum();
  refreshAreaHint();
  refreshSalesHint();

  function refreshSub(){
    const v = $("#m_biz").value;
    const subs = Object.keys(state.benchmark[v]||{});
    $("#m_sub").innerHTML = subs.map(x=>`<option ${x===sub?"selected":""}>${x}</option>`).join("");
    refreshBrands();
  }
  function refreshBrands(){
    const sub = $("#m_sub").value;
    const brands = Calc.brandsOf(sub);
    let html = `<option value="">— 不选品牌(用业态平均值)—</option>`;
    brands.forEach(br=>{
      html += `<option value="${escapeHtml(br.name)}">${escapeHtml(br.name)} · ${escapeHtml(br.tier)}${br.typicalArea?` · 典型 ${br.typicalArea}㎡`:""}</option>`;
    });
    $("#m_brand").innerHTML = html;
  }
  $("#m_biz").onchange = ()=>{ refreshSub(); refreshAreaHint(); refreshSalesHint(); syncToPricing(); };
  refreshSub();
  $("#m_sub").onchange = ()=>{
    const newBiz = $("#m_biz").value, newSub = $("#m_sub").value;
    const nb = Calc.bench(newBiz, newSub);
    if(!nb) { refreshBrands(); refreshAreaHint(); refreshSalesHint(); return; }
    if(confirm("切换业态:是否用新业态基准刷新输入?")){
      const a = +$("#m_area").value;
      const est = Calc.estimateInvestmentV11({
        biz:newBiz, subBiz:newSub, city:state.project.city, cityName:state.project.cityName,
        brandTier, area:a
      });
      if(est){
        $("#m_inv1").value = est.decoration;
        $("#m_inv2").value = est.equipment;
        $("#m_inv3").value = est.goods;
        $("#m_inv4").value = est.other;
      }
      $("#m_sales").value = Calc.estimateTurnoverV11({biz:newBiz, subBiz:newSub, city:state.project.city, cityName:state.project.cityName, circle:state.project.circle, mall:state.project.mall, projectSize:state.project.projectSize, floor:fp.floor||'L1', area:a, brandTier}).monthlyWan;
      $("#m_margin").value = Math.round((nb.grossMargin||0.5)*100);
      $("#m_staff").value = nb.staff||4;
      $("#m_salary").value = Math.round((nb.salary||4500)*proj.labor);
      $("#m_ticket").value = Calc.estimateTicketV11({biz:newBiz, subBiz:newSub, city:state.project.city, cityName:state.project.cityName, mall:state.project.mall});
      refreshInvSum();
    }
    refreshBrands();
    refreshAreaHint();
    refreshSalesHint();
    syncToPricing();
  };
  /* v2 品牌选中后,自动调整参数 */
  $("#m_brand").onchange = ()=>{
    const brandName = $("#m_brand").value;
    if(!brandName) return;
    const sub = $("#m_sub").value;
    const brand = Calc.brandsOf(sub).find(b=>b.name===brandName);
    if(!brand) return;
    if(!confirm(`选择"${brand.name}"(${brand.tier}):自动调整面积/客单价/营业额预期?`)) return;

    // 1. 面积 → 用品牌典型面积
    if(brand.typicalArea) $("#m_area").value = brand.typicalArea;
    const a = +$("#m_area").value;

    // 2. 客单价 → 城市基准 × ticketAdj
    const nb = Calc.bench($("#m_biz").value, sub);
    const cityTicket = Calc.estimateTicketV11({biz:$("#m_biz").value, subBiz:sub, city:state.project.city, cityName:state.project.cityName, mall:state.project.mall});
    if(nb && brand.ticketAdj) $("#m_ticket").value = Math.round(cityTicket * brand.ticketAdj);

    // 3. 月营业额 → v11坪效估算 × salesAdj × 面积 / 10000(万元)
    if(nb && brand.salesAdj){
      const est = Calc.estimateTurnoverV11({biz:$("#m_biz").value, subBiz:sub, city:state.project.city, cityName:state.project.cityName, circle:state.project.circle, mall:state.project.mall, projectSize:state.project.projectSize, floor:fp.floor||'L1', area:a});
      $("#m_sales").value = +(est.monthlyWan * brand.salesAdj).toFixed(1);
    }

    // 4. 投资估算同步刷新
    if(nb){
      $("#m_inv1").value = ((nb.fitOut||1500)*a/10000).toFixed(1);
      $("#m_inv2").value = ((nb.equipment||1000)*a/10000).toFixed(1);
      $("#m_inv3").value = ((nb.goods||300)*a/10000).toFixed(1);
      $("#m_inv4").value = ((nb.other||300)*a/10000).toFixed(1);
    }
    toast(`已套用 ${brand.name} 的品牌参数`,"ok");
    syncToPricing();  /* v11.3:品牌切换面积变化后同步 */
  };

  $("#btnRunMerchant").onclick = runMerchant;
  runMerchant();
};

function runMerchant(){
  const input = {
    biz: $("#m_biz").value, sub: $("#m_sub").value,
    area: +$("#m_area").value, rent: +$("#m_rent").value, mgmt: +$("#m_mgmt").value,
    free: +$("#m_free").value, years: +$("#m_years").value, incr: +$("#m_incr").value,
    inv1: +$("#m_inv1").value, inv2: +$("#m_inv2").value, inv3: +$("#m_inv3").value, inv4: +$("#m_inv4").value,
    sales: +$("#m_sales").value, margin: +$("#m_margin").value,
    staff: +$("#m_staff").value, salary: +$("#m_salary").value, util: +$("#m_util").value,
    ticket: +$("#m_ticket").value, passby: +$("#m_passby").value
  };
  state.merchant.input = input; Store.save();

  /* v11.3 双向同步:商户测算的关键参数(面积/租金/业态/品牌)回写到 state.pricing.input
   * 这样用户从商户测算返回铺位测算时,看到的是同步后的最新参数 */
  if(state.pricing && state.pricing.input){
    const pi = state.pricing.input;
    pi.area = input.area;
    pi.rent = input.rent;  /* 注意:虽然 state.pricing.input 没有 rent 字段,但商户测算的 rent 应同步到 fromPricing */
    pi.biz = input.biz;
    pi.subBiz = input.sub;
    /* fromPricing 是 banner 显示用,也同步 */
    if(state.merchant.fromPricing){
      state.merchant.fromPricing.area = input.area;
      state.merchant.fromPricing.rent = input.rent;
      state.merchant.fromPricing.biz = input.biz;
      state.merchant.fromPricing.sub = input.sub;
    }
    Store.save();
  }

  const r = Calc.merchant({
    rent:input.rent, mgmt:input.mgmt, area:input.area,
    monthlySales:input.sales*10000, grossMargin:input.margin/100,
    staffCount:input.staff, staffSalary:input.salary, utility:input.util,
    inv_fitOut:input.inv1, inv_equipment:input.inv2, inv_goods:input.inv3, inv_other:input.inv4,
    years:input.years, incrPct:input.incr,
    passbyDaily:input.passby, ticket:input.ticket, biz:input.biz, sub:input.sub
  });
  state.merchant.result = r; Store.save();

  const health = Calc.rentRatioHealth(r.rentRatio, input.biz, input.sub);
  const paybackOk = r.paybackMonths !== null && r.paybackMonths <= 18;
  const monthlySales = input.sales*10000;
  const b = Calc.bench(input.biz, input.sub) || {};

  $("#merchantResult").innerHTML = `
    <div class="grid g-4" style="margin-bottom:14px">
      <div class="kpi"><div class="ico">%</div><div class="label">租售比</div><div class="value">${fmtPct(r.rentRatio,1)}</div><div class="delta ${health.kind==="ok"?"up":(health.kind==="err"?"down":"")}">${health.label}</div></div>
      <div class="kpi"><div class="ico">↻</div><div class="label">投资回收期</div><div class="value">${r.paybackMonths===null?"∞":r.paybackMonths}<span class="unit">月</span></div><div class="delta ${paybackOk?"up":"down"}">${paybackOk?"健康 < 18 月":r.paybackMonths===null?"亏损中":"偏长"}</div></div>
      <div class="kpi"><div class="ico">¥</div><div class="label">月净利润</div><div class="value" style="color:${r.profit>0?"var(--teal)":"var(--rose)"}">${r.profit>=0?"+":""}${fmtMoney(r.profit)}</div><div class="delta">利润率 ${fmtPct(r.profitMargin,1)}</div></div>
      <div class="kpi"><div class="ico">▤</div><div class="label">投资总额</div><div class="value">${fmtWan(r.totalInvest)}<span class="unit">元</span></div><div class="delta">含 ${(input.inv1+input.inv2+input.inv3+input.inv4).toFixed(1)} 万</div></div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-head"><h3>月经营损益表</h3><span class="h-acc">营业额 ${fmtWan(monthlySales)}元</span></div>
      <div class="card-body">
        ${[
          ["预估月营业额", monthlySales, 1, "var(--ink-1)"],
          ["货品成本",     r.cogs,       monthlySales>0?r.cogs/monthlySales:0, "var(--rose)"],
          ["租金 + 物业",  r.rentMonthly+r.mgmtMonthly, monthlySales>0?(r.rentMonthly+r.mgmtMonthly)/monthlySales:0, "var(--amber)"],
          ["人工成本",     r.labor,      monthlySales>0?r.labor/monthlySales:0, "var(--violet)"],
          ["水电杂费",     r.utility,    monthlySales>0?r.utility/monthlySales:0, "var(--ink-3)"]
        ].map(([k,v,p,c])=>`
          <div class="bar-row">
            <div class="lbl">${k}</div>
            <div class="bar"><span style="width:${Math.min(100,p*100)}%;background:${c}"></span></div>
            <div class="val">${fmtMoney(v)} <span style="color:var(--ink-3);font-size:11px">${fmtPct(p,1)}</span></div>
          </div>`).join("")}
        <div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:baseline">
          <div style="color:var(--ink-2)">月净利润</div>
          <div style="font-family:var(--font-serif);font-size:22px;font-weight:600;color:${r.profit>0?"var(--teal)":"var(--rose)"};font-variant-numeric:tabular-nums">
            ${r.profit>=0?"+":""}${fmtMoney(r.profit)} <span style="font-size:11px;color:var(--ink-3)">${fmtPct(r.profitMargin,1)}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="grid g-2" style="margin-bottom:14px">
      <div class="card">
        <div class="card-head"><h3>保本点分析</h3></div>
        <div class="card-body">
          <div class="row-list">
            <div class="item"><span class="lbl">每月固定支出</span><span class="val">${fmtMoney(r.rentMonthly+r.mgmtMonthly+r.labor+r.utility)}</span></div>
            <div class="item"><span class="lbl">保本月营业额</span><span class="val">${r.breakevenMonthly===null?"—":fmtMoney(r.breakevenMonthly)}</span></div>
            <div class="item"><span class="lbl">保本日营业额</span><span class="val">${r.breakevenDaily===null?"—":fmtMoney(r.breakevenDaily)}</span></div>
            <div class="item"><span class="lbl">安全边际</span><span class="val" style="color:${r.safetyMargin>=0.5?"var(--teal)":r.safetyMargin>=0?"var(--amber)":"var(--rose)"}">${(r.safetyMargin*100).toFixed(0)}%</span></div>
          </div>
          ${r.passbyNeeded ? `
            <div class="tip ${r.safetyMargin>=0.5?"ok":r.safetyMargin>=0?"":"err"}" style="margin-top:12px">
              <strong>门槛客流</strong> · 每天至少做 ${fmtMoney(r.breakevenDaily)} 才不亏<br>
              ≈ ${r.passbyNeeded.dailyOrders} 单 (客单 ¥${input.ticket})<br>
              ≈ ${r.passbyNeeded.dailyEnter} 人进店 (成交率 ${fmtPct(b.purchaseRate||0.3,0)})<br>
              ≈ ${r.passbyNeeded.dailyPassby} 人过路 (进店率 ${fmtPct(b.passbyRate||0.05,0)})
            </div>` : ""}
          ${r.conversionInfo ? `
            <div class="tip info" style="margin-top:8px">
              按你输入的过路客流 ${fmtNum(input.passby)} 人/日 估算:<br>
              日进店 ${r.conversionInfo.dailyEnter} 人 · 日成交 ${r.conversionInfo.dailyOrders} 单 · 月营业额 ${fmtWan(r.conversionInfo.monthlySales)}元
            </div>` : ""}
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>敏感性分析</h3><span class="h-acc">${input.years} 年合同 · 含递增复利</span></div>
        <div class="card-body" style="padding:0">
          <div class="tbl-wrap" style="border:none;border-radius:0">
            <table class="tbl">
              <thead><tr><th>场景</th><th class="num">月营业额</th><th class="num">月利润</th><th>结论</th></tr></thead>
              <tbody>
              ${r.scenarios.map(s=>{
                const ok = s.r.profit>0;
                const conclusion = s.r.profit>0 && s.r.profit > r.profit*0.5 ? `<span class="badge ok"><span class="dot"></span>可行</span>` :
                                   s.r.profit>0 ? `<span class="badge warn"><span class="dot"></span>勉强</span>` :
                                   s.r.profit > -monthlySales*0.05 ? `<span class="badge warn"><span class="dot"></span>预警</span>` :
                                   `<span class="badge err"><span class="dot"></span>不建议</span>`;
                return `<tr>
                  <td>${escapeHtml(s.name)}</td>
                  <td class="num">${fmtMoney(s.r.sales)}</td>
                  <td class="num" style="color:${ok?"var(--teal)":"var(--rose)"}">${ok?"+":""}${fmtMoney(s.r.profit)}</td>
                  <td>${conclusion}</td>
                </tr>`;
              }).join("")}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    ${(()=>{
      // === v2:现金流压力卡 ===
      if(!r.cashflow) return "";
      const cf = r.cashflow;
      return `
    <div class="card">
      <div class="card-head"><h3>💰 现金流压力测试</h3><span class="h-acc">前 ${cf.rampMonths} 个月营收按 60% 估算</span></div>
      <div class="card-body">
        <div class="grid g-3" style="gap:14px">
          <div class="kpi" style="background:var(--bg-2);padding:14px 16px;border-radius:8px">
            <div class="lbl" style="color:var(--ink-4);font-size:11px">推荐总备用金</div>
            <div class="value" style="font-size:22px;font-weight:700;color:var(--accent);margin-top:4px">${fmtMoney(cf.recommendedReserve)}</div>
            <div style="font-size:11px;color:var(--ink-4);margin-top:6px">总投资 ${fmtMoney(r.totalInvest)} + 爬坡亏损 ${fmtMoney(cf.cumLossInRamp)} + ${cf.reserveMonths} 月固定支出</div>
          </div>
          <div class="kpi" style="background:var(--bg-2);padding:14px 16px;border-radius:8px">
            <div class="lbl" style="color:var(--ink-4);font-size:11px">月固定支出</div>
            <div class="value" style="font-size:22px;font-weight:700;margin-top:4px">${fmtMoney(cf.monthlyFixed)}</div>
            <div style="font-size:11px;color:var(--ink-4);margin-top:6px">不论营业额多少,每月雷打不动要付的</div>
          </div>
          <div class="kpi" style="background:var(--bg-2);padding:14px 16px;border-radius:8px">
            <div class="lbl" style="color:var(--ink-4);font-size:11px">真实回本期</div>
            <div class="value" style="font-size:22px;font-weight:700;margin-top:4px">${cf.realPaybackMonths || "—"} 月</div>
            <div style="font-size:11px;color:var(--ink-4);margin-top:6px">含 ${cf.rampMonths} 个月爬坡期,比简单回收期更实</div>
          </div>
        </div>
        <div class="tip" style="margin-top:14px;background:var(--bg-2);padding:12px;border-radius:6px;font-size:12px;color:var(--ink-3)">
          💡 <strong>给品牌方/加盟商的话术</strong>:开店前一定准备 <strong>${fmtMoney(cf.recommendedReserve)}</strong> 的备用金。前 ${cf.rampMonths} 个月营业额可能只有正常的 60%,但租金/人工/水电照付。低估这一项是 80% 新店亏损倒闭的真实原因。
        </div>
      </div>
    </div>`;
    })()}

    ${(()=>{
      // v7:合并工程交付速查 + 同业冲突预警为一张折叠卡,瘦身
      const eng = Calc.engStandard(input.sub);
      const subBiz = input.sub;
      const sameMall = subBiz ? (state.deals.filter(d=> d.subBiz===subBiz).length
                       + state.shops.filter(s=> s.subBiz===subBiz && s.status!=="已流失").length) : 0;
      let competeMsg = "", competeKind = "ok";
      if(sameMall >= 5){ competeKind = "warn"; competeMsg = `本商场已有 ${sameMall} 家"${subBiz}",品牌方需评估市场容量,差异化定位很重要。`; }
      else if(sameMall >= 1){ competeMsg = `本商场已有 ${sameMall} 家"${subBiz}",可控,新进品牌需打出差异化。`; }
      else if(subBiz) { competeMsg = `本商场是"${subBiz}"的首家,可享首店议价空间。`; }

      if(!eng && !competeMsg) return "";
      const fields = [
        {k:"floorHeight", lbl:"层高/净高"},{k:"loadLimit", lbl:"楼板承重"},{k:"power", lbl:"用电指标"},
        {k:"water", lbl:"给水"},{k:"drainage", lbl:"排水"},{k:"sewage", lbl:"排污"},
        {k:"gas", lbl:"燃气"},{k:"ac", lbl:"空调"},{k:"exhaust", lbl:"排油排烟"},
        {k:"freshAir", lbl:"新风"},{k:"fire", lbl:"消防"},{k:"special", lbl:"特殊要求"},{k:"columnSpan", lbl:"柱网"}
      ];
      return `
    <div class="card">
      <div class="card-head"><h3>🏗️ 工程交付要求 / 同业密度</h3><span class="h-acc">谈判砝码 + 市场容量参考</span></div>
      <div class="card-body">
        ${competeMsg ? `<div class="tip ${competeKind}" style="margin-bottom:12px"><strong>同业品牌密度:</strong> ${escapeHtml(competeMsg)}</div>` : ""}
        ${eng ? `
          <details>
            <summary style="cursor:pointer;font-size:13px;color:var(--ink-2);padding:6px 0">▸ 业态工程交付清单 · ${escapeHtml(input.sub)}(展开查看,实测对照议价)</summary>
            <table class="tbl" style="font-size:12px;margin-top:8px">
              ${fields.filter(f=>eng[f.k]).map(f=>`
                <tr><td style="width:100px;color:var(--ink-4);padding:6px 12px;vertical-align:top">${f.lbl}</td><td style="padding:6px 12px">${escapeHtml(eng[f.k])}</td></tr>
              `).join("")}
            </table>
            <div class="tip" style="margin-top:8px;font-size:12px">📐 不达标的项要么改造要么扣价 — 这就是议价砝码。</div>
          </details>` : ""}
      </div>
    </div>`;
    })()}

    <div class="card">
      <div class="card-head"><h3>结论与建议</h3></div>
      <div class="card-body">
        ${
          (health.kind==="ok" && paybackOk && r.profit>0) ?
            `<div class="tip ok"><strong>✓ 推荐签约</strong> · 商户能赚钱,双方共赢<br>当前条件下租售比、回收期、净利润三项核心指标均处于健康区间。</div>` :
          (r.profit<=0) ?
            `<div class="tip err"><strong>✗ 不建议签约</strong> · 当前条件下商户月度亏损 ${fmtMoney(-r.profit)},无回收期可言。<br>建议:① 下调租金 ② 增加免租期 ③ 提供装修补贴 ④ 重新评估营业额预期</div>` :
          (health.kind==="err") ?
            `<div class="tip err"><strong>⚠ 风险偏高</strong> · 租售比 ${fmtPct(r.rentRatio,1)} 超过该业态健康上限,商户长期经营压力大。<br>即使短期能签,后期会出现"开不下去 → 转让 → 空铺"循环,建议适度降租。</div>` :
            `<div class="tip"><strong>○ 可签,但需谨慎</strong> · 财务模型边际可行,建议:<br>① 安全边际仅 ${(r.safetyMargin*100).toFixed(0)}%(健康值 >50%),抗风险能力较弱<br>② 优先考虑短期合同观察 1-2 年<br>③ 或在合同中加入"经营保障条款"</div>`
        }
        <div class="grid g-2" style="margin-top:14px">
          <button class="btn" onclick="state.toolboxTab='loi';navigate('toolbox')">→ 生成租赁意向书 (LOI)</button>
          <button class="btn" onclick="state.toolboxTab='approval';navigate('toolbox')">→ 生成内部审批建议书</button>
        </div>
      </div>
    </div>
  `;
}

Views.toolbox = function(root){
  const tab = state.toolboxTab || "equiv";
  root.innerHTML = `
    <div class="section-head">
      <div><h2>招商条件工具箱</h2><div class="desc">等效租金 · 谈判沙盘 · LOI · 审批建议书</div></div>
    </div>
    <div class="tabs" style="margin-bottom:18px" id="tbTabs">
      <button data-tab="equiv" class="${tab==='equiv'?'active':''}">🧮 等效租金计算器</button>
      <button data-tab="negotiation" class="${tab==='negotiation'?'active':''}">⚔️ 谈判沙盘</button>
      <button data-tab="loi" class="${tab==='loi'?'active':''}">📄 LOI 生成器</button>
      <button data-tab="approval" class="${tab==='approval'?'active':''}">📝 审批建议书</button>
    </div>
    <div id="tbBody"></div>
  `;
  $$("#tbTabs button").forEach(b=> b.onclick = ()=>{ state.toolboxTab = b.dataset.tab; render(); });
  if(tab==="equiv") renderEquiv();
  else if(tab==="negotiation") renderNegotiation();
  else if(tab==="loi") renderLOI();
  else renderApproval();
};

/* ============================================================
   M4 · 招商报价审批单 (一页纸 PDF)

function generateApprovalSheet(){
  const pInput = state.pricing && state.pricing.input;
  const pResult = state.pricing && state.pricing.result;
  const cfg = state.approval || {};

  if(!pInput || !pResult){
    alert('请先在「报价测算」完成测算, 再生成报价审批单');
    return;
  }

  /* 单号 */
  const ts = new Date();
  const datePart = ts.getFullYear()+String(ts.getMonth()+1).padStart(2,'0')+String(ts.getDate()).padStart(2,'0');
  const sn = String(Math.floor(Math.random()*900)+100);
  const approvalNo = `APR-${datePart}-${sn}`;

  /* 报价方案 */
  const rent = cfg.rent || pResult.recommend || 0;
  const mgmt = cfg.mgmt || 0;
  const free = cfg.free || 3;
  const incr = cfg.incr || 5;
  const years = cfg.years || 5;
  const allow = cfg.allow || 0;
  const area = pInput.area || 0;
  /* 等价月租 */
  let eqR = null;
  try{ eqR = Calc.equivRent({rent, area, years, incrPct:incr, freeMonths:free, allowance:allow*10000, discountPct:0, mgmt}); }catch(e){}
  const equiv = eqR ? eqR.equiv : rent;
  const totalRent = +(rent * area * 12 * years * (1 - free/(years*12))).toFixed(0);

  /* 底价对照 */
  const shopId = pInput.shopId || '';
  const rp = (state.reservedPrice && state.reservedPrice.shops && state.reservedPrice.shops[shopId]) || null;
  let compareHtml = '';
  if(rp && rp.rentFloor){
    const dlt = rent - rp.rentFloor;
    const pct = ((dlt/rp.rentFloor)*100).toFixed(1);
    const ok1 = dlt >= 0;
    const ok2 = !rp.freeMonthsCap || free <= rp.freeMonthsCap;
    const totalConcession = free*rent*area/12 + (allow||0);
    const ok3 = !rp.totalConcessionCap || totalConcession/10000 <= rp.totalConcessionCap;
    compareHtml = `<div class="block">
      <div class="block-title">四、底价对照 · 仅审批可见</div>
      <div class="compare-box">
        <div class="compare-line"><span style="min-width:90px;color:#666">单价 vs 底价</span><span>报价 ¥${rent} / 底价 ¥${rp.rentFloor}</span><span style="margin-left:auto;color:${ok1?'#3fb6a8':'#e8576b'};font-weight:600">${ok1?'✓':'⚠'} ${ok1?'高于':'低于'}底价 ¥${Math.abs(dlt).toFixed(2)}/㎡/月 (${ok1?'+':''}${pct}%)</span></div>
        ${rp.freeMonthsCap ? `<div class="compare-line"><span style="min-width:90px;color:#666">免租 vs 上限</span><span>报价 ${free} / 上限 ${rp.freeMonthsCap} 个月</span><span style="margin-left:auto;color:${ok2?'#3fb6a8':'#e8576b'}">${ok2?'✓':'⚠'} ${ok2?'未超':'已超'}免租上限 (${free}${ok2?'≤':'>'}${rp.freeMonthsCap}个月)</span></div>` : ''}
        ${rp.totalConcessionCap ? `<div class="compare-line"><span style="min-width:90px;color:#666">总让步 vs 上限</span><span></span><span style="margin-left:auto;color:${ok3?'#3fb6a8':'#e8576b'}">${ok3?'✓':'⚠'} ${ok3?'未超':'已超'}总让步上限 (${(totalConcession/10000).toFixed(1)}${ok3?'≤':'>'}${rp.totalConcessionCap}万)</span></div>` : ''}
        ${rp.note ? `<div style="margin-top:6px;padding-top:6px;border-top:1px dashed #ddd;font-size:9.5pt;color:#666">底价依据: ${rp.note}</div>` : ''}
      </div>
    </div>`;
  }

  /* HTML 模板 */
  const projectName = state.project && state.project.name || '(未命名项目)';
  const today = (typeof todayStr === 'function') ? todayStr() : new Date().toISOString().slice(0,10);
  const html = `<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<title>${approvalNo} · 招商报价审批单</title>
<style>@page { size: A4; margin: 12mm 14mm; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1a1a1a;font-size:11.5pt;line-height:1.5;background:#fff}
  .sheet{max-width:184mm;margin:0 auto}
  .header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #c98828;padding-bottom:10px;margin-bottom:14px}
  .title{font-size:18pt;font-weight:700;letter-spacing:1px;color:#1a1a1a}
  .subtitle{font-size:10pt;color:#666;margin-top:4px;letter-spacing:.5px}
  .header-right{text-align:right;font-size:10pt;color:#444}
  .header-right .pnum{font-family:"Consolas",monospace;font-size:11pt;color:#c98828;font-weight:600}
  .block{margin-bottom:12px;page-break-inside:avoid}
  .block-title{font-size:10.5pt;font-weight:700;color:#1a1a1a;border-left:3px solid #c98828;padding-left:8px;margin-bottom:6px;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:10.5pt}

</style></head><body>

</body></html>`;

  /* 打开新窗口 + 自动触发打印 */

/* ============================================================
   M5 · 招商周报 (一键导出 Word)
   ============================================================ */
function generateWeeklyReport(){
  const shops = state.shops || [];
  const deals = state.deals || [];
  if(shops.length === 0){
    alert('请先载入项目铺位数据');
    return;
  }
  const projectName = state.project && state.project.name || '(未命名项目)';
  const today = new Date();
  const weekStart = new Date(today); weekStart.setDate(today.getDate()-6);
  const periodStr = `${weekStart.toLocaleDateString('zh-CN')} ~ ${today.toLocaleDateString('zh-CN')}`;

  /* KPI */
  const total = shops.length;
  const signed = shops.filter(s=>s.status==='signed').length;
  const negotiating = shops.filter(s=>s.status==='negotiating' || s.status==='loi').length;
  const waiting = shops.filter(s=>s.status==='waiting' || s.status==='vacant').length;
  const signRate = total > 0 ? Math.round(signed/total*100) : 0;
  const recentDeals = deals.filter(d=>{
    if(!d.createdAt) return false;
    const dt = new Date(d.createdAt);
    return (today - dt) <= 30*24*3600*1000;
  });
  const avgRent = recentDeals.length > 0 ? Math.round(recentDeals.reduce((s,d)=>s+(+d.rent||0),0)/recentDeals.length) : 0;
  const recentDealCnt = recentDeals.length;

  /* 楼层进度 */
  const floors = {};
  shops.forEach(s=>{
    const f = s.floor || '其它';
    if(!floors[f]) floors[f] = { total:0, signed:0, area:0, signedArea:0 };
    floors[f].total++;
    floors[f].area += +s.area || 0;
    if(s.status === 'signed'){ floors[f].signed++; floors[f].signedArea += +s.area || 0; }
  });
  const floorRows = Object.keys(floors).sort().map(f=>{
    const fd = floors[f];
    const rate = fd.total>0 ? Math.round(fd.signed/fd.total*100) : 0;
    const color = rate>=70 ? '#3fb6a8' : rate>=40 ? '#c98828' : '#e8576b';
    return `<tr>
      <td><b>${f}</b></td><td>${fd.total}</td><td>${fd.signed}</td>
      <td style="color:${color};font-weight:600">${rate}%</td>
      <td>${Math.round(fd.area).toLocaleString()} ㎡</td>
      <td>${Math.round(fd.signedArea).toLocaleString()} ㎡</td>
    </tr>`;
  }).join('');

  /* 业态分布 */
  const bizMap = {};
  shops.forEach(s=>{
    const b = s.biz || '其它';
    if(!bizMap[b]) bizMap[b] = { count:0, area:0 };
    bizMap[b].count++;
    bizMap[b].area += +s.area || 0;
  });
  const totalArea = Object.values(bizMap).reduce((s,x)=>s+x.area,0);
  const bizRows = Object.keys(bizMap).sort((a,b)=>bizMap[b].count-bizMap[a].count).map(b=>{
    const bd = bizMap[b];
    return `<tr>
      <td>${b}</td><td>${bd.count}</td><td>${(bd.count/total*100).toFixed(1)}%</td>
      <td>${Math.round(bd.area).toLocaleString()} ㎡</td>
      <td>${totalArea>0?(bd.area/totalArea*100).toFixed(1):0}%</td>
    </tr>`;
  }).join('');

  /* Top 5 重点意向 */
  const topNeg = shops
    .filter(s => s.status==='negotiating' || s.status==='loi')
    .sort((a,b)=>(+b.area||0)-(+a.area||0))
    .slice(0,5);
  const topNegRows = topNeg.length === 0 ? '<tr><td colspan="6" style="color:#888">暂无意向洽谈中商户</td></tr>' :
    topNeg.map(s=>`<tr>
      <td><b>${s.shopId||s.id||'—'}</b></td><td>${s.floor||'—'}</td>
      <td>${(+s.area||0).toFixed(0)} ㎡</td>
      <td>${s.intentBrand||s.brand||'—'}</td><td>${s.subBiz||s.biz||'—'}</td>
      <td>${s.owner||'—'}</td>
    </tr>`).join('');

  /* HTML 模板 */
  const html = `<div id="weeklyReportContent" class="report" style="font-family:'Microsoft YaHei',sans-serif;padding:24px;background:#fff;color:#1a1a1a">
    <div style="text-align:center;border-bottom:2px solid #c98828;padding-bottom:14px;margin-bottom:18px">
      <h1 style="margin:0;font-size:24pt;letter-spacing:1px">${escapeHtml(projectName)} · 招商周报</h1>
      <div style="font-size:11pt;color:#888;margin-top:6px">MallPlan Leasing Weekly Report</div>
      <div style="font-size:11pt;color:#666;margin-top:4px">报告周期 ${periodStr}</div>
      <div style="font-size:10pt;color:#888;margin-top:2px">汇报人 ${escapeHtml(state.project&&state.project.owner||'—')} · 生成于 ${today.toLocaleDateString('zh-CN')}</div>
    </div>

    <h2 style="border-left:3px solid #c98828;padding-left:8px;font-size:14pt;margin:18px 0 10px">一、本周招商总览</h2>
    <table style="width:100%;border-collapse:collapse;text-align:center;margin-bottom:12px"><tr>
      <td style="border:1px solid #ddd;padding:14px"><div style="font-size:10pt;color:#888">总铺位</div><div style="font-size:22pt;font-weight:700;color:#1a1a1a">${total}</div><div style="font-size:9pt;color:#888">个</div></td>
      <td style="border:1px solid #ddd;padding:14px"><div style="font-size:10pt;color:#888">已签约</div><div style="font-size:22pt;font-weight:700;color:#3fb6a8">${signed}</div><div style="font-size:9pt;color:#888">个</div></td>
      <td style="border:1px solid #ddd;padding:14px"><div style="font-size:10pt;color:#888">意向洽谈</div><div style="font-size:22pt;font-weight:700;color:#c98828">${negotiating}</div><div style="font-size:9pt;color:#888">个</div></td>
      <td style="border:1px solid #ddd;padding:14px"><div style="font-size:10pt;color:#888">待招商</div><div style="font-size:22pt;font-weight:700;color:#888">${waiting}</div><div style="font-size:9pt;color:#888">个</div></td>
      <td style="border:1px solid #ddd;padding:14px"><div style="font-size:10pt;color:#888">签约率</div><div style="font-size:22pt;font-weight:700;color:${signRate>=70?'#3fb6a8':signRate>=40?'#c98828':'#e8576b'}">${signRate}%</div></td>
    </tr></table>
    <div style="font-size:11pt;margin-bottom:6px"><b>本周关键结论:</b></div>
    <ul style="font-size:11pt;line-height:1.8;color:#444;margin:0 0 0 20px">
      <li>整体签约率 ${signRate}%, ${signRate>=70?'招商进度健康':signRate>=40?'进度可控, 关注待招商铺位攻坚':'⚠ 进度偏慢, 建议加大资源投入'}</li>
      <li>本周新增成交 ${recentDealCnt} 笔</li>
      ${avgRent>0 ? `<li>近 30 天签约均价 ¥${avgRent} 元/㎡/月 (共 ${recentDealCnt} 笔)</li>` : ''}
    </ul>

    <h2 style="border-left:3px solid #c98828;padding-left:8px;font-size:14pt;margin:18px 0 10px">二、各楼层招商进度</h2>
    <table style="width:100%;border-collapse:collapse;font-size:11pt">
      <thead><tr style="background:#f5f2ea">
        <th style="border:1px solid #ddd;padding:6px">楼层</th><th style="border:1px solid #ddd;padding:6px">总铺数</th>
        <th style="border:1px solid #ddd;padding:6px">已签约</th><th style="border:1px solid #ddd;padding:6px">签约率</th>
        <th style="border:1px solid #ddd;padding:6px">总面积</th><th style="border:1px solid #ddd;padding:6px">已签面积</th>
      </tr></thead><tbody>${floorRows}</tbody></table>

    <h2 style="border-left:3px solid #c98828;padding-left:8px;font-size:14pt;margin:18px 0 10px">三、业态分布</h2>
    <table style="width:100%;border-collapse:collapse;font-size:11pt">
      <thead><tr style="background:#f5f2ea">
        <th style="border:1px solid #ddd;padding:6px">业态</th><th style="border:1px solid #ddd;padding:6px">铺位数</th>
        <th style="border:1px solid #ddd;padding:6px">占比</th><th style="border:1px solid #ddd;padding:6px">总面积</th>
        <th style="border:1px solid #ddd;padding:6px">面积占比</th>
      </tr></thead><tbody>${bizRows}</tbody></table>

    <h2 style="border-left:3px solid #c98828;padding-left:8px;font-size:14pt;margin:18px 0 10px">四、Top 5 重点意向商户</h2>
    <table style="width:100%;border-collapse:collapse;font-size:11pt">
      <thead><tr style="background:#f5f2ea">
        <th style="border:1px solid #ddd;padding:6px">铺位</th><th style="border:1px solid #ddd;padding:6px">楼层</th>
        <th style="border:1px solid #ddd;padding:6px">面积</th><th style="border:1px solid #ddd;padding:6px">意向品牌</th>
        <th style="border:1px solid #ddd;padding:6px">业态</th><th style="border:1px solid #ddd;padding:6px">负责人</th>
      </tr></thead><tbody>${topNegRows}</tbody></table>

    <h2 style="border-left:3px solid #c98828;padding-left:8px;font-size:14pt;margin:18px 0 10px">五、下周重点</h2>
    <ul style="font-size:11pt;line-height:1.8;color:#444;margin:0 0 0 20px">
      <li>推进待招商铺位 ${waiting} 个的开发, 优先攻坚高紧迫度</li>
      <li>跟进意向洽谈中的 ${negotiating} 个商户, 推动签约转化</li>
      <li>招商进度数据库定期复盘, 沉淀本企业基准</li>
    </ul>

    <div style="margin-top:24px;padding-top:12px;border-top:1px dashed #ccc;font-size:9pt;color:#888;text-align:center">
      本报告由 MallPlan 招商算账 v1.0 自动生成 · ${today.toLocaleDateString('zh-CN')}<br>
      数据范围: 本项目铺位 + 历史成交库 · 仅供内部使用
    </div>
  </div>`;

  /* 临时挂到 body, 调用 exportReportAsWord 导出, 然后移除 */
  const wrap = document.createElement('div');
  wrap.id = '_wkr_wrap';
  wrap.style.cssText = 'position:absolute;left:-99999px;top:0;';
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
  try{
    exportReportAsWord('weeklyReportContent', `${projectName}_招商周报_${today.toISOString().slice(0,10)}.doc`);
    try{ MallPlanStore.log({ action:'export_weekly_report', project:projectName, total, signed, signRate, period:periodStr }); }catch(e){}
  }finally{
    setTimeout(()=>{ try{ document.body.removeChild(wrap); }catch(e){} }, 1000);
  }
}


function renderLOI(){
  const pInput = state.pricing?.input;
  const pResult = state.pricing?.result;
  const mInput = state.merchant?.input;
  const mResult = state.merchant?.result;

  if(!pInput || !pResult){
    $("#tbBody").innerHTML = `<div class="card"><div class="card-body empty"><div class="ico">⚠</div>请先在「报价测算」中完成测算<br><button class="btn sm" style="margin-top:10px" onclick="navigate('pricing')">前往报价测算</button></div></div>`;
    return;
  }

  const last = state.loi || {};
  $("#tbBody").innerHTML = `
    <div class="grid g-2" style="grid-template-columns:1fr 1.5fr;align-items:flex-start">
      <div class="card">
        <div class="card-head"><h3>LOI 配置</h3></div>
        <div class="card-body">
          <div class="grid g-2">
            <div class="field"><label>品牌方</label><input class="input" id="l_brand" value="${escapeHtml(last.brand||"")}" placeholder="如 海底捞"></div>
            <div class="field"><label>意向书编号</label><input class="input" id="l_no" value="${escapeHtml(last.no||"LOI-"+todayStr().replace(/-/g,""))}"></div>
            <div class="field"><label>租金 元/㎡/月</label><input class="input" type="number" id="l_rent" value="${last.rent ?? pResult.recommended}"></div>
            <div class="field"><label>管理费</label><input class="input" type="number" id="l_mgmt" value="${last.mgmt ?? Calc.mgmtFee({city:state.project.city,mall:state.project.mall,projectSize:state.project.projectSize})}"></div>
            <div class="field"><label>免租期 (月)</label><input class="input" type="number" id="l_free" value="${last.free ?? 3}"></div>
            <div class="field"><label>合同年限</label><input class="input" type="number" id="l_years" value="${last.years ?? 5}"></div>
            <div class="field"><label>年递增 (%)</label><input class="input" type="number" id="l_incr" value="${last.incr ?? 5}"></div>
            <div class="field"><label>装修补贴 (万元)</label><input class="input" type="number" step="0.1" id="l_allow" value="0"></div>
            <div class="field"><label>保证金 (月)</label><input class="input" type="number" id="l_dep" value="${last.dep ?? 3}"></div>
            <div class="field"><label>建筑面积 (㎡)</label><input class="input" type="number" id="l_gross" value="${last.gross ?? Math.round(pInput.area*1.2)}"></div>
          </div>
          <div class="tabs" style="margin-top:14px" id="loiVer">
            <button class="active" data-v="merchant">商户版 (发给品牌)</button>
            <button data-v="full">完整版 (内部留档)</button>
          </div>
          <div style="display:flex;gap:8px;margin-top:12px">
            <button class="btn primary" style="flex:1" id="l_run">生成预览</button>
            <button class="btn" id="l_print">打印 / PDF</button>
            <button class="btn" id="l_word" title="导出为 Word 文档,招商人员可继续编辑">导出 Word</button>
          </div>
        </div>
      </div>
      <div id="loiPreview"><div class="card"><div class="card-body empty">点击「生成预览」</div></div></div>
    </div>
  `;

  let version = "merchant";
  $$("#loiVer button").forEach(b=> b.onclick = ()=>{
    $$("#loiVer button").forEach(x=>x.classList.toggle("active", x===b));
    version = b.dataset.v;
    runLOI(version);
  });
  $("#l_run").onclick = ()=>runLOI(version);
  $("#l_print").onclick = ()=>{ runLOI(version); setTimeout(()=>window.print(), 200); };
  $("#l_word").onclick = ()=>{ runLOI(version); setTimeout(()=>exportReportAsWord("loiReport", `租赁意向书_${$("#l_brand").value||"品牌"}_${todayStr()}.doc`), 200); };

  function runLOI(ver){
    const cfg = {
      brand: $("#l_brand").value, no: $("#l_no").value,
      rent: +$("#l_rent").value, mgmt: +$("#l_mgmt").value,
      free: +$("#l_free").value, years: +$("#l_years").value, incr: +$("#l_incr").value,
      allow: +$("#l_allow").value, dep: +$("#l_dep").value, gross: +$("#l_gross").value
    };

          <tr><th>合同年限</th><td class="num">3 年</td><td class="num" style="background:#fffbf0">${cfg.years} 年</td><td class="num">+${cfg.years-3}年</td></tr>
          <tr style="background:#f5f5f5"><th>等效月租金</th><td class="num">¥${fmtNum(stdEqR.equiv)}</td><td class="num" style="background:#fffbf0;color:#c98828"><strong>¥${fmtNum(negEqR.equiv)}</strong></td><td class="num">${(((negEqR.equiv-stdEqR.equiv)/stdEqR.equiv)*100).toFixed(1)}%</td></tr>

        <table>
          <tr><th style="width:30%">预估月营业额</th><td>${fmtWan(mInput.sales*10000)}元 (业态月坪效 ¥${benchSub.turnoverPerSqm||0}/㎡)</td></tr>

          <tr><th>租售比</th><td>${fmtPct(mResult.rentRatio,1)} · 业态健康区间 ${fmtPct(benchSub.rentRatioMin||0,0)}—${fmtPct(benchSub.rentRatioMax||0,0)}</td></tr>

function renderDeals(){
  const filter = state.dealsFilter || {kw:"",floor:"",biz:""};
  const list = state.deals.filter(d=>{
    if(filter.kw){
      const s = filter.kw.toLowerCase();
      if(!`${d.shopId||""}${d.brand||""}${d.subBiz||""}`.toLowerCase().includes(s)) return false;
    }
    if(filter.floor && d.floor!==filter.floor) return false;
    if(filter.biz && d.biz!==filter.biz) return false;
    return true;
  }).slice().sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));

  
  /* M5 成交库分析 */
  const _dealAnalysis = (function(){
    const ds = state.deals || [];
    if(ds.length < 5){
      return `<div class="card" style="margin-bottom:14px;padding:14px 18px;background:#fdf6e9;border-left:3px solid #c98828">
        <div style="font-weight:600;margin-bottom:4px">📊 成交库分析</div>
        <div style="font-size:12px;color:#666">当前 ${ds.length} 笔成交, 达到 ≥ 5 笔后自动生成按业态分组的 P25/中位数/P75 分布; 达到 ≥ 50 笔后标记 ✓ 投决回归阈值, 投决会报告附录 B 自动联动。</div>
      </div>`;
    }
    /* 按业态分组统计 */
    const groups = {};
    ds.forEach(d=>{
      const k = d.subBiz || d.biz || '其他';
      if(!groups[k]) groups[k] = [];
      if(typeof d.rent === 'number' && d.rent > 0) groups[k].push({ rent:d.rent, area:d.area||0 });
    });
    const pct = (arr, p) => { if(!arr.length) return null; const s = arr.slice().sort((a,b)=>a-b); const i = Math.floor((s.length-1)*p); return s[i]; };
    const stats = Object.keys(groups).map(k=>{
      const rents = groups[k].map(x=>x.rent);
      const areas = groups[k].map(x=>x.area).filter(a=>a>0);
      return {
        biz:k, count:rents.length,
        avgArea: areas.length ? Math.round(areas.reduce((s,a)=>s+a,0)/areas.length) : null,
        p25: pct(rents,0.25), p50: pct(rents,0.5), p75: pct(rents,0.75),
        min: Math.min(...rents), max: Math.max(...rents)
      };
    }).sort((a,b)=>b.count-a.count);
    const reliable = ds.length >= 50;
    const rows = stats.map(s=>`<tr>
      <td>${s.biz}</td>
      <td class="num">${s.count}</td>
      <td class="num">${s.avgArea?s.avgArea+' ㎡':'—'}</td>
      <td class="num">${s.p25?s.p25.toFixed(0):'—'}</td>
      <td class="num" style="font-weight:600;color:#c98828">${s.p50?s.p50.toFixed(0):'—'}</td>
      <td class="num">${s.p75?s.p75.toFixed(0):'—'}</td>
      <td class="num" style="color:#888;font-size:12px">${s.min.toFixed(0)} ~ ${s.max.toFixed(0)}</td>
    </tr>`).join('');
    return `<div class="card" style="margin-bottom:14px;padding:14px 18px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
        <span style="font-weight:600">📊 成交库分析 (按业态)</span>
        <span style="background:${reliable?'#3fb6a8':'#c98828'};color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">${reliable?'✓ 已达投决回归阈值 (≥50 笔)':`参考样本 ${ds.length} 笔`}</span>
        <span style="color:#888;font-size:12px;margin-left:auto">中位数 = 本企业基准租金</span>
      </div>
      <div class="tbl-wrap" style="border:1px solid #eee;border-radius:6px">
        <table class="tbl"><thead><tr>
          <th>业态</th><th class="num">笔数</th><th class="num">平均面积</th><th class="num">P25</th><th class="num">中位数</th><th class="num">P75</th><th class="num">区间</th>
        </tr></thead><tbody>${rows}</tbody></table>
      </div>
    </div>`;
  })();

  $("#dbBody").innerHTML = _dealAnalysis + `
    <div class="toolbar" style="margin-bottom:14px">
      <input class="input" id="df_kw" placeholder="搜索铺位/品牌/业态" value="${escapeHtml(filter.kw)}" style="width:240px">
      <select class="select" id="df_floor" style="width:120px"><option value="">全部楼层</option>${FLOORS.map(f=>`<option ${f===filter.floor?"selected":""}>${f}</option>`).join("")}</select>
      <select class="select" id="df_biz" style="width:140px"><option value="">全部业态</option>${Object.keys(state.benchmark).map(b=>`<option ${b===filter.biz?"selected":""}>${b}</option>`).join("")}</select>
      <div style="flex:1"></div>
      <button class="btn primary sm" id="df_add">＋ 新增成交</button>
      <button class="btn sm" id="df_demo">🎁 载入完整 demo</button>
      <button class="btn sm" id="df_seed">载入 30 条历史成交</button>
      <button class="btn sm" id="df_export">导出 JSON</button>
      <button class="btn sm" id="df_sync_bridge" style="background:#fdfaf2;border-color:#c98828;color:#c98828">📤 同步到 MallPlan 中台</button>
    </div>
    <div class="card"><div class="card-body" style="padding:0">
      ${list.length===0 ? `<div class="empty" style="padding:40px"><div class="ico">∅</div>暂无符合条件的成交记录</div>` :
      `<div class="tbl-wrap" style="border:none;border-radius:0;max-height:65vh">
        <table class="tbl"><thead><tr>
          <th>铺位</th><th>楼层</th><th>品牌</th><th>业态</th><th class="num">面积</th><th class="num">租金</th><th class="num">租售比</th><th>免租</th><th>时间</th><th></th>
        </tr></thead><tbody>
        ${list.map(d=>`<tr>
          <td class="strong">${escapeHtml(d.shopId)}</td>
          <td>${escapeHtml(d.floor||"—")}</td>
          <td>${escapeHtml(d.brand||"—")}</td>
          <td>${escapeHtml(d.subBiz||d.biz||"—")}</td>
          <td class="num">${fmtNum(d.area)}</td>
          <td class="num">¥${fmtNum(d.rent)}</td>
          <td class="num">${d.rentToSales?fmtPct(+d.rentToSales,0):"—"}</td>
          <td>${d.free||0}月</td>
          <td>${escapeHtml(d.createdAt||"")}</td>
          <td><button class="btn sm" data-edit="${escapeHtml(d.id)}">编辑</button></td>
        </tr>`).join("")}
        </tbody></table>
      </div>`}
    </div></div>
  `;
  $("#df_kw").oninput = e=>{ state.dealsFilter={...filter,kw:e.target.value}; renderDeals(); };
  $("#df_floor").onchange = e=>{ state.dealsFilter={...filter,floor:e.target.value}; renderDeals(); };
  $("#df_biz").onchange = e=>{ state.dealsFilter={...filter,biz:e.target.value}; renderDeals(); };
  $("#df_add").onclick = ()=>{
    if(!checkFreeLimit('deals')) return;
    openDealModal();
  };
  $("#df_seed").onclick = ()=>{
    if(state.deals.length>0 && !confirm("已有数据,继续将追加 30 条示例?")) return;
    seedDeals(); render(); toast("已载入 30 条示例成交");
  };
  $("#df_demo").onclick = ()=>{
    if(!confirm("载入完整 demo 将:\n• 设置项目名称为「深圳福田某购物中心 (示例)」\n• 设置城市/商圈/商场定位\n• 添加 30 条历史成交\n• 添加 8 个待招商铺位\n\n继续?")) return;
    loadFullDemo(); render();
  };
  $("#df_export").onclick = ()=>{
    const blob = new Blob([JSON.stringify(state.deals,null,2)],{type:"application/json"});
    download(blob, `MallPlan_历史成交_${todayStr()}.json`);
  };
  $("#df_sync_bridge").onclick = ()=> syncDealsToMallPlan();
  $$("[data-edit]").forEach(b=> b.onclick = ()=>{
    const d = state.deals.find(x=>x.id===b.dataset.edit);
    if(d) openDealModal(d);
  });
}

/* ============================================================
 * M6 — syncDealsToMallPlan
 * 把招商算账本地 state.deals 的成交转为 SCHEMA.md 标准 Deal 结构,
 * 批量推送到 MallPlanStore (供投拓测算/中台引用).
 * ============================================================ */
async function syncDealsToMallPlan(){
  if(!window.MallPlanBridge){
    alert('MallPlan 中台未就绪 (Bridge 未加载)'); return;
  }
  const deals = state.deals || [];
  if(!deals.length){ alert('暂无成交记录可同步。请先「载入 30 条历史成交」或新增成交。'); return; }
  const total = deals.length;
  if(!confirm(`将把 ${total} 笔成交同步到 MallPlan 中台, 供「投拓测算」引用为本企业历史基准。\n\n• 已存在的成交会被更新(以 dealId 为准)\n• 不影响本模块的本地数据\n• 同步后投决会报告附录 B 可联动\n\n继续?`)) return;
  /* 映射本地 deal 到 SCHEMA.md 标准结构 */
  const p = state.project || {};
  const cityTier = p.cityTier || ((p.city||'').includes('北京')||(p.city||'').includes('上海')||(p.city||'').includes('广州')||(p.city||'').includes('深圳') ? '一线' : '新一线');
  const standardDeals = deals.map(d=>({
    /* 留空 dealId 让 Bridge 自动生成 */
    projectId:     p.projectId || '',
    unitId:        d.shopId ? `${p.projectId||'LOCAL'}/${d.shopId}` : '',
    brandId:       '',
    brandName:     d.brand || '',
    bizCategoryL1: d.biz || '',
    bizCategoryL2: d.subBiz || d.biz || '',
    city:          p.city || '',
    cityTier:      cityTier,
    circle:        p.circle || '',
    floorCode:     d.floor || '',
    buildingArea:  +d.area || 0,
    rentMonthly:   +d.rent || 0,
    rentDaily:     d.rent ? +(d.rent / 30).toFixed(2) : 0,
    rentMode:      '固定+递增',
    rentEscalate:  +d.incr || 3,
    rentFreeMonths:+d.free || 0,
    leaseYears:    +d.years || 5,
    dealDate:      d.createdAt || new Date().toISOString().slice(0,10),
    source:        '本项目签约',
    confidence:    'high',   /* 本企业实际签约 = high */
    remarks:       d.note || ''
  })).filter(d => d.rentMonthly > 0 && d.brandName);
  if(!standardDeals.length){ alert('成交记录中无可同步项 (缺品牌名或租金)。'); return; }

  /* 同步项目档案 */
  try{
    if(p && p.name){
      await MallPlanBridge.putProject({
        projectId:    p.projectId || undefined,
        name:         p.name,
        city:         p.city || '',
        cityTier:     cityTier,
        district:     p.district || '',
        circle:       p.circle || '',
        propertyType: p.propertyType || '购物中心',
        grossArea:    +p.gfa || 0,
        leasableArea: +p.leasableArea || 0,
        positioning:  p.positioning || '',
        owner:        p.owner || ''
      });
    }
  }catch(e){ console.warn('[syncDealsToMallPlan] project',e); }

  /* 批量推 */
  let okCount = 0;
  try{ okCount = await MallPlanBridge.pushDealsBatch(standardDeals); }
  catch(e){ console.warn('[syncDealsToMallPlan] batch',e); }

  /* 审计 */
  try{ MallPlanStore.log({ action:'sync_deals_to_mallplan', total: total, synced: okCount, project: p.name||'本项目' }); }catch(e){}

  /* 结果弹窗 (用现成 modal 样式更优, 这里简化为 alert) */
  const msg = `<p>✓ 已成功把 <b>${okCount}</b> 笔成交同步到 MallPlan 中台</p>` +
    `<p style="color:#666;font-size:12px;margin-top:8px">• 现在在「<b>投拓测算</b>」收入测算页可看到本企业基准卡片<br>` +
    `• 若 ≥50 笔, 投决会报告附录 B 自动启用历史回归</p>`;
  /* 自定义弹窗 */
  const w = document.createElement('div');
  w.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center';
  w.innerHTML = `<div style="background:#fff;padding:24px 30px;border-radius:8px;max-width:480px;box-shadow:0 8px 32px rgba(0,0,0,.2);font-family:inherit">
    <div style="font-size:16px;font-weight:600;margin-bottom:12px;color:#1a1a1a">📤 同步完成</div>
    <div style="font-size:13px;line-height:1.6">${msg}</div>
    <div style="text-align:right;margin-top:18px"><button class="btn primary" style="padding:6px 16px" onclick="this.closest('.m6sync-modal').remove()">知道了</button></div>
  </div>`;
  w.className = 'm6sync-modal';
  document.body.appendChild(w);
}

        🔒 <strong style="color:var(--amber)">试用版限制</strong>:毛利率 / 健康租售比 / 总投资明细等核心字段已模糊处理,激活专业版可查看完整数据并编辑基准库。
        <button class="btn sm primary" style="margin-left:10px" onclick="showLicenseDialog()">查看升级方案 →</button>
      </div>` : ''}
    <div style="margin-top:10px;font-size:11.5px;color:var(--ink-4);line-height:1.7">
      💡 <strong>三大维度速读:</strong>
      <span style="color:var(--amber)">▌ 黄色 = 租金</span>(基础租金)·
      <span style="color:var(--teal)">▌ 青色 = 营业额</span>(月坪效 → 月营业额 = 坪效×面积、客单价)·
      <span style="color:var(--violet)">▌ 紫色 = 投资标准</span>(总开店投资/㎡ + 装修/设备/货品/其他四项明细);非基准位会显示「基准 / 当前」两个值,反映不同城市/商场场景下的真实差异。
    </div>
  `;
  $$("[data-bb]").forEach(b=> b.onclick = ()=>{ state.benchTab = b.dataset.bb; render(); });
  $$("[data-bedit]").forEach(b=> b.onclick = ()=>{
    /* v12.0:试用版禁止编辑基准库 */
    if(b.dataset.trialLock === '1'){ showUpgradeRequiredModal('feature'); return; }
    openBenchEdit(biz, b.dataset.bedit);
  });
  $("#bb_export").onclick = ()=>{
    /* v12.0:试用版禁止导出基准库 JSON */
    if(typeof license!=='undefined' && (license.tier==='free'||license.tier==='trial')){
      showUpgradeRequiredModal('feature');
      return;
    }
    const blob = new Blob([JSON.stringify(state.benchmark,null,2)],{type:"application/json"});
    download(blob, `MallPlan_业态基准_${todayStr()}.json`);
  };
  $("#bb_import").onclick = ()=>{
    /* v12.0:试用版禁止导入基准库 */
    if(typeof license!=='undefined' && (license.tier==='free'||license.tier==='trial')){
      showUpgradeRequiredModal('feature');
      return;
    }
    const inp = $("#fileImport");
    inp.onchange = e=>{
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        try{
          const obj = JSON.parse(r.result);
          if(obj.categories){
            const fresh = {};
            for(const k in obj.categories){ fresh[k] = obj.categories[k].subcategories || obj.categories[k]; }
            state.benchmark = fresh;
          } else { state.benchmark = obj; }
          Store.save(); render(); toast("已导入");
        }catch(err){ toast("文件解析失败:"+err.message,"err"); }
      };
      r.readAsText(f); inp.value = "";
    };
    inp.click();
  };
  $("#bb_reset").onclick = ()=>{
    /* v12.0:试用版禁止恢复默认 */
    if(typeof license!=='undefined' && (license.tier==='free'||license.tier==='trial')){
      showUpgradeRequiredModal('feature');
      return;
    }
    if(confirm("将业态基准恢复为出厂默认?当前修改将丢失。")){
      state.benchmark = JSON.parse(JSON.stringify(DEFAULT_BENCHMARK));
      Store.save(); render(); toast("已恢复默认");
    }
  };
}

/* ============================================================
 * v7 新增:🔒 租决底价模块
 *
 * 设计要点:
 * - 租决是商场内部机密文件,作为招商人员谈判底线参考
 * - 不能展示给品牌方/第三方,因此本模块:
 *   ① 通过密码解锁(本地哈希,会话级解锁)
 *   ② 数据本地存储(localStorage),不参与导出/LOI/审批
 *   ③ 在铺位测算结果区显示对照(高于/低于底价)
 * - 数据结构:state.reservedPrice = { enabled, passwordHash, shops: { [shopId]: {...} } }
 *   每个铺位可录入:rentFloor(单价底线)、freeMonthsCap(免租上限)、totalConcessionCap(总让步上限)、note
 * ============================================================ */
function renderReservedPrice(){
  const rp = state.reservedPrice = state.reservedPrice || { enabled:false, passwordHash:"", shops:{} };

  /* 状态机:
   * 1. 未启用 → 显示启用按钮 + 设置密码界面
   * 2. 已启用但本会话未解锁 → 显示密码输入界面
   * 3. 已启用且已解锁 → 显示底价管理界面 */

  if(!rp.enabled){
    $("#dbBody").innerHTML = `
      <div class="card">
        <div class="card-head"><h3>🔒 启用租决底价模块</h3><span class="h-acc">机密 · 仅本机本地存储</span></div>
        <div class="card-body">
          <div style="background:rgba(139,135,214,.06);border-left:3px solid var(--violet);border-radius:6px;padding:12px 16px;margin-bottom:14px;line-height:1.7;font-size:13px;color:var(--ink-2)">
            <strong style="color:var(--violet)">什么是租决底价?</strong><br>
            商场内部针对每个铺位制定的<strong>租金底线</strong>(单价底价 / 免租上限 / 总让步上限)。<br>
            它是招商人员谈判时的重要参考与警示线,但属于商场核心机密,<strong>绝不能展示给品牌方</strong>。<br><br>
            <strong style="color:var(--violet)">本模块如何保护机密?</strong><br>
            ① 启用时设置访问密码(SHA-256 本地哈希,刷新页面即重新解锁)<br>
            ② 数据仅存储在<strong>当前浏览器</strong>的 localStorage,不上传任何服务器<br>
            ③ <strong>不参与导出</strong>(JSON/Word 备份导出会自动剔除底价数据)<br>
            ④ <strong>不出现在</strong> LOI/审批建议书/任何对外文档中<br>
            ⑤ 仅在「铺位测算」结果区显示「✅ 高于底价」或「⚠️ 低于底价」对照
          </div>
          <div class="grid g-2">
            <div class="field"><label>设置访问密码 *</label><input class="input" type="password" id="rp_pwd1" placeholder="至少 4 位"></div>
            <div class="field"><label>再次输入确认</label><input class="input" type="password" id="rp_pwd2"></div>
          </div>
          <button class="btn primary" style="margin-top:12px" id="rp_enable">▶ 启用并设置密码</button>
          <div style="margin-top:10px;font-size:11px;color:var(--ink-4)">⚠ 密码丢失无法找回(本地哈希,无法逆向),只能重置整个模块清空数据。</div>
        </div>
      </div>`;
    $("#rp_enable").onclick = async ()=>{
      const p1 = $("#rp_pwd1").value, p2 = $("#rp_pwd2").value;
      if(!p1 || p1.length<4){ toast("密码至少 4 位","err"); return; }
      if(p1!==p2){ toast("两次密码不一致","err"); return; }
      rp.passwordHash = await hashPwd(p1);
      rp.enabled = true;
      rp.sessionUnlocked = true;
      rp.shops = rp.shops || {};
      Store.save();
      toast("租决底价模块已启用","ok");
      render();
    };
    return;
  }

  if(!rp.sessionUnlocked){
    $("#dbBody").innerHTML = `
      <div class="card" style="max-width:480px;margin:40px auto">
        <div class="card-head"><h3>🔒 解锁租决底价</h3></div>
        <div class="card-body">
          <div style="color:var(--ink-3);font-size:12px;margin-bottom:12px">本会话未解锁。输入访问密码继续:</div>
          <input class="input" type="password" id="rp_unlock_pwd" placeholder="访问密码" style="margin-bottom:10px" autofocus>
          <div style="display:flex;gap:8px">
            <button class="btn primary" id="rp_unlock" style="flex:1">解锁</button>
            <button class="btn ghost danger" id="rp_reset" title="忘记密码?重置整个模块(数据清空)">重置模块</button>
          </div>
        </div>
      </div>`;
    const tryUnlock = async ()=>{
      const pwd = $("#rp_unlock_pwd").value;
      const h = await hashPwd(pwd);
      if(h === rp.passwordHash){
        rp.sessionUnlocked = true;
        toast("已解锁(本会话有效,刷新后重置)","ok");
        render();
      } else {
        toast("密码错误","err");
      }
    };
    $("#rp_unlock").onclick = tryUnlock;
    $("#rp_unlock_pwd").addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); });
    $("#rp_reset").onclick = ()=>{
      if(!confirm("将清空所有租决底价数据并禁用模块,确定?")) return;
      state.reservedPrice = { enabled:false, passwordHash:"", shops:{} };
      Store.save();
      render();
      toast("已重置","ok");
    };
    return;
  }

  /* 已解锁:显示管理界面 */
  const shops = state.shops.slice().sort((a,b)=>(a.shopId||"").localeCompare(b.shopId||""));
  const decisions = rp.shops || {};
  const filter = state.rpFilter || "";
  const filtered = filter
    ? shops.filter(s=> (s.shopId||"").toLowerCase().includes(filter.toLowerCase()) || (s.subBiz||"").toLowerCase().includes(filter.toLowerCase()))
    : shops;

  $("#dbBody").innerHTML = `
    <div style="background:linear-gradient(135deg,rgba(139,135,214,.10),rgba(139,135,214,.03));border:1px solid var(--violet);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <span style="font-size:18px">🔒</span>
      <div style="flex:1">
        <strong style="color:var(--violet)">租决底价 · 已解锁</strong>
        <span style="color:var(--ink-3);font-size:12px;margin-left:8px">本会话生效 · 关闭浏览器或刷新即重新加锁 · 已录入 ${Object.keys(decisions).length} 个铺位</span>
      </div>
      <button class="btn sm ghost" id="rp_lock">🔒 立即重新加锁</button>
      <button class="btn sm ghost" id="rp_changePwd">改密码</button>
      <button class="btn sm ghost danger" id="rp_disable">禁用模块</button>
    </div>

    <div class="toolbar" style="margin-bottom:14px">
      <input class="input" id="rp_search" placeholder="搜索铺位编号/业态" value="${escapeHtml(filter)}" style="width:280px">
      <div style="flex:1"></div>
      <button class="btn primary sm" id="rp_addNew">＋ 新增/编辑底价</button>
    </div>

    <div class="card"><div class="card-body" style="padding:0">
      ${filtered.length===0 ? `<div class="empty" style="padding:40px"><div class="ico">🔒</div>${shops.length===0?"暂无铺位,请先在「铺位列表」录入":"无符合条件的铺位"}</div>` :
      `<div class="tbl-wrap" style="border:none;border-radius:0;max-height:65vh">
        <table class="tbl">
          <thead><tr>
            <th>铺位</th><th>楼层</th><th>面积</th><th>业态</th>
            <th class="num">单价底线<br><span style="font-weight:400;color:var(--ink-4);font-size:10px">元/㎡/月</span></th>
            <th class="num">免租上限<br><span style="font-weight:400;color:var(--ink-4);font-size:10px">月</span></th>
            <th class="num">总让步上限<br><span style="font-weight:400;color:var(--ink-4);font-size:10px">万元</span></th>
            <th>更新于</th><th></th>
          </tr></thead>
          <tbody>
          ${filtered.map(s=>{
            const dec = decisions[s.shopId] || decisions[s.id] || {};
            const has = !!(dec.rentFloor || dec.freeMonthsCap || dec.totalConcessionCap);
            return `<tr style="${has?'':'opacity:0.55'}">
              <td class="strong">${escapeHtml(s.shopId || s.id)}</td>
              <td>${escapeHtml(s.floor||"—")}</td>
              <td class="num">${fmtNum(s.area)} ㎡</td>
              <td>${escapeHtml(s.subBiz||s.biz||"—")}</td>
              <td class="num" style="color:${dec.rentFloor?"var(--amber)":"var(--ink-4)"};font-weight:${dec.rentFloor?"600":"400"}">${dec.rentFloor?"¥"+fmtNum(dec.rentFloor):"—"}</td>
              <td class="num">${dec.freeMonthsCap||"—"}</td>
              <td class="num">${dec.totalConcessionCap?"¥"+dec.totalConcessionCap+" 万":"—"}</td>
              <td style="font-size:11px;color:var(--ink-3)">${escapeHtml(dec.updatedAt||"—")}</td>
              <td>
                <button class="btn sm" data-rp-edit="${escapeHtml(s.shopId||s.id)}">${has?"编辑":"录入"}</button>
                ${has?`<button class="btn sm danger" data-rp-del="${escapeHtml(s.shopId||s.id)}">清除</button>`:""}
              </td>
            </tr>`;
          }).join("")}
          </tbody>
        </table>
      </div>`}
    </div></div>

    <div style="margin-top:14px;font-size:11.5px;color:var(--ink-4);line-height:1.7">
      💡 <strong>使用说明:</strong>
      ① 录入底价后,在「铺位测算」结果区会自动显示「✅ 高于底价」或「⚠️ 低于底价」对照;
      ② 备份导出(JSON/Word)<strong>会自动剔除</strong>本模块所有数据,不会泄露给第三方;
      ③ 关闭浏览器、刷新页面、点击「重新加锁」均会重新需要密码解锁。
    </div>
  `;

  $("#rp_search").oninput = e=>{ state.rpFilter = e.target.value; renderReservedPrice(); };
  $("#rp_lock").onclick = ()=>{ rp.sessionUnlocked = false; toast("已重新加锁","ok"); render(); };
  $("#rp_changePwd").onclick = ()=>openChangePwdModal();
  $("#rp_disable").onclick = ()=>{
    if(!confirm("禁用模块将清空所有底价数据,确定?")) return;
    state.reservedPrice = { enabled:false, passwordHash:"", shops:{} };
    Store.save(); render(); toast("模块已禁用","ok");
  };
  $("#rp_addNew").onclick = ()=>openReservedPriceModal();
  $$("[data-rp-edit]").forEach(b=> b.onclick = ()=>openReservedPriceModal(b.dataset.rpEdit));
  $$("[data-rp-del]").forEach(b=> b.onclick = ()=>{

    delete rp.shops[b.dataset.rpDel];
    Store.save(); renderReservedPrice(); toast("已清除","ok");
  });
}

function openReservedPriceModal(shopIdSel, opts){
  const rp = state.reservedPrice;
  if(!rp || !rp.sessionUnlocked) return;
  const shops = state.shops;
  const cur = shopIdSel ? (rp.shops[shopIdSel] || {}) : {};
  /* v8.0:opts.onSaved — 保存后的自定义回调(从铺位测算页直接调起时,刷新对照而非跳转数据库)
   *      opts.lockShopSel — 锁定铺位选择(从铺位测算调起时,不让切换铺位) */
  const lockSel = opts && opts.lockShopSel && shopIdSel;
  modal({
    title: lockSel ? `录入/编辑租决底价 · ${escapeHtml(shopIdSel)}` : "录入/编辑租决底价",
    body:`
      <div class="grid g-2">
        <div class="field" style="grid-column:1/-1">
          <label>选择铺位 *</label>
          ${lockSel ? `
            <input class="input" id="rp_shop" value="${escapeHtml(shopIdSel)}" readonly style="background:rgba(139,135,214,.06);color:var(--violet)">
          ` : `
            <select class="select" id="rp_shop">
              <option value="">— 请选择 —</option>
              ${shops.map(s=>{
                const sid = s.shopId || s.id;
                return `<option value="${escapeHtml(sid)}" ${sid===shopIdSel?"selected":""}>${escapeHtml(sid)} · ${escapeHtml(s.floor||"")} · ${escapeHtml(s.subBiz||s.biz||"")} · ${fmtNum(s.area)}㎡</option>`;
              }).join("")}
            </select>
          `}
        </div>
        <div class="field"><label>单价底线 (元/㎡/月) *</label><input class="input" type="number" id="rp_rentFloor" value="${cur.rentFloor||""}" placeholder="如 320"></div>
        <div class="field"><label>免租期上限 (月)</label><input class="input" type="number" step="0.5" id="rp_freeMonths" value="${cur.freeMonthsCap||""}" placeholder="如 4"></div>
        <div class="field"><label>总让步上限 (万元) <span style="color:var(--ink-4);font-weight:400;text-transform:none;font-size:11px">含装修补贴等</span></label><input class="input" type="number" step="0.1" id="rp_concession" value="${cur.totalConcessionCap||""}" placeholder="如 30"></div>
        <div class="field" style="grid-column:1/-1"><label>备注 (定价依据/审批人)</label><textarea class="input" id="rp_note" rows="2" placeholder="如:2025-Q2 租决会议确定,定价依据同层 L2-15 海底捞历史成交">${escapeHtml(cur.note||"")}</textarea></div>
      </div>
    `,
    foot:[
      {label:"取消",kind:"ghost",onClick:()=>{}},
      {label:"保存",kind:"primary",close:false,onClick:()=>{
        const sid = lockSel ? shopIdSel : $("#rp_shop").value;
        if(!sid){ toast("请选择铺位","err"); return; }
        const rentFloor = +$("#rp_rentFloor").value;
        if(!rentFloor || rentFloor<=0){ toast("请填写单价底线","err"); return; }
        rp.shops[sid] = {
          rentFloor,
          freeMonthsCap: +$("#rp_freeMonths").value || null,
          totalConcessionCap: +$("#rp_concession").value || null,
          note: $("#rp_note").value.trim(),
          updatedAt: todayStr(),
          updatedBy: state.project.owner || ""
        };
        Store.save(); closeModal();
        if(opts && typeof opts.onSaved === 'function'){
          opts.onSaved();
        } else {
          renderReservedPrice();
        }
        toast("已保存","ok");
      }}
    ]
  });
}

/* v7.1 新增:从铺位测算页直接调起的租决底价快捷入口
 * 三种状态分发:
 *  ① 模块未启用 → 提示并跳转数据库去启用
 *  ② 已启用未解锁 → 跳转数据库去解锁
 *  ③ 已启用已解锁 → 直接弹录入modal,保存后重新触发测算刷新对照
 */
function openRpFromPricing(shopId){
  const rp = state.reservedPrice || {};
  if(!rp.enabled){
    if(!confirm("租决底价模块尚未启用。\n\n启用后可:\n• 为每个铺位录入单价底线 / 免租上限 / 总让步上限\n• 测算时自动显示「✅ 高于底价」或「⚠️ 低于底价」对照\n• 数据本机加密保存,绝不出现在导出/LOI/审批文档\n\n是否前往启用?")) return;
    state.dbTab = 'reservedPrice'; navigate('database');
    return;
  }
  if(!rp.sessionUnlocked){
    toast("请先到「数据库 → 🔒 租决底价」解锁本会话","info");
    state.dbTab = 'reservedPrice'; navigate('database');
    return;
  }
  if(!shopId){
    toast("请先填写铺位编号(底价需绑定具体铺位)","err");
    $("#p_id")?.focus();
    return;
  }
  /* 已解锁且有铺位ID,弹出录入modal,保存后刷新当前测算 */
  openReservedPriceModal(shopId, {
    lockShopSel: true,
    onSaved: ()=>{
      /* 重新触发测算,刷新底价对照区 */
      runPricing();
      /* 若同时停留在数据库视图,也顺手刷一下(无视图时为空操作) */
      if(currentView === 'database' && state.dbTab === 'reservedPrice'){
        renderReservedPrice();
      }
    }
  });
}

/* 按招商负责人过滤铺位与历史成交 */
function filterByOwner(owner){
  if(owner === "__ALL__"){
    return { shops: state.shops, deals: state.deals, ownerLabel: "全部" };
  }
  const myShops = state.shops.filter(s => (s.salesperson || state.project.owner || "") === owner);
  const myShopIds = new Set(myShops.map(s => s.shopId).filter(Boolean));
  const myDeals = state.deals.filter(d => {
    if(d.shopId && myShopIds.has(d.shopId)) return true;
    if(!d.shopId && (d.createdBy === owner)) return true;
    return false;
  });
  return { shops: myShops, deals: myDeals, ownerLabel: owner };
}

function exportV5Filtered(owner){
  const flt = filterByOwner(owner);
  const payload = {
    _exportVersion: "v5.0",
    _exportType: "personal-data",
    _exportedAt: new Date().toISOString(),
    _exportedBy: flt.ownerLabel,
    project: {
      name: state.project.name,
      city: state.project.city,
      circle: state.project.circle,
      mall: state.project.mall,
      projectSize: state.project.projectSize,
      mallType: state.project.mallType,
      province: state.project.province,
      district: state.project.district,
      openYear: state.project.openYear,
      gfa: state.project.gfa,
      leasableArea: state.project.leasableArea,
      anchorBrands: state.project.anchorBrands,
      owner: state.project.owner,
      floors: state.project.floors,
      customTags: state.project.customTags,
      negotiationStages: state.project.negotiationStages
    },
    shops: flt.shops,
    deals: flt.deals
    /* 注意:不含 benchmark 业态基准库,这是核心资源 */
  };
  const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const fileName = `${state.project.name||"项目"}_${flt.ownerLabel}_${todayStr()}.json`;
  download(blob, fileName);
  toast(`已导出 ${flt.ownerLabel} 的 ${flt.shops.length} 个铺位 + ${flt.deals.length} 条成交`,"ok");
}

function exportExcelFiltered(owner){
  const flt = filterByOwner(owner);
  loadXLSXLib().then(XLSX => {
    const wb = XLSX.utils.book_new();

    /* 表 1:铺位与谈判 */
    const shopRows = flt.shops.map(s => {
      const f = state.project.floors?.find(x => x.id === s.floorId);
      return {
        "铺位编号": s.shopId || "",
        "铺位名称": s.shopName || "",
        "楼层": f?.name || s.floor || "—",
        "建筑面积(㎡)": s.buildingArea || s.area || "",
        "使用面积(㎡)": s.usableArea || "",
        "面宽(米)": s.frontWidth || "",

      { "字段": "项目名称", "值": state.project.name||"" },

function exportV113Compat(owner){
  const flt = (typeof owner === "string") ? filterByOwner(owner) : { shops: state.shops, deals: state.deals, ownerLabel: "全部" };
  /* v7:导出时显式剔除 reservedPrice(租决底价)— 商场机密绝不外泄 */
  const { reservedPrice, ...stateNoSecret } = state;
  const tempState = { ...stateNoSecret, shops: flt.shops, deals: flt.deals };
  const v113 = toV113Format(tempState);
  /* 移除 _v3_extras 中的 benchmark,保护业态基准库 */
  if(v113._v3_extras) delete v113._v3_extras.benchmark;
  /* v7:再次防护 — 即便上游疏漏,导出 payload 也绝不含 reservedPrice */
  if(v113.reservedPrice) delete v113.reservedPrice;
  if(v113._v3_extras) delete v113._v3_extras.reservedPrice;
  const blob = new Blob([JSON.stringify(v113,null,2)],{type:"application/json"});
  download(blob, `${state.project.name||"项目"}_${flt.ownerLabel}.mallpkg.json`);
  toast("已导出 mallplan兼容格式(已剔除租决底价)","ok");
}

/* 动态加载 SheetJS 库(CDN) */
let _xlsxLibPromise = null;
function loadXLSXLib(){
  if(typeof XLSX !== "undefined") return Promise.resolve(XLSX);
  if(_xlsxLibPromise) return _xlsxLibPromise;
  _xlsxLibPromise = new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = ()=> resolve(typeof XLSX !== "undefined" ? XLSX : null);
    s.onerror = ()=> reject(new Error("无法加载 SheetJS,请检查网络连接"));
    document.head.appendChild(s);
  });
  return _xlsxLibPromise;
}
