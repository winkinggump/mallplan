 * 第 2 段:计算引擎
 * ============================================================ */

const Calc = {
  bench(biz, sub){
    if(!state.benchmark[biz]) return null;
    return state.benchmark[biz][sub] || null;
  },

  /* v10:物业管理费动态计算 - 行业实证:
   *   一线高端 mall 30-70 元;一线中端 25-40;新一线 18-30;二线 12-22;三线 8-15;四线 5-10;五线 3-7
   *   按城市级别 × 商场定位 × 项目体量综合推导,公式:基准 22 元 × city × mall × size
   */
  mgmtFee({city, mall, projectSize}){
    /* 一线·中端·6-10万 = 22 元/㎡/月 (基准) */
    const cityFactor = {
      "一线":1.55, "新一线":1.10, "二线":0.78, "三线":0.55, "四线":0.36, "五线":0.22
    }[city] || 1.0;
    const mallFactor = {
      "高端":1.50, "中高端":1.20, "中端":1.00, "大众":0.78, "社区邻里":0.62
    }[mall] || 1.0;
    const sizeFactor = {
      "1万以下":0.78, "1-3万":0.88, "3-6万":0.95, "6-10万":1.00, "10万以上":1.08
    }[projectSize] || 1.0;
    const base = 22;
    const fee = base * cityFactor * mallFactor * sizeFactor;
    return Math.max(3, Math.round(fee));
  },

  /* v11.0 坪效估算辅助函数:供 merchant 测算等下游使用
   * 让营业额预估和租金预估保持完全一致的数据基础
   * v11.0 修复:加入 brandTier 参数,头部品牌坪效可达基准 1.5-1.8 倍
   * v11.0 增强:加入 cityName 参数,应用具体城市微调 */
  estimateTurnoverV11({biz, subBiz, city, cityName, circle, mall, projectSize, floor, area, brandTier}){
    const catKey = BIZ_CAT_TO_BASELINE[biz] || "retail";
    let cityBaseTurnover = (BASELINE_V11.cityTurnover[city] || BASELINE_V11.cityTurnover["二线"])[catKey];

    /* 主力店独立基准 */
    if(biz === "主力店" && BASELINE_V11.anchorBaseTurnover[subBiz]){
      cityBaseTurnover = BASELINE_V11.anchorBaseTurnover[subBiz][city] || cityBaseTurnover;
    }

    let subMult = { rent:1.0, turnover:1.0, ticket:1.0 };
    if(biz === "餐饮" && BASELINE_V11.cateringSubMult[subBiz]) subMult = BASELINE_V11.cateringSubMult[subBiz];
    else if(biz === "零售" && BASELINE_V11.retailSubMult[subBiz]) subMult = BASELINE_V11.retailSubMult[subBiz];

    const circleC = (BASELINE_V11.circleTurnover[city] || BASELINE_V11.circleTurnover["二线"])[circle] ?? 1.0;
    const mallC = (BASELINE_V11.mallTier[mall] || BASELINE_V11.mallTier["中端"]).turnover;
    const sizeC = (BASELINE_V11.projectSize[projectSize] || BASELINE_V11.projectSize["6-10万"]).turnover;
    const floorC = (BASELINE_V11.floorTurnoverByBiz[biz] || BASELINE_V11.floorTurnoverByBiz["零售"])[floor || "L1"] ?? 1.0;

    /* v11.0 修复:叠加品牌系数 */
    const brandAdj = brandTier && TIER_SALES_ADJ[brandTier] ? TIER_SALES_ADJ[brandTier] : 1.0;

    /* v11.0 增强:叠加具体城市微调 */
    const cityTune = (cityName && CITY_TUNING_V11[cityName]) ? CITY_TUNING_V11[cityName].turnover : 1.0;

    const perSqm = cityBaseTurnover * circleC * mallC * sizeC * floorC * subMult.turnover * brandAdj * cityTune;
    const monthly = perSqm * (+area || 0);
    return { perSqm: Math.round(perSqm), monthly: Math.round(monthly), monthlyWan: +(monthly/10000).toFixed(1), brandAdj, cityTune };
  },

  /* v11.0 客单价估算辅助 */
  estimateTicketV11({biz, subBiz, city, cityName, mall}){
    const catKey = BIZ_CAT_TO_BASELINE[biz] || "retail";
    let cityBaseTicket = (BASELINE_V11.cityTicket[city] || BASELINE_V11.cityTicket["二线"])[catKey];
    let subMult = { rent:1.0, turnover:1.0, ticket:1.0 };
    if(biz === "餐饮" && BASELINE_V11.cateringSubMult[subBiz]) subMult = BASELINE_V11.cateringSubMult[subBiz];
    else if(biz === "零售" && BASELINE_V11.retailSubMult[subBiz]) subMult = BASELINE_V11.retailSubMult[subBiz];
    const mallC = (BASELINE_V11.mallTier[mall] || BASELINE_V11.mallTier["中端"]).ticket;
    const cityTune = (cityName && CITY_TUNING_V11[cityName]) ? CITY_TUNING_V11[cityName].ticket : 1.0;
    return Math.round(cityBaseTicket * mallC * subMult.ticket * cityTune);
  },

  /* v11.0 装修城市系数(分层):
   *  - 国际大牌/全国连锁 → 全国统一标准,城市差距很小(0.92-1.00)
   *  - 区域头部 → 适度打折(0.85-1.0)
   *  - 单店/本地 → 完全随城市(0.55-1.0,沿用原 fitOut 系数)
   * v11.0 增强:叠加具体城市微调
   */
  fitOutFactorByTier(city, brandTier, cityName){
    const orig = COEFFS.city[city]?.fitOut || BASELINE_V11.cityFitOut[city] || 1.0;
    const cityTune = (cityName && CITY_TUNING_V11[cityName]) ? CITY_TUNING_V11[cityName].fitOut : 1.0;
    let baseFactor;
    if(brandTier === '国际大牌' || brandTier === '全国连锁'){
      /* 全国连锁基本统一:差距压缩在 0.92-1.00 之间 */
      baseFactor = Math.max(0.92, 0.92 + (orig - 0.55) * (1.00 - 0.92) / (1.00 - 0.55));
    } else if(brandTier === '区域头部' || brandTier === '首进'){
      /* 区域品牌略微打折:0.85-1.00 */
      baseFactor = Math.max(0.85, 0.85 + (orig - 0.55) * (1.00 - 0.85) / (1.00 - 0.55));
    } else {
      /* 单店/本地知名/新锐:完全随城市装修水平 */
      baseFactor = orig;
    }
    /* 用具体城市再做修正:头部品牌微调系数也压缩(避免上海×1.05+全国连锁0.96冲突) */
    if(brandTier === '国际大牌' || brandTier === '全国连锁'){
      const compressedTune = 1.0 + (cityTune - 1.0) * 0.4;  /* 微调强度压缩到40% */
      return baseFactor * compressedTune;
    }
    return baseFactor * cityTune;
  },

  /* v11.0 投资品牌倍率 */
  invAdjByTier(brandTier){
    return brandTier && TIER_INV_ADJ[brandTier] ? TIER_INV_ADJ[brandTier] : 1.0;
  },

  /* v11.2 投资估算重写:固定成本 + 单位成本 × 面积
   * --------------------------------------------------------------
   * 修复"50㎡ vs 80㎡ 投资差距过大"的问题
   * 实际投资里大量成本与面积无关:
   *   - 加盟费(20-30万):全国连锁/国际大牌强制收
   *   - 设备:咖啡机/收银/POS/制冰机等 → 60% 固定 + 40% 按㎡
   *   - 装修:基础水电+设计费+证照费 → 20% 固定 + 80% 按㎡
   *   - 货品:首批入仓,纯按㎡线性
   *   - 培训/开业活动:与面积无关
   *
   * 校准目标(用户拍板):
   *   - 霸王茶姬 50㎡ 一线核心: ¥80万 (含加盟25万+装修25万+设备18万+其他12万)
   *   - 霸王茶姬 80㎡ 一线核心: ¥110万 (含加盟25万+装修40万+设备28万+其他17万)
   * ============================================================== */
  estimateInvestmentV11({biz, subBiz, city, cityName, brandTier, area}){
    const b = Calc.bench(biz, subBiz);
    if(!b) return null;
    area = +area || 0;

    const fitFactor = Calc.fitOutFactorByTier(city, brandTier, cityName);
    const invAdj = Calc.invAdjByTier(brandTier);

    /* 加盟费:全国连锁/国际大牌品牌强制收(最大固定成本) */
    let franchiseFee = 0;
    if(brandTier === '国际大牌' || brandTier === '全国连锁'){
      /* 餐饮加盟费高(15-30万),零售/教培低(5-10万) */
      if(biz === '餐饮'){
        if(['现制茶饮','精品咖啡','商务咖啡','烘焙甜品'].includes(subBiz)) franchiseFee = 25;  /* 茶饮咖啡加盟费高 */
        else if(['川渝火锅','潮汕粤式火锅','韩式烤肉'].includes(subBiz)) franchiseFee = 30;
        else franchiseFee = 18;
      } else if(biz === '零售'){
        franchiseFee = 12;
      } else if(biz === '亲子教培'){
        franchiseFee = 18;  /* 早教加盟费高 */
      } else {
        franchiseFee = 8;
      }
    } else if(brandTier === '区域头部'){
      franchiseFee = (biz === '餐饮') ? 8 : 5;
    }
    /* 区域品牌按城市等级缩放 */
    const cityScale = {"一线":1.00, "新一线":0.85, "二线":0.72, "三线":0.60, "四线":0.50, "五线":0.42}[city] || 0.72;
    franchiseFee = franchiseFee * cityScale;

    /* 装修:20% 固定(设计费/水电改造/证照) + 80% 按㎡(材料/家具) */
    const fitOutFixed = Math.round((b.fitOut || 1500) * 0.20 * area * fitFactor * invAdj * 0.18 / 1000) * 1000;  /* 固定部分换算成万元 */
    const fitOutFixedWan = Math.round((b.fitOut || 1500) * 30 * fitFactor * invAdj / 10000 * 10) / 10;  /* 30㎡的固定基础成本 */
    const fitOutPerSqm = (b.fitOut || 1500) * 0.85;  /* 单位成本(扣减固定那部分摊到㎡ 0.85 系数) */
    const decoration = +((fitOutFixedWan + fitOutPerSqm * area * fitFactor * invAdj / 10000)).toFixed(1);

    /* 设备:60% 固定(咖啡机/POS/制冰/收银) + 40% 按㎡ */
    const eqFixedWan = Math.round((b.equipment || 1000) * 25 * fitFactor * invAdj / 10000 * 10) / 10;
    const eqPerSqm = (b.equipment || 1000) * 0.65;
    const equipment = +((eqFixedWan + eqPerSqm * area * fitFactor * invAdj / 10000)).toFixed(1);

    /* 货品:纯按㎡(首批入仓) */
    const goods = +((b.goods || 300) * area * invAdj / 10000).toFixed(1);

    /* 其他(培训/办证/开业活动):60% 固定 + 40% 按㎡ */
    const otherFixedWan = Math.round((b.other || 500) * 20 * invAdj / 10000 * 10) / 10;
    const otherPerSqm = (b.other || 500) * 0.50;
    const other = +((otherFixedWan + otherPerSqm * area * invAdj / 10000) + franchiseFee).toFixed(1);  /* 加盟费归入"其他" */

    return {
      decoration,    /* 装修工程 */
      equipment,     /* 设备/货架 */
      goods,         /* 首批货品 */
      other,         /* 其他(含加盟费) */
      total: +(decoration + equipment + goods + other).toFixed(1),
      franchiseFee,  /* 加盟费(独立披露) */
      fitFactor, invAdj
    };
  },

  historyMedian(filter){
    const list = state.deals.filter(filter).map(d=>+d.rent).filter(v=>v>0);
    if(list.length===0) return null;
    list.sort((a,b)=>a-b);
    const m = Math.floor(list.length/2);
    return list.length%2 ? list[m] : (list[m-1]+list[m])/2;
  },

  /* ==================================================================
   * v11.0 全新定价模型:双锚点 + 城市内部结构系数 + 业态分层倍率
   * ------------------------------------------------------------------
   * 输入:{biz, subBiz, city, circle, mall, projectSize, floor, widthClass, anchor, area, brandTier}
   * 输出:{recommended, low, high, fast, baseRent, source, coeffs, ..., bench}
   *
   * 核心改进:
   *   ① 城市基准位:每个城市独立基准,不再用一线为唯一锚点
   *   ② 商圈系数二维:城市×商圈,一线分化大,五线趋平
   *   ③ 租金链与坪效链独立计算,互不连乘
   *   ④ 主力店7类独立基准,跳过大类倍率
   *   ⑤ 业态小类用倍率微调(餐饮内茶饮2.2x、酒楼0.4x)
   *   ⑥ 同层历史中位数加入"环境匹配判断"
   * ================================================================== */
  pricing(input){
    const {biz, subBiz, city, cityName, circle, mall, projectSize, floor, widthClass, anchor, area, brandTier} = input;
    const b = Calc.bench(biz, subBiz);
    if(!b) return null;

    let warnings = [];

    /* ============ 步骤0:具体城市微调系数 ============ */
    const cityTune = (cityName && CITY_TUNING_V11[cityName]) ? CITY_TUNING_V11[cityName] : { rent:1.0, turnover:1.0, ticket:1.0, fitOut:1.0, labor:1.0 };

    /* ============ 步骤1:获取城市×业态大类基准位 ============ */
    const catKey = BIZ_CAT_TO_BASELINE[biz] || "retail";
    let cityBaseRent = (BASELINE_V11.cityRent[city] || BASELINE_V11.cityRent["二线"])[catKey];
    let cityBaseTurnover = (BASELINE_V11.cityTurnover[city] || BASELINE_V11.cityTurnover["二线"])[catKey];
    let cityBaseTicket = (BASELINE_V11.cityTicket[city] || BASELINE_V11.cityTicket["二线"])[catKey];

    /* ============ 步骤2:主力店走独立基准 ============ */
    let isAnchor = false;
    if(biz === "主力店" && BASELINE_V11.anchorBaseRent[subBiz]){
      isAnchor = true;
      cityBaseRent = BASELINE_V11.anchorBaseRent[subBiz][city] || cityBaseRent;
      if(BASELINE_V11.anchorBaseTurnover[subBiz]){
        cityBaseTurnover = BASELINE_V11.anchorBaseTurnover[subBiz][city] || cityBaseTurnover;
      }
    }

    /* ============ 步骤3:获取业态小类倍率 (餐饮/零售内部分化) ============ */
    let subMult = { rent:1.0, turnover:1.0, ticket:1.0 };
    if(biz === "餐饮" && BASELINE_V11.cateringSubMult[subBiz]){
      subMult = BASELINE_V11.cateringSubMult[subBiz];
    } else if(biz === "零售" && BASELINE_V11.retailSubMult[subBiz]){
      subMult = BASELINE_V11.retailSubMult[subBiz];
    }
    /* 主力店不走业态倍率(因为已是独立基准) */
    if(isAnchor) subMult = { rent:1.0, turnover:1.0, ticket:1.0 };

    /* ============ 步骤4:获取各维度系数 ============ */
    const circleRentCoeff = (BASELINE_V11.circleRent[city] || BASELINE_V11.circleRent["二线"])[circle] ?? 1.0;
    const circleTurnoverCoeff = (BASELINE_V11.circleTurnover[city] || BASELINE_V11.circleTurnover["二线"])[circle] ?? 1.0;
    const mallTierC = BASELINE_V11.mallTier[mall] || BASELINE_V11.mallTier["中端"];
    const sizeC = BASELINE_V11.projectSize[projectSize] || BASELINE_V11.projectSize["6-10万"];
    const floorRentC = (BASELINE_V11.floorByBiz[biz] || BASELINE_V11.floorByBiz["零售"])[floor] ?? 1.0;
    const floorTurnoverC = (BASELINE_V11.floorTurnoverByBiz[biz] || BASELINE_V11.floorTurnoverByBiz["零售"])[floor] ?? 1.0;
    const widthC = BASELINE_V11.width[widthClass] ?? 1.0;
    const anchorC = BASELINE_V11.anchor[anchor] ?? 1.0;
    const areaFitC = coeffAreaFit(+area || 0, b.areaMin, b.areaMax);

    /* ============ 步骤5:租金链路计算 ============
     * v11.0 增强:叠加具体城市微调 cityTune.rent */
    let recommendedRent = cityBaseRent
      * circleRentCoeff
      * mallTierC.rent
      * sizeC.rent
      * floorRentC
      * subMult.rent
      * widthC
      * anchorC
      * areaFitC
      * cityTune.rent;

    /* 品牌实力调整 */
    const brandAdj = brandTier && TIER_RENT_ADJ[brandTier] ? TIER_RENT_ADJ[brandTier] : 1.0;
    recommendedRent *= brandAdj;

    /* 基准位披露给下游(主要用于商户测算) */
    let baseRent = cityBaseRent * subMult.rent * cityTune.rent;
    let source = "v11城市基准 × 多维结构系数";

    /* ============ 步骤6:同层历史中位数(加入环境匹配判断) ============ */
    const sameLayerSameBiz = Calc.historyMedian(d => d.floor===floor && d.subBiz===subBiz);
    const sameLayer        = Calc.historyMedian(d => d.floor===floor);

    /* 关键改造:同层历史中位数仅在"项目环境无变化"时才作为强参考 */
    const projEnvKey = `${city}|${circle}|${mall}|${projectSize}`;
    const sourceProjEnvKey = state._sourceProjEnv || projEnvKey;  /* 示例项目载入时记录的原始环境 */
    const envMatch = projEnvKey === sourceProjEnvKey;

    if(envMatch && sameLayerSameBiz){
      /* 环境完全匹配,历史成交可信 → 用历史中位数为锚 */
      baseRent = sameLayerSameBiz;
      recommendedRent = sameLayerSameBiz * subMult.rent * floorRentC / (BASELINE_V11.floorByBiz[biz] || BASELINE_V11.floorByBiz["零售"])[floor]  /* 抵消重复 */
                       * widthC * anchorC * areaFitC * brandAdj;
      /* 简化版:同业态同层中位数已经隐含了大部分维度,只补铺位内微观系数 */
      recommendedRent = sameLayerSameBiz * widthC * anchorC * areaFitC * brandAdj;
      source = "同层同业态历史中位数(环境匹配)";
    } else if(envMatch && sameLayer){
      /* 环境匹配但同层无同业态成交 → 同层中位数为锚,叠加业态倍率 */
      baseRent = sameLayer;
      recommendedRent = sameLayer * subMult.rent * widthC * anchorC * areaFitC * brandAdj;
      source = "同层历史中位数 + 业态倍率";
    }
    /* 环境不匹配时:不使用历史中位数,完全走 v11 基准计算路径(已在前面计算好 recommendedRent) */
    else if(sameLayerSameBiz || sameLayer){
      warnings.push("项目环境与示例数据不一致,已忽略历史成交,走 v11 城市基准模型");
    }

    /* ============ 步骤7:坪效链路计算(独立链) ============
     * v11.0 修复:坪效也叠加品牌系数,头部品牌坪效可达基准 1.5-1.8 倍
     * v11.0 增强:叠加具体城市微调 cityTune.turnover */
    const salesAdj = brandTier && TIER_SALES_ADJ[brandTier] ? TIER_SALES_ADJ[brandTier] : 1.0;
    const turnoverPerSqm = cityBaseTurnover
      * circleTurnoverCoeff
      * mallTierC.turnover
      * sizeC.turnover
      * floorTurnoverC
      * subMult.turnover
      * salesAdj
      * cityTune.turnover;
    const monthlyTurnover = turnoverPerSqm * (+area || 0);

    /* ============ 步骤8:客单价链路 ============
     * v11.0 增强:叠加具体城市微调 cityTune.ticket */
    const ticket = cityBaseTicket * mallTierC.ticket * subMult.ticket * cityTune.ticket;

    /* ============ 步骤9:租售比安全网(仅警告不修改) ============ */
    /* 餐饮租售比合理上限18%,警戒值22%(超22%为危险信号) */
    const rentMonthly = recommendedRent;
    const turnoverPerSqmSafe = Math.max(turnoverPerSqm, 1);
    const rentSalesRatio = rentMonthly / turnoverPerSqmSafe;  /* 月租金/月坪效 = 租售比 */
    if(biz === "餐饮"){
      if(rentSalesRatio > 0.22){
        warnings.push(`⚠ 租售比 ${(rentSalesRatio*100).toFixed(1)}%,超过22%警戒值,商户难以盈利,建议降租或换业态`);
      } else if(rentSalesRatio > 0.18){
        warnings.push(`💡 租售比 ${(rentSalesRatio*100).toFixed(1)}%,处于18-22%警示区,可接受但偏紧`);
      }
    } else if(biz === "零售" && rentSalesRatio > 0.20){
      if(rentSalesRatio > 0.30) warnings.push(`⚠ 租售比 ${(rentSalesRatio*100).toFixed(1)}%,零售业态超30%为危险`);
      else warnings.push(`💡 租售比 ${(rentSalesRatio*100).toFixed(1)}%,零售业态偏紧`);
    }

    /* ============ 步骤10:汇总系数(用于诊断,UI不展示) ============ */
    const coeffs = {
      city:         1.0,  /* v11 已合并到 cityBaseRent */
      bizCity:      1.0,
      circle:       circleRentCoeff,
      bizCircle:    1.0,  /* v11 已废弃,改用 subMult */
      mall:         mallTierC.rent,
      projectSize:  sizeC.rent,
      floorBiz:     floorRentC,
      width:        widthC,
      anchor:       anchorC,
      areaFit:      areaFitC,
      subMult:      subMult.rent,  /* v11 新增 */
      turnoverCoeff: turnoverPerSqm  /* v11 新增:让下游 merchant 算式直接用 */
    };
    const totalCoeff = circleRentCoeff * mallTierC.rent * sizeC.rent * floorRentC * subMult.rent * widthC * anchorC * areaFitC;

    /* 把当前项目宏观系数也披露,保持兼容性 */
    const proj = projectCoeffs({city, circle, mall, projectSize});
    /* v11:覆盖 proj.turnover 让 merchant 测算用上新坪效链(关键!)*/
    proj.v11Turnover = turnoverPerSqm;
    proj.v11Ticket = ticket;
    proj.v11RentSalesRatio = rentSalesRatio;

    return {
      recommended: Math.round(recommendedRent),
      low:  Math.round(recommendedRent * 0.92),
      high: Math.round(recommendedRent * 1.12),
      fast: Math.round(recommendedRent * 1.06),
      baseRent: Math.round(baseRent),
      source, coeffs, totalCoeff, brandAdj,
      bench: b,
      projCoeffs: proj,
      warnings,
      /* v11 新增字段 */
      v11: {
        cityBaseRent: Math.round(cityBaseRent),
        cityBaseTurnover: Math.round(cityBaseTurnover),
        cityBaseTicket: Math.round(cityBaseTicket),
        circleRentCoeff, circleTurnoverCoeff,
        subMult,
        turnoverPerSqm: Math.round(turnoverPerSqm),
        monthlyTurnover: Math.round(monthlyTurnover),
        ticket: Math.round(ticket),
        rentSalesRatio: Number(rentSalesRatio.toFixed(3)),
        isAnchor
      }
    };
  },

  /* 等效租金:把复杂条件折算成单一数字 */
  equivRent({rent, area, years, incrPct, freeMonths, allowance, discountPct, mgmt=0}){
    rent = +rent || 0; area = +area || 0; years = +years || 1;
    incrPct = (+incrPct || 0)/100; freeMonths = +freeMonths || 0;
    allowance = +allowance || 0; discountPct = +discountPct || 0;
    mgmt = +mgmt || 0;

    let totalRent = 0;
    const yearly = [];
    for(let y=0; y<years; y++){
      const yRent = rent * Math.pow(1+incrPct, y);
      const monthly = yRent * area;
      const yearTotal = monthly * 12;
      yearly.push({year:y+1, rent:Math.round(yRent), monthly:Math.round(monthly), total:Math.round(yearTotal)});
      totalRent += yearTotal;
    }
    const totalMonths = years * 12;

    const freeValue   = rent * area * freeMonths;
    const discountVal = totalRent * discountPct;
    const allowanceVal = allowance;

    const netTotal = totalRent - freeValue - allowanceVal - discountVal;
    const equiv = Math.round(netTotal / (area * totalMonths));
    const nominalAvg = Math.round(totalRent / (area * totalMonths));

    return {
      yearly, totalRent: Math.round(totalRent),
      nominalAvg, equiv,
      freeValue: Math.round(freeValue),
      discountVal: Math.round(discountVal),
      allowanceVal,
      saving: Math.round(totalRent - netTotal),
      savingPct: totalRent>0 ? (totalRent-netTotal)/totalRent : 0,
      mgmtMonthly: Math.round(mgmt * area)
    };
  },

  /* ═══════════════════════════════════════════════════════════════
   * v4 新增:谈判沙盘 - 反向策略求解
   * ═══════════════════════════════════════════════════════════════
   * 核心算法:已知"我的等效租金底线",反向求解多套等效但条件不同的方案
   * 让招商经理给品牌方"选择权",而不是"接受/拒绝"二选一
   *
   * 输入:
   *   floorPrice    - 底线租金/㎡(招商方等效租金最低不能低于这个数)
   *   counterOffer  - 品牌方还价(品牌方期望的名义租金)
   *   area          - 铺位面积
   *   years         - 合同年限(一般 5)
   *   urgency       - 紧迫度 high/mid/low(影响推荐哪个方案)
   *   baseFreeMonths - 基础免租期(行业惯例,装修期免租)
   * 输出:3 套方案,每套的等效租金、5 年总成本、对甲方实际损失、对品牌方感知差额
   */
  negotiationStrategy({floorPrice, counterOffer, area, years=5, urgency="mid", baseFreeMonths=2}){
    floorPrice = +floorPrice || 0;
    counterOffer = +counterOffer || 0;
    area = +area || 1;
    years = +years || 5;
    baseFreeMonths = +baseFreeMonths || 2;

    if(floorPrice <= 0 || counterOffer <= 0 || floorPrice <= counterOffer){
      return null;
    }

    const gap = floorPrice - counterOffer;  /* 招商方与品牌方差距 ¥/㎡ */
    const totalMonths = years * 12;

    /* 计算等效租金的辅助函数 */
    const computeEquiv = (nominalRent, freeMonths, incrPct=5, discountPct=0) => {
      let totalRent = 0;
      for(let y=0; y<years; y++){
        totalRent += nominalRent * Math.pow(1+incrPct/100, y) * area * 12;
      }
      const freeVal = nominalRent * area * freeMonths;
      const discVal = totalRent * (discountPct/100);
      const netTotal = totalRent - freeVal - discVal;
      return {
        nominalRent,
        freeMonths,
        incrPct,
        discountPct,
        totalRent: Math.round(totalRent),
        freeVal: Math.round(freeVal),
        discVal: Math.round(discVal),
        netTotal: Math.round(netTotal),
        equiv: Math.round(netTotal / (area * totalMonths)),
        perMonth: Math.round(nominalRent * area)  /* 名义月租 */
      };
    };

    /* 生成 3 套方案 ─────────────────────────────────────────────
     * 设计思路:都让品牌方"看上去"租金接近他的还价 ¥{counterOffer},
     *           但实际等效租金都不低于招商方底线 ¥{floorPrice}
     */

    /* 方案 A:租金略高于底线,大额免租期"换"——品牌方现金流舒服,可对外宣传"租金 < 底线" */
    /* 等效租金 = floorPrice 时,需多少免租期才能让 nominalRent 看起来更低?
     * 反推:netTotal = floorPrice * area * totalMonths
     *      totalRent (incrPct=5) ≈ nominalRent * area * 12 * (((1.05)^years-1)/0.05)
     * 设方案A的 nominalRent = floorPrice * 1.08(略高底线 8%)
     * 求解 freeMonths 使等效租金 = floorPrice */
    const planA_nominal = Math.round(floorPrice * 1.08);
    /* 二分搜索 freeMonths 让等效租金 = floorPrice */
    const findFreeMonths = (target, nominalRent) => {
      let lo = 0, hi = 24;
      for(let i=0; i<30; i++){
        const mid = (lo+hi)/2;
        const r = computeEquiv(nominalRent, mid, 5, 0);
        if(r.equiv > target) lo = mid; else hi = mid;
      }
      return Math.round((lo+hi)/2 * 10) / 10;
    };
    const planA_free = Math.max(baseFreeMonths, findFreeMonths(floorPrice, planA_nominal));
    const planA = computeEquiv(planA_nominal, planA_free, 5, 0);
    planA.label = "面子方案";
    planA.tagline = "租金高·免租换";
    planA.pitchToBrand = `名义租金 ¥${planA_nominal}/㎡(略高,但你能对外说"租金不到 ¥${counterOffer}"),给你 ${planA_free.toFixed(1)} 个月免租`;
    planA.pitchToOwner = `等效租金 ¥${planA.equiv}/㎡,对外报价高,有利于楼盘整体定位`;

    /* 方案 B:租金接近底线,免租正常,但取消递增——品牌方核算"前两年优惠,后期持续低价" */
    /* 等效租金 = floorPrice,nominalRent = ?,freeMonths = baseFreeMonths,incrPct = 0 */
    /* 简化:设 nominalRent = floorPrice * X,求 X 使 equiv = floorPrice (incrPct=0,不递增)
     * netTotal = nominalRent * area * totalMonths - nominalRent * area * baseFreeMonths
     *          = nominalRent * area * (totalMonths - baseFreeMonths)
     * equiv = nominalRent * (totalMonths - baseFreeMonths) / totalMonths = floorPrice
     * 所以 nominalRent = floorPrice * totalMonths / (totalMonths - baseFreeMonths) */
    const planB_nominal = Math.round(floorPrice * totalMonths / (totalMonths - baseFreeMonths));
    const planB = computeEquiv(planB_nominal, baseFreeMonths, 0, 0);  /* 不递增 */
    planB.label = "锁定方案";
    planB.tagline = "首年低·永不涨";
    planB.pitchToBrand = `首年租金 ¥${planB_nominal}/㎡(免租 ${baseFreeMonths} 个月),5 年合同 0% 递增 — 你后年起就比同行便宜`;
    planB.pitchToOwner = `锁定品牌长期入驻,品牌方对"不递增"很敏感,容易接受;等效仍然 ¥${planB.equiv}/㎡`;

    /* 方案 C:租金接近还价,招商方让步到底线 ── 转赌品牌的销售爆发(收抽成或保底) */
    /* nominalRent = counterOffer + 一点点,但用销售提点 */
    const planC_nominal = Math.round(counterOffer + (gap * 0.3));
    /* 让步幅度有限,等效租金会真实低于 floorPrice。 */
    const planC = computeEquiv(planC_nominal, baseFreeMonths, 3, 0);  /* 递增降到 3% */
    planC.label = "让步方案";
    planC.tagline = "租金低·销售提点";
    planC.pitchToBrand = `租金降到 ¥${planC_nominal}/㎡(接近你的还价),递增也降到 3%/年;但需要加销售提点条款 — 销售超出保底部分按 5-8% 抽成`;
    planC.pitchToOwner = `账面让步明显,但通过销售提点对赌品牌爆发力;等效 ¥${planC.equiv}/㎡(略低于底线 ${floorPrice-planC.equiv} 元),靠销售拉回`;
    planC.warning = planC.equiv < floorPrice ? `等效租金 ¥${planC.equiv} 低于底线 ¥${floorPrice},差额 ¥${floorPrice - planC.equiv}/㎡需用销售提点条款找回` : null;

    /* 推荐方案 */
    let recommendIdx = 1; /* 默认锁定方案 */
    let recommendReason = "锁定方案最稳健:品牌方对'不递增'敏感,招商方对'5 年长约'稳定";
    if(urgency === "high"){
      recommendIdx = 0;
      recommendReason = "紧迫度高时,面子方案最容易让品牌方点头(他能对外吹牛);你也保本";
    } else if(urgency === "low"){
      recommendIdx = 2;
      recommendReason = "时间充裕,可以试让步方案 - 用销售提点逼品牌交真数据,长期议价权在你";
    }

    return {
      input: {floorPrice, counterOffer, area, years, urgency, baseFreeMonths, gap},
      plans: [planA, planB, planC],
      recommendIdx,
      recommendReason,
      narrative: `品牌方还价 ¥${counterOffer},你的底线 ¥${floorPrice},差距 ¥${gap}/㎡(${(gap/floorPrice*100).toFixed(1)}%)。这个差距用'让租金'去填会让甲方亏,但用'调结构'(免租期/递增/销售提点)就有 3 种打法 ——`
    };
  },

  /* 商户损益模型 */
  merchant(input){
    const {rent, mgmt, area, monthlySales, grossMargin,
           staffCount, staffSalary, utility,
           inv_fitOut, inv_equipment, inv_goods, inv_other,
           years=5, incrPct=5,
           passbyDaily=0, ticket=0, biz, sub} = input;

    const rentMonthly = rent * area;
    const mgmtMonthly = mgmt * area;
    const cogs = monthlySales * (1 - grossMargin);
    const labor = staffCount * staffSalary;
    const totalCost = cogs + rentMonthly + mgmtMonthly + labor + utility;
    const profit = monthlySales - totalCost;

    const totalInvest = (+inv_fitOut + +inv_equipment + +inv_goods + +inv_other) * 10000;
    const paybackMonths = profit > 0 ? totalInvest / profit : Infinity;
    const rentRatio = monthlySales>0 ? (rentMonthly+mgmtMonthly)/monthlySales : 0;

    const fixedCost = rentMonthly + mgmtMonthly + labor + utility;
    const breakevenMonthly = grossMargin>0 ? fixedCost / grossMargin : Infinity;
    const breakevenDaily = breakevenMonthly / 30;
    const safetyMargin = monthlySales>0 ? (monthlySales - breakevenMonthly)/monthlySales : 0;

    let passbyNeeded = null, conversionInfo = null;
    const b = Calc.bench(biz, sub);
    if(b && ticket>0 && isFinite(breakevenDaily)){
      const breakevenCustomers = breakevenDaily / ticket;
      const dailyEnter = breakevenCustomers / (b.purchaseRate || 0.30);
      const dailyPassby = dailyEnter / (b.passbyRate || 0.05);
      passbyNeeded = {
        dailyOrders: Math.ceil(breakevenCustomers),
        dailyEnter: Math.ceil(dailyEnter),
        dailyPassby: Math.ceil(dailyPassby)
      };
      if(passbyDaily>0){
        const expectedEnter = passbyDaily * (b.passbyRate || 0.05);
        const expectedOrders = expectedEnter * (b.purchaseRate || 0.30);
        const expectedSales = expectedOrders * ticket * 30;
        conversionInfo = {
          dailyEnter:Math.round(expectedEnter),
          dailyOrders:Math.round(expectedOrders),
          monthlySales:Math.round(expectedSales)
        };
      }
    }

    /* 敏感性场景:租金按合同期复利平均 */
    function scenario(salesScale, rentScale){
      let totalR = 0;
      for(let y=0; y<years; y++) totalR += rent * area * 12 * Math.pow(1+incrPct/100, y);
      const avgRentMonthly = (totalR / years / 12) * rentScale;
      const s = monthlySales * salesScale;
      const c = s*(1-grossMargin) + avgRentMonthly + mgmtMonthly + labor + utility;
      return {sales:Math.round(s), profit:Math.round(s-c)};
    }
    const scenarios = [
      {name:"基准预期",                r:scenario(1.0, 1.0)},
      {name:"营业额下降 20%",          r:scenario(0.8, 1.0)},
      {name:"营业额下降 40%",          r:scenario(0.6, 1.0)},
      {name:"租金上涨 15%(含递增)",   r:scenario(1.0, 1.15)},
      {name:"营业额降30% + 租金涨10%", r:scenario(0.7, 1.10)}
    ];

    /* v2 现金流压力测试
     * 商户开店,前几个月营收只有正常 60-70%(爬坡期),但租金/人工/水电照付,管理费照付
     * 算"开店 N 个月内现金流缺口"和"建议备用金"
     */
    let cashflow = null;
    if(b && totalInvest > 0){
      const rampMonths = b.rampMonths || 3;
      const reserveMonths = b.reserveMonths || 4;
      const rampSalesPct = 0.6;  // 爬坡期营收只有 60%
      const monthlyFixed = rentMonthly + mgmtMonthly + labor + utility;
      let cumLoss = 0;
      const monthDetails = [];
      // 爬坡期:营业额 60%,逐月计算亏损
      for(let m=1; m<=rampMonths; m++){
        const monthSales = monthlySales * rampSalesPct;
        const monthCogs  = monthSales * (1-grossMargin);
        const monthProfit = monthSales - monthCogs - monthlyFixed;
        cumLoss += Math.max(0, -monthProfit);
        monthDetails.push({month:m, type:"爬坡期", sales:Math.round(monthSales), profit:Math.round(monthProfit), cumLoss:Math.round(cumLoss)});
      }
      // 稳定期:本应进入正常营业额,但商户应有"建议备用金"覆盖前 N 月
      // 备用金推荐 = 总投资 + 爬坡期累计亏损 + reserveMonths 个月固定支出
      const recommendedReserve = totalInvest + cumLoss + monthlyFixed * reserveMonths;
      // 真实回本周期(含爬坡期):
      let realPayback = null;
      if(profit > 0){
        // 爬坡期总亏损 + 总投资 = 待覆盖
        const toCoverFromStable = totalInvest + cumLoss;
        realPayback = rampMonths + Math.ceil(toCoverFromStable / profit);
      }
      cashflow = {
        rampMonths,
        reserveMonths,
        cumLossInRamp: Math.round(cumLoss),
        monthlyFixed: Math.round(monthlyFixed),
        recommendedReserve: Math.round(recommendedReserve),
        realPaybackMonths: realPayback,
        monthDetails
      };
    }

    return {
      rentMonthly: Math.round(rentMonthly),
      mgmtMonthly: Math.round(mgmtMonthly),
      cogs: Math.round(cogs),
      labor: Math.round(labor),
      utility: Math.round(utility),
      totalCost: Math.round(totalCost),
      profit: Math.round(profit),
      profitMargin: monthlySales>0 ? profit/monthlySales : 0,
      totalInvest: Math.round(totalInvest),
      paybackMonths: isFinite(paybackMonths) ? Math.round(paybackMonths*10)/10 : null,
      rentRatio,
      breakevenMonthly: isFinite(breakevenMonthly) ? Math.round(breakevenMonthly) : null,
      breakevenDaily: isFinite(breakevenDaily) ? Math.round(breakevenDaily) : null,
      safetyMargin,
      passbyNeeded, conversionInfo, scenarios,
      cashflow
    };
  },

  rentRatioHealth(ratio, biz, sub){
    const b = Calc.bench(biz, sub);
    if(!b) return {label:"无基准",kind:"mute"};
    if(ratio < b.rentRatioMin) return {label:"偏低 · 商户能赚",kind:"ok"};
    if(ratio <= b.rentRatioMax) return {label:"健康",kind:"ok"};
    if(ratio <= b.rentRatioMax*1.3) return {label:"偏高 · 风险",kind:"warn"};
    return {label:"过高 · 不建议",kind:"err"};
  },

  /* v2:工程标准查询 */
  engStandard(subBiz){
    return ENG_STANDARDS[subBiz] || null;
  },

  /* v2:品牌库查询 */
  brandsOf(subBiz){
    return BRANDS[subBiz] || [];
  },

  /* v2:同业冲突预警
   * 检查"同层 / 同商场已签同业态品牌密度"
   * 当同层同业态≥3 家,或同商场同细分业态≥5 家时给警告
   */
  competitionAlert(subBiz, floor){
    if(!subBiz) return null;
    const sameFloor   = state.deals.filter(d=> d.floor===floor && d.subBiz===subBiz).length
                      + state.shops.filter(s=> s.floor===floor && s.subBiz===subBiz && s.status!=="已流失").length;
    const sameMall    = state.deals.filter(d=> d.subBiz===subBiz).length
                      + state.shops.filter(s=> s.subBiz===subBiz && s.status!=="已流失").length;
    let level = "ok", msg = "";
    if(sameFloor >= 3){
      level = "err";
      msg = `${floor} 已有 ${sameFloor} 家"${subBiz}",密度过高,签约可能内卷。建议改业态或调铺位。`;
    } else if(sameFloor >= 2){
      level = "warn";
      msg = `${floor} 已有 ${sameFloor} 家"${subBiz}",再签需评估差异化定位。`;
    } else if(sameMall >= 5){
      level = "warn";
      msg = `本商场已有 ${sameMall} 家"${subBiz}",品牌方需评估市场容量。`;
    } else {
      msg = `${floor} 同业:${sameFloor} 家;本商场同业:${sameMall} 家,可控。`;
    }
    return { level, msg, sameFloor, sameMall };
  },

  /* v2:空铺机会成本
   * 算"如果不签这单,这个铺位空着每月损失多少机会成本"
   * 用于审批建议书,给老板看"不签也是亏"
   * v12.0 修复:改用 BASELINE_V11 独立锚点模型,解决五线城市复合系数过低(0.0182×320=5.8元/m²)的问题
   *           现在五线/社区/大众/L3/火锅 = 70 × 0.85 × 0.85 × 1.0 × 0.68 × 0.90 ≈ 30 元/m²/月,贴近市场 25-40
   */
  vacancyCost(area, biz, subBiz, city, circle, mall, floor, projectSize){
    const b = Calc.bench(biz, subBiz);
    if(!b) return null;

    /* v12.0:走 v11 独立锚点路径 */
    const catKey = BIZ_CAT_TO_BASELINE[biz] || "retail";
    let cityBaseRent = (BASELINE_V11.cityRent[city] || BASELINE_V11.cityRent["二线"])[catKey];

    /* 主力店独立基准 */
    if(biz === "主力店" && BASELINE_V11.anchorBaseRent[subBiz]){
      cityBaseRent = BASELINE_V11.anchorBaseRent[subBiz][city] || cityBaseRent;
    }

    /* 业态小类倍率 */
    let subMult = { rent:1.0, turnover:1.0, ticket:1.0 };
    if(biz === "餐饮" && BASELINE_V11.cateringSubMult[subBiz]) subMult = BASELINE_V11.cateringSubMult[subBiz];
    else if(biz === "零售" && BASELINE_V11.retailSubMult[subBiz]) subMult = BASELINE_V11.retailSubMult[subBiz];

    /* 城市内部商圈系数(独立锚点,不再 city × circle 复合) */
    const circleC = (BASELINE_V11.circleRent[city] || BASELINE_V11.circleRent["二线"])[circle] ?? 1.0;
    const mallC = (BASELINE_V11.mallTier[mall] || BASELINE_V11.mallTier["中端"]).rent;
    const sizeC = (BASELINE_V11.projectSize[projectSize] || BASELINE_V11.projectSize["6-10万"]).rent;
    const floorC = (BASELINE_V11.floorByBiz[biz] || BASELINE_V11.floorByBiz["零售"])[floor || "L1"] ?? 1.0;

    const expectedRent = cityBaseRent * subMult.rent * circleC * mallC * sizeC * floorC;
    const monthlyLoss = Math.round(expectedRent * (+area || 0));
    return {
      expectedRent: Math.round(expectedRent),
      monthlyLoss,
      yearlyLoss: monthlyLoss * 12,
      threeMonthLoss: monthlyLoss * 3,
      sixMonthLoss: monthlyLoss * 6
    };
  },

  /* v2:多铺位横向比选打分
   * 同一品牌看多个铺位,按面积、楼层、租金、面宽等综合打分
   */
  shopCompare(shop, biz, subBiz, brandTier){
    const b = Calc.bench(biz, subBiz);
    if(!b) return null;
    const score = {};
    // 面积匹配:在区间内 100 分,偏离扣分
    const area = +shop.area || 0;
    if(b.areaMin && b.areaMax){
      if(area >= b.areaMin && area <= b.areaMax) score.area = 100;
      else if(area < b.areaMin) score.area = Math.max(40, Math.round(area/b.areaMin*100));
      else score.area = Math.max(50, Math.round(b.areaMax/area*100));
    } else score.area = 80;
    // 楼层匹配
    score.floor = Math.round(coeffFloor(biz, shop.floor)*100);
    // 面宽
    const fw = +shop.frontWidth || 0;
    score.width = fw>=6 ? 100 : fw>=3 ? 85 : 70;
    // 转角
    score.corner = shop.corner ? 100 : 85;
    // 综合(等权)
    score.total = Math.round((score.area + score.floor + score.width + score.corner)/4);
    return score;
  }
};

  return `<span class="badge ${k}"><span class="dot"></span>${t}</span>`;

function bindDashboardQuickToolsEvents(){
  /* —— 租决:未启用 → 启用 —— */
  const rpEnable = $("#qt_rp_enable");
  if(rpEnable) rpEnable.onclick = ()=>{
    /* 跳转数据库租决tab,首次启用需要设置密码,沿用原有完整流程 */
    state.dbTab = 'reservedPrice';
    navigate('database');
    toast("请设置访问密码以启用租决底价模块","info");
  };

  /* —— 租决:已启用未解锁 → 当场解锁(无需跳转数据库) —— */
  const rpUnlock = $("#qt_rp_unlock");
  if(rpUnlock){
    const tryUnlock = async ()=>{
      const pwd = $("#qt_rp_pwd")?.value || "";
      if(!pwd){ toast("请输入访问密码","err"); return; }
      const h = await hashPwd(pwd);
      if(h === state.reservedPrice.passwordHash){
        state.reservedPrice.sessionUnlocked = true;
        toast("已解锁(本会话有效,刷新后重置)","ok");
        render();
      } else {
        toast("密码错误","err");
      }
    };
    rpUnlock.onclick = tryUnlock;
    const pwdInput = $("#qt_rp_pwd");
    if(pwdInput) pwdInput.addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); });
  }

  /* —— 租决:已解锁 → 跳转数据库管理界面 —— */
  const rpManage = $("#qt_rp_manage");
  if(rpManage) rpManage.onclick = ()=>{
    state.dbTab = 'reservedPrice';
    navigate('database');
  };

  /* —— 租决:立即加锁 —— */
  const rpLock = $("#qt_rp_lock");
  if(rpLock) rpLock.onclick = ()=>{
    if(!confirm("将立即重新加锁租决底价模块,需要重新输入密码才能查看,继续?")) return;
    state.reservedPrice.sessionUnlocked = false;
    Store.save();
    render();
    toast("已重新加锁","ok");
  };

  /* —— 示例项目:重新载入(已有自有数据时)—— */
  const demoLoad = $("#qt_demo_load");
  if(demoLoad) demoLoad.onclick = ()=>{
    if(!confirm("载入完整示例 demo 将:\n• 设置项目名称为「深圳福田某购物中心 (示例)」\n• 设置城市/商圈/商场定位\n• 添加 30 条历史成交\n• 添加 8 个待招商铺位\n\n您当前已有数据,继续将合并/覆盖。是否继续?")) return;
    loadFullDemo();
    render();
  };
}

function bindProjectConfigEvents(){
  const apply = ()=>{
    const old = JSON.stringify({c:state.project.city, cn:state.project.cityName, ci:state.project.circle, m:state.project.mall, sz:state.project.projectSize});
    state.project.name = $("#pc_name").value.trim() || "未命名商场项目";
    state.project.city = $("#pc_city").value;
    /* v11.2:cityName 是 input,可输入任意值 */
    const rawCityName = ($("#pc_cityName") ? $("#pc_cityName").value : "").trim();
    state.project.cityName = rawCityName || "其他";
    state.project.circle = $("#pc_circle").value;
    state.project.mall = $("#pc_mall").value;
    /* 体量下拉返回的值带"㎡"后缀,要剥掉 */
    state.project.projectSize = $("#pc_size").value.replace(/㎡$/, "");
    /* v11.2:owner字段已删除,保留旧值不动 */
    const next = JSON.stringify({c:state.project.city, cn:state.project.cityName, ci:state.project.circle, m:state.project.mall, sz:state.project.projectSize});
    Store.save();
    if(old !== next){
      const cityLabel = state.project.cityName && state.project.cityName !== '其他' ? `${state.project.city}·${state.project.cityName}` : state.project.city;
      const tunedHint = (state.project.cityName && CITY_TUNING_V11[state.project.cityName]) ? ' (已应用城市微调)' : '';
      toast(`项目系数已更新 — ${cityLabel}·${state.project.circle}·${state.project.mall}·${state.project.projectSize}㎡${tunedHint}`, "ok");
      render();  /* 维度变了,工作台所有铺位定价区间都要重算 */
    } else {
      render();
    }
  };
  /* 城市级别变化时,联动刷新具体城市 datalist 选项 */
  const cityLevelEl = $("#pc_city");
  if(cityLevelEl){
    cityLevelEl.onchange = ()=>{
      const newLevel = cityLevelEl.value;
      const opts = (CITY_TUNING_BY_LEVEL[newLevel] || ['其他']).filter(c=>c!=='其他');
      const dl = $("#cityNameList");
      const cityNameEl = $("#pc_cityName");
      if(dl){
        dl.innerHTML = opts.map(k=>`<option value="${k}">`).join('');
      }
      /* 切换级别时清空具体城市,让用户重新选/输入 */
      if(cityNameEl) cityNameEl.value = '';
      state.project.cityName = '其他';
      apply();
    };
  }
  const nameEl = $("#pc_name");
  if(nameEl) nameEl.onchange = apply;
  ["pc_cityName","pc_circle","pc_mall","pc_size"].forEach(id=>{
    const el = $("#"+id);
    if(el){
      /* input 元素用 input + change 事件,select 用 change */
      if(el.tagName === 'INPUT') el.onchange = apply;
      else el.onchange = apply;
    }
  });
  const more = $("#pc_more");
  if(more) more.onclick = ()=>{ state.dbTab = "project"; navigate("database"); };
}

          <button class="btn sm">选择</button>

          const sh = state.shops.find(x=>x.id===el.dataset.pick);

/* v7:运行铺位测算 + 单向同步到 商户测算/工具箱 + 渲染综合结果区
 * 输出包括:① 报价建议 ② 🔒 租决对照 ③ 同类参考(坪效/营业额/投资) ④ 商户损益预测 ⑤ 决策结论 */
function runPricing(){
  const fw = +$("#p_fw").value;
  const fh = +$("#p_height").value || 5.1;
  const ad = +$("#p_anchor").value;
  const brandTier = $("#p_brandTier").value || null;
  const input = {
    shopId: $("#p_id").value.trim(),
    area: +$("#p_area").value, frontWidth: fw, floorHeight: fh, floor: $("#p_floor").value,
    biz: $("#p_biz").value, subBiz: $("#p_sub").value,
 anchorDist: ad, brandTier,
    city: state.project.city, cityName: state.project.cityName, circle: state.project.circle, mall: state.project.mall, projectSize: state.project.projectSize,
    widthClass: fw>6 ? "宽(>6m)" : fw<3 ? "窄(<3m)" : "中(3-6m)",
    anchor: ad<10 ? "近(<10m)" : ad<=20 ? "中(10-20m)" : "远(>20m)"
  };
  if(!input.area || input.area<=0){ toast("请填写有效面积","err"); return; }

  const r = Calc.pricing(input);
  if(!r){ toast("找不到该业态基准","err"); return; }

  state.pricing.input = input;
  state.pricing.result = r;

  /* v7 同步:把测算结果作为后续视图的种子数据(单向,从招商人员的判断生效)
   * 算同类参考:月坪效 / 月营业额 / 投资明细 — 全部基于业态基准 + 多维项目系数 */
  const proj = r.projCoeffs;
  const b = r.bench;
  const tierSalesAdj = brandTier && TIER_SALES_ADJ[brandTier] ? TIER_SALES_ADJ[brandTier] : 1.0;
  /* v11.0:优先使用城市基准×结构系数链路;品牌系数仍叠加 */
  const v11Turnover = r.v11 ? r.v11.turnoverPerSqm : null;
  const projectedTurnover = (v11Turnover ?? ((b.turnoverPerSqm||500) * proj.turnover)) * tierSalesAdj;
  const projectedSales    = projectedTurnover * input.area;
  const projectedTicket   = r.v11 ? r.v11.ticket : (b.avgTicket||50) * proj.ticket;
  const projectedSalary   = Math.round((b.salary||4500) * proj.labor);
  /* 投资明细(万元) — v11.2 重写:固定成本 + 单位成本 × 面积模型,避免线性放大失真 */
  const invEst = Calc.estimateInvestmentV11({
    biz: input.biz, subBiz: input.subBiz,
    city: state.project.city, cityName: state.project.cityName,
    brandTier, area: input.area
  }) || {decoration:0, equipment:0, goods:0, other:0, total:0, fitFactor:1, invAdj:1, franchiseFee:0};
  const inv1 = invEst.decoration;
  const inv2 = invEst.equipment;
  const inv3 = invEst.goods;
  const inv4 = invEst.other;
  const totalInv = invEst.total;
  const fitFactor = invEst.fitFactor;
  const invAdj = invEst.invAdj;

  /* v10:动态物业费 — 按 城市级别 × 商场定位 × 项目体量 推导 */
  const dynMgmt = Calc.mgmtFee({
    city: state.project.city,
    mall: state.project.mall,
    projectSize: state.project.projectSize
  });

  /* 同步到 merchant input(商户测算页面打开后即可见,可微调)
   * v11.3 修复:不再完全覆盖商户测算的微调,而是合并 */
  state.merchant = state.merchant || {};
  const prevMerchant = state.merchant.input || {};
  /* 检查项目环境是否变化 → 变化则重置 merchant input,否则保留用户微调 */
  const newEnvSig = `${state.project.city}|${state.project.cityName}|${state.project.circle}|${state.project.mall}|${state.project.projectSize}`;
  const envChanged = prevMerchant._envSig && prevMerchant._envSig !== newEnvSig;
  /* 检查业态/品牌是否变化 → 变化则重置投资/营业额预估,否则保留 */
  const bizChanged = prevMerchant.biz !== input.biz || prevMerchant.sub !== input.subBiz;
  
  state.merchant.input = {
    /* 总是同步:核心铺位参数 */
    biz: input.biz, sub: input.subBiz,
    area: input.area, rent: r.recommended,
    /* 业态变化或环境变化时重新计算:投资/营业额/物业费/客单/人工 */
    mgmt: (bizChanged || envChanged) ? dynMgmt : (prevMerchant.mgmt ?? dynMgmt),
    inv1: (bizChanged || envChanged) ? inv1 : (prevMerchant.inv1 ?? inv1),
    inv2: (bizChanged || envChanged) ? inv2 : (prevMerchant.inv2 ?? inv2),
    inv3: (bizChanged || envChanged) ? inv3 : (prevMerchant.inv3 ?? inv3),
    inv4: (bizChanged || envChanged) ? inv4 : (prevMerchant.inv4 ?? inv4),
    sales: (bizChanged || envChanged) ? +(projectedSales/10000).toFixed(1) : (prevMerchant.sales ?? +(projectedSales/10000).toFixed(1)),
    margin: (bizChanged) ? Math.round((b.grossMargin||0.5)*100) : (prevMerchant.margin ?? Math.round((b.grossMargin||0.5)*100)),
    staff: (bizChanged) ? (b.staff||4) : (prevMerchant.staff ?? (b.staff||4)),
    salary: (bizChanged || envChanged) ? projectedSalary : (prevMerchant.salary ?? projectedSalary),
    util: (bizChanged) ? Math.round(input.area*30) : (prevMerchant.util ?? Math.round(input.area*30)),
    ticket: (bizChanged || envChanged) ? Math.round(projectedTicket) : (prevMerchant.ticket ?? Math.round(projectedTicket)),
    /* 用户合同条款:总是保留 */
    free: prevMerchant.free ?? 3,
    years: prevMerchant.years ?? 5,
    incr: prevMerchant.incr ?? 5,
    passby: prevMerchant.passby ?? 0,
    /* 环境签名 */
    _mgmtSig: `${state.project.city}|${state.project.mall}|${state.project.projectSize}`,
    _envSig: newEnvSig
  };
  state.merchant.fromPricing = { rent:r.recommended, area:input.area, biz:input.biz, sub:input.subBiz };

  /* 同步到工具箱 */
  state.equivPrefill = { rent:r.recommended, area:input.area, mgmt:dynMgmt };
  state.negotiation  = state.negotiation || {};
  state.negotiation.area = input.area;
  state.negotiation.floor = Math.round(r.recommended * 0.92);
  state.negotiation.counter = Math.round(r.recommended * 0.78);
  state.negotiation.brand = brandTier || "全国连锁";

  Store.save();

  /* 计算商户损益预测(简化版,显示在结果区) */
  const merchantR = Calc.merchant({
    rent:r.recommended, mgmt:dynMgmt, area:input.area,
    monthlySales:projectedSales, grossMargin:b.grossMargin||0.5,
    staffCount:b.staff||4, staffSalary:projectedSalary, utility:Math.round(input.area*30),
    inv_fitOut:inv1, inv_equipment:inv2, inv_goods:inv3, inv_other:inv4,
    years:5, incrPct:5, passbyDaily:0, ticket:Math.round(projectedTicket),
    biz:input.biz, sub:input.subBiz
  });

  const sameLayerRefs = state.deals.filter(d=> d.floor===input.floor).slice().sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).slice(0,5);
  const ratioMin = b.rentRatioMin, ratioMax = b.rentRatioMax;
  const monthRent = r.recommended * input.area;

  /* 🔒 租决底价对照 (v7.1:支持在测算结果页直接录入/修改,不必跳转数据库) */
  const rp = state.reservedPrice || {};
  const hasShopId = !!input.shopId;
  const rpUnlockedHasData = rp.enabled && rp.sessionUnlocked && rp.shops && rp.shops[input.shopId];
  const rpUnlockedNoData  = rp.enabled && rp.sessionUnlocked && hasShopId && !(rp.shops && rp.shops[input.shopId]);
  let rpHtml = "";
  if(!rp.enabled){
    /* 模块未启用 — 低调提示行,不挤占主结果区 */
    rpHtml = `
      <div style="background:rgba(139,135,214,.04);border:1px dashed rgba(139,135,214,.4);border-radius:8px;padding:9px 14px;margin-top:14px;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:10px">

        <span>需要为本铺位设置内部租决底价?</span>
        <button class="btn sm ghost" style="margin-left:auto;color:var(--violet);border-color:rgba(139,135,214,.5)" onclick="openRpFromPricing('${escapeHtml(input.shopId||'')}')">启用租决底价模块</button>
      </div>`;
  } else if(rp.enabled && !rp.sessionUnlocked){
    /* 已启用但未解锁 */
    rpHtml = `
      <div style="background:rgba(139,135,214,.08);border:1px dashed var(--violet);border-radius:8px;padding:10px 14px;margin-top:14px;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:10px">
        <span style="font-size:16px">🔒</span>

      </div>`;
  } else if(rpUnlockedHasData){
    /* 已解锁且有底价数据,显示对照 + 修改按钮 */
    const dec = rp.shops[input.shopId];
    const floor = +dec.rentFloor || 0;
    const isAbove = r.recommended >= floor;
    const gap = r.recommended - floor;
    rpHtml = `
      <div style="background:${isAbove?'rgba(63,182,168,.08)':'rgba(227,91,106,.08)'};border:1px solid ${isAbove?'var(--teal)':'var(--rose)'};border-radius:8px;padding:12px 14px;margin-top:14px">

            <span style="margin-left:10px;color:var(--ink-2);font-size:13px">租决底价 ¥${fmtNum(floor)}/㎡/月 · 当前推荐 ¥${fmtNum(r.recommended)}/㎡/月 · ${isAbove?'+':''}${fmtNum(gap)}</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <button class="btn sm ghost" style="color:var(--violet);border-color:rgba(139,135,214,.4)" onclick="openRpFromPricing('${escapeHtml(input.shopId)}')">📝 修改本铺位底价</button>
            <span style="font-size:11px;color:var(--ink-4)">🔒 仅内部可见</span>
          </div>
        </div>
        ${dec.freeMonthsCap?`<div style="margin-top:6px;font-size:12px;color:var(--ink-3)">免租上限: ${dec.freeMonthsCap} 月 · 总让步上限: ${dec.totalConcessionCap||"—"} 万元${dec.note?` · 备注: ${escapeHtml(dec.note)}`:""}</div>`:""}
        ${dec.updatedAt?`<div style="margin-top:4px;font-size:11px;color:var(--ink-4)">最近更新: ${escapeHtml(dec.updatedAt)}${dec.updatedBy?` · ${escapeHtml(dec.updatedBy)}`:""}</div>`:""}
      </div>`;
  } else if(rpUnlockedNoData){
    /* 已解锁但本铺位尚未录入底价 */
    rpHtml = `
      <div style="background:rgba(230,168,58,.06);border:1px solid rgba(230,168,58,.4);border-radius:8px;padding:11px 14px;margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">

        <div style="flex:1;min-width:200px">
          <strong style="color:var(--ink-1);font-size:13px">本铺位尚未设置租决底价</strong>

        </div>
        <button class="btn primary sm" onclick="openRpFromPricing('${escapeHtml(input.shopId)}')">🔒 设置本铺位租决</button>
      </div>`;

    rpHtml = `
      <div style="background:rgba(230,168,58,.04);border:1px dashed rgba(230,168,58,.5);border-radius:8px;padding:9px 14px;margin-top:14px;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:10px">

    <div class="card">

            <div class="price price-xl"><span class="yen">¥</span>${fmtNum(r.low)}<span style="color:var(--ink-3);font-weight:400;margin:0 8px">—</span>${fmtNum(r.high)}<span class="unit">/㎡/月</span></div>
          </div>
          <div style="text-align:right">
            <div style="color:var(--amber);font-size:11px;letter-spacing:.06em;text-transform:uppercase">推荐报价</div>
            <div class="price price-lg" style="color:var(--amber)"><span class="yen">¥</span>${fmtNum(r.recommended)}<span class="unit">/㎡/月</span></div>
          </div>
        </div>

        <div class="grid g-3" style="margin-top:14px">
          <div><div style="color:var(--ink-3);font-size:11px">月租金</div><div class="price" style="font-size:18px">${fmtMoney(monthRent)}</div></div>
          <div><div style="color:var(--ink-3);font-size:11px">年租金 (首年)</div><div class="price" style="font-size:18px">${fmtMoney(monthRent*12)}</div></div>
          <div><div style="color:var(--ink-3);font-size:11px">租售比预估</div><div class="price" style="font-size:18px">${(monthRent/projectedSales*100).toFixed(1)}<span style="font-size:11px;color:var(--ink-3);font-weight:500">%</span></div></div>
        </div>

        ${rpHtml}

        <div style="margin-top:14px;padding:10px 14px;background:linear-gradient(135deg,rgba(93,196,180,.06),rgba(91,154,255,.04));border-left:3px solid var(--teal);border-radius:0 8px 8px 0;font-size:12px;color:var(--ink-2);line-height:1.6">

          <div class="kpi"><div class="ico">¥</div><div class="label">月净利润</div><div class="value" style="color:${merchantR.profit>0?"var(--teal)":"var(--rose)"}">${merchantR.profit>=0?"+":""}${fmtMoney(merchantR.profit)}</div><div class="delta">利润率 ${fmtPct(merchantR.profitMargin,1)}</div></div>

        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div>
            <div style="color:var(--ink-3);font-size:11px;margin-bottom:6px">月经营成本结构</div>

              ["租金+物业", merchantR.rentMonthly+merchantR.mgmtMonthly, "var(--amber)"],
              ["货品成本",  merchantR.cogs, "var(--rose)"],
              ["人工成本",  merchantR.labor, "var(--violet)"],
              ["水电杂费",  merchantR.utility, "var(--ink-3)"]

              <div class="bar-row" style="margin-bottom:4px">
                <div class="lbl" style="font-size:11.5px">${k}</div>
                <div class="bar"><span style="width:${Math.min(100,projectedSales>0?v/projectedSales*100:0)}%;background:${c}"></span></div>
                <div class="val" style="font-size:11.5px">${fmtMoney(v)}</div>
              </div>`).join("")}

            <div style="color:var(--ink-3);font-size:11px;margin-bottom:6px">保本与压力</div>

              <div class="item"><span class="lbl">保本月营业额</span><span class="val">${merchantR.breakevenMonthly===null?"—":fmtMoney(merchantR.breakevenMonthly)}</span></div>
              <div class="item"><span class="lbl">保本日营业额</span><span class="val">${merchantR.breakevenDaily===null?"—":fmtMoney(merchantR.breakevenDaily)}</span></div>

              ${merchantR.cashflow?`<div class="item"><span class="lbl">真实回本(含爬坡)</span><span class="val">${merchantR.cashflow.realPaybackMonths||"—"} 月</span></div>`:""}

        <div class="tip" style="margin-top:12px;font-size:12px;color:var(--ink-3)">💡 想细调营业额、毛利、人工等参数?点 <strong style="color:var(--amber)">→ 商户测算深度模拟</strong>,所有参数已自动同步。</div>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="card-head"><h3>④ 决策结论</h3></div>

          const health = Calc.rentRatioHealth(merchantR.rentRatio, input.biz, input.subBiz);

          if(health.kind==="ok" && paybackOk && merchantR.profit>0)
            return `<div class="tip ok"><strong>✓ 推荐签约</strong> · 商户能赚钱,双方共赢。租售比、回收期、净利润三项核心指标均健康。</div>`;
          if(merchantR.profit<=0)
            return `<div class="tip err"><strong>✗ 不建议按此价签约</strong> · 当前条件下商户月度亏损 ${fmtMoney(-merchantR.profit)}。建议:① 下调租金 ② 增加免租期 ③ 提供装修补贴 ④ 重新评估营业额预期</div>`;
          if(health.kind==="err")
            return `<div class="tip err"><strong>⚠ 风险偏高</strong> · 租售比 ${fmtPct(merchantR.rentRatio,1)} 超过该业态健康上限,商户长期经营压力大。即使短期能签,后期会出现"开不下去 → 转让 → 空铺"循环。</div>`;
          return `<div class="tip"><strong>○ 可签但需谨慎</strong> · 财务模型边际可行,安全边际 ${(merchantR.safetyMargin*100).toFixed(0)}%(健康 >50%)。建议:① 优先短期合同观察 1-2 年;② 合同加入"经营保障条款"。</div>`;

        <div class="grid g-4" style="margin-top:14px;gap:8px">
          <button class="btn" id="btnGoMerchant">→ 商户测算 (深度)</button>
          <button class="btn" id="btnGoEquiv">→ 等效租金计算</button>
          <button class="btn" id="btnGoNeg">→ 谈判沙盘</button>
          <button class="btn primary" id="btnGoLOI">→ 生成 LOI</button>
        </div>
      </div>
    </div>

    ${sameLayerRefs.length>0 ? `
    <div class="card" style="margin-top:14px">
      <div class="card-head"><h3>⑤ 同层成交参考 <span style="font-weight:400;color:var(--ink-3);font-size:11px">${escapeHtml(input.floor)} 层最近 ${sameLayerRefs.length} 笔</span></h3></div>
      <div class="card-body" style="padding:0">
        <div class="tbl-wrap" style="border:none;border-radius:0">
          <table class="tbl"><thead><tr><th>铺位</th><th class="num">面积</th><th>业态</th><th class="num">租金</th><th class="num">租售比</th><th>时间</th></tr></thead>
          <tbody>${sameLayerRefs.map(d=>`<tr>
            <td class="strong">${escapeHtml(d.shopId)}</td>
            <td class="num">${fmtNum(d.area)} ㎡</td>
            <td>${escapeHtml(d.subBiz||d.biz||"—")}</td>
            <td class="num">¥${fmtNum(d.rent)}</td>
            <td class="num">${d.rentToSales?fmtPct(+d.rentToSales,0):"—"}</td>
            <td>${escapeHtml(d.createdAt||"")}</td>
          </tr>`).join("")}
          <tr style="background:var(--bg-2)"><td class="strong" style="color:var(--amber)">本铺位建议</td><td class="num">${fmtNum(input.area)} ㎡</td><td>${escapeHtml(input.subBiz)}</td><td class="num" style="color:var(--amber)">¥${fmtNum(r.recommended)}</td><td class="num">${fmtPct(merchantR.rentRatio,0)}</td><td>本期</td></tr>
          </tbody></table>
        </div>
      </div>
    </div>` : ""}
  `;

  $("#btnGoMerchant").onclick = ()=>navigate("merchant");
  $("#btnGoEquiv").onclick = ()=>{ state.toolboxTab = "equiv"; navigate("toolbox"); };
  $("#btnGoNeg").onclick = ()=>{ state.toolboxTab = "negotiation"; navigate("toolbox"); };
  $("#btnGoLOI").onclick = ()=>{ state.toolboxTab = "loi"; navigate("toolbox"); };
}

Views.merchant = function(root){
  if(!state.merchant) state.merchant = {};

  const last = state.merchant.input || {};

  const biz = last.biz || fp.biz || "餐饮";

  const rent = last.rent || fp.rent || 280;

  const b = Calc.bench(biz, sub) || {};
  /* v5:商户测算输入默认值按当前项目场景缩放 */
  const proj = projectCoeffs(state.project);
  /* v11.0:从pricing同步brandTier(若有),用于装修城市分层和投资品牌倍率 */
  const brandTier = (state.pricing && state.pricing.input && state.pricing.input.brandTier) || last.brandTier || null;
