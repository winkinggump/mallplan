<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MallPlan 招商算账 v1.0</title>
<style>
/* ========== 设计令牌 v10 — 商业地产 × 时尚质感 ========== */
:root{
  /* 主色:墨蓝深海 + 香槟金强调,精品 mall 质感 */
  --bg-0:#0a0d14;
  --bg-1:#0f1320;
  --bg-2:#161b2b;
  --bg-3:#1f2538;
  --bg-4:#2a3148;
  --line:#262c42;
  --line-strong:#3a425e;

  --ink-1:#eef1f8;
  --ink-2:#b3bdd2;
  --ink-3:#7681a0;
  --ink-4:#525c79;

  /* 主行动色 — 香槟金 (LV/Hermès orange-gold 系) */
  --amber:#d4a64b;
  --amber-bright:#f5c668;
  --amber-soft:rgba(212,166,75,.14);
  --amber-glow:rgba(245,198,104,.22);

  /* 健康指标 — 翡翠绿 (Tiffany 系) */
  --teal:#5dc4b4;
  --teal-soft:rgba(93,196,180,.14);

  /* 警示 — 玫瑰红 (Hermès rouge 系) */
  --rose:#e8576b;
  --rose-soft:rgba(232,87,107,.14);

  /* 高端紫 (Dior aubergine 系) */
  --violet:#9c8bd9;
  --violet-soft:rgba(156,139,217,.14);

  /* 蓝调 (Bvlgari blue 系) */
  --azure:#5b9aff;
  --azure-soft:rgba(91,154,255,.14);

  --shadow-1:0 1px 0 rgba(255,255,255,.04), 0 8px 24px rgba(0,0,0,.4);
  --shadow-2:0 2px 0 rgba(255,255,255,.04), 0 14px 38px rgba(0,0,0,.5);
  --shadow-pop:0 24px 60px rgba(0,0,0,.6);
  --shadow-amber:0 8px 28px rgba(212,166,75,.22);

  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;

  --gradient-amber:linear-gradient(135deg,#f5c668 0%,#d4a64b 50%,#b58632 100%);
  --gradient-luxury:linear-gradient(135deg,rgba(245,198,104,.16),rgba(156,139,217,.10));
  --gradient-bg:radial-gradient(1200px 700px at 88% -8%, rgba(212,166,75,.07), transparent 60%),
                radial-gradient(900px 500px at -5% 105%, rgba(93,196,180,.05), transparent 60%),
                radial-gradient(700px 400px at 50% 50%, rgba(91,154,255,.025), transparent 60%);

  --font-sans:"Inter","PingFang SC","HarmonyOS Sans","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;
  --font-serif:"Source Serif Pro","Songti SC","SimSun",ui-serif,Georgia,serif;
  --font-mono:"JetBrains Mono","SF Mono","Menlo",ui-monospace,Consolas,monospace;
  --font-display:"Inter","PingFang SC",ui-sans-serif,sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 88% -8%, rgba(212,166,75,.07), transparent 60%),
    radial-gradient(900px 500px at -5% 105%, rgba(93,196,180,.05), transparent 60%),
    radial-gradient(700px 400px at 50% 50%, rgba(91,154,255,.025), transparent 60%),
    var(--bg-0);
  color:var(--ink-1);
  font-family:var(--font-sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:.005em;
  font-feature-settings:"cv11","ss01","ss03";
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:var(--amber-glow);color:var(--ink-1)}
input,select,textarea{font-family:inherit;font-size:13px}

/* 滚动条 — 精致细巧 */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;border:2px solid var(--bg-0);transition:background .2s}
*::-webkit-scrollbar-thumb:hover{background:var(--amber)}

/* ========== 顶部栏 — 时尚精致 v10.1 防换行 ========== */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:14px;flex-wrap:nowrap;
  padding:11px 22px;
  background:linear-gradient(180deg,rgba(15,19,32,.92),rgba(10,13,20,.85));
  backdrop-filter:saturate(160%) blur(18px);
  -webkit-backdrop-filter:saturate(160%) blur(18px);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.02), 0 8px 24px rgba(0,0,0,.18);
  white-space:nowrap;overflow-x:auto;
}
.topbar::-webkit-scrollbar{height:0}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.02em;flex-shrink:0}
.brand-mark{
  width:32px;height:32px;border-radius:9px;
  background:var(--gradient-amber);
  display:grid;place-items:center;
  color:#0b0e14;font-weight:900;font-size:15px;
  font-family:var(--font-display);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.18), 0 6px 14px rgba(212,166,75,.32);
  position:relative;flex-shrink:0;
}
.brand-mark::after{
  content:"";position:absolute;inset:1px;border-radius:8px;
  background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%);
  pointer-events:none;
}
.brand-name{font-size:15px;background:linear-gradient(180deg,#fff 0%,#c4cee3 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
.brand-sub{color:var(--ink-3);font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;margin-left:4px;white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:14px;background:var(--bg-2);padding:3px;border-radius:10px;border:1px solid var(--line);flex-shrink:0}
.nav button{
  appearance:none;border:0;background:transparent;color:var(--ink-2);
  padding:7px 13px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:7px;transition:all .2s ease;
  letter-spacing:.02em;white-space:nowrap;
}
.nav button:hover{color:var(--ink-1);background:var(--bg-3)}
.nav button.active{
  color:#0b0e14;font-weight:600;
  background:var(--gradient-amber);
  box-shadow:0 2px 6px rgba(212,166,75,.32), inset 0 1px 0 rgba(255,255,255,.25);
}
.nav button .ico{font-size:14px;opacity:.85}

.topbar-spacer{flex:1;min-width:8px}
.topbar-right{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;flex-shrink:0;flex-wrap:nowrap}
.tag-pill{
  padding:4px 11px;border-radius:999px;
  background:linear-gradient(180deg,var(--bg-2),var(--bg-3));
  border:1px solid var(--line);
  font-size:11px;color:var(--ink-2);letter-spacing:.04em;font-weight:500;
  white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis;
}
.btn-icon{
  appearance:none;border:1px solid var(--line);background:var(--bg-1);color:var(--ink-2);
  width:32px;height:32px;border-radius:9px;cursor:pointer;display:grid;place-items:center;
  transition:all .2s ease;flex-shrink:0;
}
.btn-icon:hover{border-color:var(--amber);color:var(--amber);background:var(--bg-2);box-shadow:0 0 0 3px var(--amber-soft)}
.btn-icon.btn-text{
  width:auto;padding:0 12px;font-size:12px;font-weight:500;letter-spacing:.02em;
  height:32px;white-space:nowrap;
}

/* 许可证按钮专属样式 — 紧凑版,防止激活后撑爆顶栏 */
.btn-license{
  appearance:none;height:32px;padding:0 11px;border-radius:8px;cursor:pointer;
  font-size:11.5px;font-weight:600;letter-spacing:.02em;
  transition:all .2s ease;display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--line);background:var(--bg-2);color:var(--ink-3);
  white-space:nowrap;flex-shrink:0;max-width:200px;overflow:hidden;text-overflow:ellipsis;
}
.btn-license:hover{border-color:var(--amber);color:var(--amber)}
.btn-license.pro-personal{background:rgba(93,196,180,.12);color:var(--teal);border-color:var(--teal)}
.btn-license.pro-enterprise{background:rgba(212,166,75,.14);color:var(--amber);border-color:var(--amber);box-shadow:0 0 12px rgba(212,166,75,.18)}
.btn-license.pro-trial{background:rgba(156,139,217,.14);color:var(--violet);border-color:var(--violet)}

/* 中宽屏:精简次要元素,保证导航不换行 */
@media (max-width:1280px){
  .brand-sub{display:none}
  .tag-pill{max-width:200px}
  .btn-icon.btn-text{padding:0 10px;font-size:11.5px}
}
@media (max-width:1080px){
  .tag-pill{display:none}
}

/* ========== 页面容器 ========== */
.page{padding:24px 28px 80px;max-width:1480px;margin:0 auto}
.view{display:none}
.view.active{display:block;animation:fadeIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ========== 通用 ========== */
.section-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  margin:0 0 20px;padding-bottom:14px;
  border-bottom:1px solid var(--line);
  position:relative;
}
.section-head::after{
  content:"";position:absolute;bottom:-1px;left:0;width:48px;height:2px;
  background:var(--gradient-amber);border-radius:2px;
}
.section-head h2{
  margin:0;font-family:var(--font-serif);font-weight:600;font-size:26px;letter-spacing:-.015em;
  color:var(--ink-1);
}
.section-head .desc{color:var(--ink-3);font-size:12.5px;letter-spacing:.02em;margin-top:4px}
.section-head .right{display:flex;gap:8px;align-items:center}

.card{
  background:linear-gradient(180deg,var(--bg-1),var(--bg-1));
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-1);
  transition:border-color .2s ease, box-shadow .2s ease;
}
.card:hover{border-color:var(--line-strong)}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.012),transparent);
}
.card-head h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.card-head .h-acc{font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.card-body{padding:18px}

/* 网格 */
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3{grid-template-columns:1fr}
}
@media (max-width:700px){
  .g-2{grid-template-columns:1fr}
  .g-4,.g-5{grid-template-columns:1fr}
}

/* KPI 卡 — 时尚精致 */
.kpi{
  position:relative;
  background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
  border:1px solid var(--line);
  border-radius:var(--r-lg);padding:18px 20px;overflow:hidden;
  transition:all .25s ease;
}
.kpi::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--amber-soft),transparent);
  opacity:0;transition:opacity .25s ease;
}
.kpi:hover{border-color:var(--amber);transform:translateY(-1px);box-shadow:0 12px 28px rgba(0,0,0,.32)}
.kpi:hover::before{opacity:1}
.kpi .label{font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.kpi .value{margin-top:6px;font-family:var(--font-serif);font-size:30px;font-weight:600;letter-spacing:-.025em;color:var(--ink-1)}
.kpi .value .unit{font-family:var(--font-sans);font-size:13px;color:var(--ink-3);font-weight:500;margin-left:4px;letter-spacing:0}
.kpi .delta{margin-top:4px;font-size:11px;color:var(--ink-3)}
.kpi .delta.up{color:var(--teal)}
.kpi .delta.down{color:var(--rose)}
.kpi .ico{position:absolute;right:16px;top:16px;width:28px;height:28px;display:grid;place-items:center;color:var(--ink-4);font-size:16px;opacity:.6}

/* 标签徽章 */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:500;letter-spacing:.02em}
.badge.ok{background:var(--teal-soft);color:var(--teal)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.badge.err{background:var(--rose-soft);color:var(--rose)}
.badge.info{background:var(--violet-soft);color:var(--violet)}
.badge.azure{background:var(--azure-soft);color:var(--azure)}
.badge.mute{background:var(--bg-2);color:var(--ink-3);border:1px solid var(--line)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* 按钮 — 精致质感 */
.btn{
  appearance:none;border:1px solid var(--line);background:linear-gradient(180deg,var(--bg-2),var(--bg-3));color:var(--ink-1);
  padding:8px 16px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:all .2s ease;
  letter-spacing:.01em;position:relative;
}
.btn:hover{border-color:var(--line-strong);background:linear-gradient(180deg,var(--bg-3),var(--bg-4));transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.btn:active{transform:translateY(0)}
.btn.primary{
  background:var(--gradient-amber);
  color:#0b0e14;border-color:transparent;font-weight:600;
  box-shadow:0 1px 0 rgba(255,255,255,.32) inset, 0 -1px 0 rgba(0,0,0,.12) inset, 0 8px 18px rgba(212,166,75,.28);
}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 1px 0 rgba(255,255,255,.32) inset, 0 -1px 0 rgba(0,0,0,.12) inset, 0 12px 24px rgba(212,166,75,.4)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--bg-2)}
.btn.danger{color:var(--rose);border-color:rgba(232,87,107,.32);background:transparent}
.btn.danger:hover{background:var(--rose-soft);border-color:var(--rose)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* 表单 — 精致 */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;color:var(--ink-3);letter-spacing:.07em;text-transform:uppercase;font-weight:500}
.field .hint{font-size:11px;color:var(--ink-4);margin-top:2px}
.input,.select{
  width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--ink-1);
  padding:9px 11px;border-radius:8px;outline:none;
  transition:all .2s ease;
}
.input:hover,.select:hover{border-color:var(--line-strong)}
.input:focus,.select:focus{border-color:var(--amber);background:var(--bg-3);box-shadow:0 0 0 3px var(--amber-soft)}
.select{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 50%, calc(100% - 9px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  padding-right:28px;
}
.input.with-suffix{padding-right:44px}
.input-wrap{position:relative}
.input-wrap .suffix{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:12px;pointer-events:none}

.checkbox{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px;color:var(--ink-2)}
.checkbox input{appearance:none;width:16px;height:16px;border:1.5px solid var(--line-strong);border-radius:4px;background:var(--bg-2);cursor:pointer;display:grid;place-items:center;transition:all .15s ease}
.checkbox input:checked{background:var(--amber);border-color:var(--amber)}
.checkbox input:checked::after{content:"";width:9px;height:9px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path fill='none' stroke='%230b0e14' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' d='M2.5 6.4 5 9l4.5-5.5'/></svg>") center/contain no-repeat}

/* 表格 */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl thead th{
  text-align:left;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  padding:10px 12px;background:var(--bg-2);border-bottom:1px solid var(--line);position:sticky;top:0;
}
.tbl tbody td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle}
.tbl tbody tr:hover td{background:rgba(255,255,255,.018)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl .num{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-1)}
.tbl .strong{color:var(--ink-1);font-weight:500}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg-1)}

/* 分隔副标题 */
.subhead{
  display:flex;align-items:center;gap:10px;margin:10px 0 12px;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--ink-3);
}
.subhead::before{content:"";width:14px;height:1px;background:var(--ink-4)}
.subhead::after{content:"";flex:1;height:1px;background:var(--line)}

/* Tab 切换 — 精致 */
.tabs{display:flex;gap:2px;background:linear-gradient(180deg,var(--bg-2),var(--bg-3));padding:4px;border-radius:11px;border:1px solid var(--line);width:fit-content;box-shadow:inset 0 1px 0 rgba(0,0,0,.2)}
.tabs button{
  appearance:none;border:0;background:transparent;color:var(--ink-2);padding:7px 16px;border-radius:8px;
  cursor:pointer;font-size:12px;font-weight:500;transition:all .2s ease;letter-spacing:.02em;
}
.tabs button.active{background:var(--gradient-amber);color:#0b0e14;font-weight:600;box-shadow:0 2px 6px rgba(212,166,75,.32), inset 0 1px 0 rgba(255,255,255,.25)}
.tabs button:hover:not(.active){color:var(--ink-1);background:var(--bg-3)}

/* 价格大字 — 时尚 */
.price{font-family:var(--font-serif);font-weight:600;letter-spacing:-.025em;color:var(--ink-1)}
.price-xl{font-size:46px;line-height:1.1}
.price-lg{font-size:32px;line-height:1.15}
.price .yen{font-family:var(--font-sans);font-weight:500;color:var(--ink-3);font-size:.5em;margin-right:3px;vertical-align:8%}
.price .unit{font-family:var(--font-sans);font-weight:500;color:var(--ink-3);font-size:.4em;margin-left:6px;letter-spacing:0}

/* 进度条/区间条 */
.range-bar{position:relative;height:8px;border-radius:999px;background:var(--bg-3);overflow:visible;box-shadow:inset 0 1px 0 rgba(0,0,0,.2)}
.range-bar .fill{position:absolute;top:0;bottom:0;background:var(--gradient-amber);border-radius:999px;box-shadow:0 0 12px rgba(212,166,75,.32)}
.range-bar .marker{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--ink-1);border:3px solid var(--amber);transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--amber-glow), 0 4px 8px rgba(0,0,0,.4)}

/* 损益条 */
.bar-row{display:flex;align-items:center;gap:10px;font-size:12px;padding:6px 0}
.bar-row .lbl{flex:0 0 110px;color:var(--ink-2)}
.bar-row .bar{flex:1;height:6px;background:var(--bg-3);border-radius:999px;overflow:hidden;position:relative}
.bar-row .bar > span{display:block;height:100%;border-radius:999px}
.bar-row .val{flex:0 0 110px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-1)}

/* 列表项 */
.row-list{display:flex;flex-direction:column}
.row-list .item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;
}
.row-list .item:last-child{border-bottom:none}
.row-list .item .lbl{color:var(--ink-3);font-size:12px}
.row-list .item .val{font-variant-numeric:tabular-nums;color:var(--ink-1);font-weight:500}

/* 提示框 */
.tip{
  border-left:3px solid var(--amber);background:var(--amber-soft);
  padding:10px 14px;border-radius:0 8px 8px 0;font-size:12px;color:var(--ink-2);line-height:1.6;
}
.tip.ok{border-left-color:var(--teal);background:var(--teal-soft)}
.tip.err{border-left-color:var(--rose);background:var(--rose-soft)}
.tip.info{border-left-color:var(--violet);background:var(--violet-soft)}

/* 空状态 */
.empty{padding:48px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.empty .ico{font-size:32px;margin-bottom:10px;opacity:.4}

 *   2. 抽象 driver (local/remote),后端就绪后可一行切换
 *   3. 每次写入自动附 _meta (updatedAt/updatedBy/version),为审计预留
 *   4. 关键操作日志暂存本地,后端就绪后批量上送
 *
 * 使用:
 *   await MallPlanStore.set('project_xxx', projectData);
 *   const project = await MallPlanStore.get('project_xxx');
 *   await MallPlanStore.log({action:'modify_reserved_price', shopId:'L2-15'});
 *
 * 切换为后端:
 *   MallPlanStore.config.driver = 'remote';
 *   MallPlanStore.config.apiBase = 'https://api.mallplan.com/v1';
 *   MallPlanStore.config.token = '...';
 * ============================================================ */
const MallPlanStore = {
  config: {
    driver:   'local',                /* local | remote */
    apiBase:  '',                     /* 后端 API 根地址,如 https://api.mallplan.com/v1 */
    token:    '',                     /* 后端 Bearer Token */
    keyPrefix:'mallplan_',            /* localStorage key 前缀,避免与其他应用冲突 */
    schemaVersion: '1.0',             /* 当前数据结构版本 */
    currentUser: '',                  /* 当前用户标识 (本地版可为空字符串,后端版必填) */
    logBufferKey:'mallplan_audit_log',/* 审计日志缓冲区 key */
    enableLog:true,                   /* 是否开启审计日志 */
  },

  /* —— 读 —— */
  async get(key){
    if(this.config.driver === 'remote'){
      try{
        const r = await fetch(`${this.config.apiBase}/kv/${encodeURIComponent(key)}`,{
          headers:{ 'Authorization':`Bearer ${this.config.token}` }
        });
        if(!r.ok) return null;
        const j = await r.json();
        return j.value || null;
      }catch(e){ console.warn('[MallPlanStore.get]',e); return null; }
    }
    /* local driver */
    try{
      const raw = localStorage.getItem(this.config.keyPrefix + key);
      if(!raw) return null;
      const wrapped = JSON.parse(raw);
      /* 兼容:旧版没有 _meta 包裹的直接返回 */
      return wrapped && wrapped._meta ? wrapped.data : wrapped;
    }catch(e){ console.warn('[MallPlanStore.get]',e); return null; }
  },

  /* —— 写 —— */
  async set(key, data){
    const wrapped = {
      _meta:{
        updatedAt:    new Date().toISOString(),
        updatedBy:    this.config.currentUser || '本地用户',
        schemaVersion:this.config.schemaVersion,
        driver:       this.config.driver,
      },
      data: data
    };
    if(this.config.driver === 'remote'){
      try{
        const r = await fetch(`${this.config.apiBase}/kv/${encodeURIComponent(key)}`,{
          method:'PUT',
          headers:{
            'Content-Type':'application/json',
            'Authorization':`Bearer ${this.config.token}`
          },
          body: JSON.stringify(wrapped)
        });
        return r.ok;
      }catch(e){ console.warn('[MallPlanStore.set]',e); return false; }
    }
    /* local driver */
    try{
      localStorage.setItem(this.config.keyPrefix + key, JSON.stringify(wrapped));
      return true;
    }catch(e){ console.warn('[MallPlanStore.set]',e); return false; }
  },

  /* —— 删 —— */
  async remove(key){
    if(this.config.driver === 'remote'){
      try{
        const r = await fetch(`${this.config.apiBase}/kv/${encodeURIComponent(key)}`,{
          method:'DELETE',
          headers:{ 'Authorization':`Bearer ${this.config.token}` }
        });
        return r.ok;
      }catch(e){ console.warn('[MallPlanStore.remove]',e); return false; }
    }
    try{ localStorage.removeItem(this.config.keyPrefix + key); return true; }
    catch(e){ return false; }
  },

  /* —— 列出键 (前缀过滤) —— */
  async list(prefix){
    if(this.config.driver === 'remote'){
      try{
        const r = await fetch(`${this.config.apiBase}/kv?prefix=${encodeURIComponent(prefix||'')}`,{
          headers:{ 'Authorization':`Bearer ${this.config.token}` }
        });
        if(!r.ok) return [];
        const j = await r.json();
        return j.keys || [];
      }catch(e){ console.warn('[MallPlanStore.list]',e); return []; }
    }
    const full = this.config.keyPrefix + (prefix||'');
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(full)) keys.push(k.substring(this.config.keyPrefix.length));
    }
    return keys;
  },

  /* —— 审计日志 (关键操作留痕) ——
   * 用法: MallPlanStore.log({ action:'modify_rent', shopId:'L2-15', oldValue:20, newValue:22 })
   * 本地版:写入 localStorage 缓冲区,可由用户/管理员手动导出查看
   * 后端版:批量同步到服务器,不可删除 */
  async log(entry){
    if(!this.config.enableLog) return;
    const fullEntry = {
      ts:          new Date().toISOString(),
      user:        this.config.currentUser || '本地用户',
      module:      window.MALLPLAN_MODULE || 'unknown',  /* 各模块在初始化时设置 */
      ...entry
    };
    if(this.config.driver === 'remote'){
      /* 后端版:批量缓冲,每10条或30秒批量上送 */
      try{
        const buf = JSON.parse(localStorage.getItem(this.config.logBufferKey) || '[]');
        buf.push(fullEntry);
        localStorage.setItem(this.config.logBufferKey, JSON.stringify(buf));
        if(buf.length >= 10) this._flushLogs();
      }catch(e){ console.warn('[MallPlanStore.log]',e); }
      return;
    }
    /* 本地版:直接累积存储 */
    try{
      const buf = JSON.parse(localStorage.getItem(this.config.logBufferKey) || '[]');
      buf.push(fullEntry);
      /* 本地版保留最近 1000 条,避免无限增长 */
      if(buf.length > 1000) buf.splice(0, buf.length-1000);
      localStorage.setItem(this.config.logBufferKey, JSON.stringify(buf));
    }catch(e){ console.warn('[MallPlanStore.log]',e); }
  },
  async _flushLogs(){
    if(this.config.driver !== 'remote') return;
    try{
      const buf = JSON.parse(localStorage.getItem(this.config.logBufferKey) || '[]');
      if(buf.length === 0) return;
      const r = await fetch(`${this.config.apiBase}/audit-logs`,{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':`Bearer ${this.config.token}`
        },
        body: JSON.stringify({ logs: buf })
      });
      if(r.ok) localStorage.setItem(this.config.logBufferKey, '[]');
    }catch(e){ console.warn('[MallPlanStore._flushLogs]',e); }
  },
  /* 导出本地审计日志 (本地版导出 JSON,便于人工审阅) */
  exportLogs(){
    try{
      return JSON.parse(localStorage.getItem(this.config.logBufferKey) || '[]');
    }catch(e){ return []; }
  },
  clearLogs(){
    if(!confirm('确认清空本地审计日志?清空后不可恢复。')) return;
    localStorage.setItem(this.config.logBufferKey, '[]');
  },
};

/* —— 兼容旧版 localStorage key 的迁移辅助 ——
 * 各模块在 init 时调用 MallPlanStore.migrateLegacy(oldKey, newKey)
 * 把旧 key 数据迁移到新 key 下,并保留 backup */
MallPlanStore.migrateLegacy = function(oldKey, newKey){
  try{
    const oldData = localStorage.getItem(oldKey);
    const newKeyFull = this.config.keyPrefix + newKey;
    if(oldData && !localStorage.getItem(newKeyFull)){
      /* 备份旧数据 */
      localStorage.setItem(oldKey + '_backup_' + Date.now(), oldData);
      /* 包装写入新 key */
      const wrapped = {
        _meta:{
          updatedAt:     new Date().toISOString(),
          updatedBy:     '迁移工具',
          schemaVersion: this.config.schemaVersion,
          migratedFrom:  oldKey,
        },
        data: JSON.parse(oldData)
      };
      localStorage.setItem(newKeyFull, JSON.stringify(wrapped));
      console.info(`[MallPlanStore] 已迁移 ${oldKey} → ${newKeyFull}`);
      return true;
    }
  }catch(e){ console.warn('[MallPlanStore.migrateLegacy]',e); }
  return false;
};

/* —— 同步读写包装 (兼容旧代码,避免大改 await 链) ——
 * 这一层用于现有同步代码逐步替换:
 *   旧: localStorage.setItem('k', JSON.stringify(o))
 *   新: MallPlanStore.setSync('k', o)
 * 后端切换后,setSync 会自动改为 fire-and-forget 异步调用 + 内存缓存 */
MallPlanStore.setSync = function(key, data){
  if(this.config.driver === 'local'){
    const wrapped = {
      _meta:{
        updatedAt:     new Date().toISOString(),
        updatedBy:     this.config.currentUser || '本地用户',
        schemaVersion: this.config.schemaVersion,
        driver:        this.config.driver,
      },
      data: data
    };
    try{ localStorage.setItem(this.config.keyPrefix + key, JSON.stringify(wrapped)); return true; }
    catch(e){ return false; }
  }
  /* remote: 异步触发,内存缓存,确保 UI 不卡 */
  this._memCache = this._memCache || {};
  this._memCache[key] = data;
  this.set(key, data);  /* 触发但不等 */
  return true;
};
MallPlanStore.getSync = function(key){
  if(this.config.driver === 'local'){
    try{
      const raw = localStorage.getItem(this.config.keyPrefix + key);
      if(!raw) return null;
      const wrapped = JSON.parse(raw);
      return wrapped && wrapped._meta ? wrapped.data : wrapped;
    }catch(e){ return null; }
  }
  /* remote: 同步只能用内存缓存,需用户先调过 await get() */
  this._memCache = this._memCache || {};
  return this._memCache[key] || null;
};

/* ============================================================
 * MallPlan Bridge · 跨模块数据互通桥 v1.0 · M6
 * ============================================================
 * 设计目的:
 *   1. 三个模块 (投拓测算/定位落位/招商算账) 通过 Bridge 共享:
 *      项目档案 (ProjectArchive) / 成交库 (DealLib) / 品牌库 (BrandLib)
 *   2. 提供历史成交回归算法 (加权 P25/中位数/P75) — M6 杀手锏
 *   3. 提供"本企业基准"快速查询 — 让投拓测算引用招商沉淀的真实数据
 *
 * 依赖: MallPlanStore (M1 已部署)
 *
 * 调用示例:
 *   // 写入一笔成交 (招商算账触发)
 *   MallPlanBridge.pushDeal({ projectId:'PRJ_...', brandName:'某品牌', ... });
 *
 *   // 查询同类历史成交分布 (投拓测算调用)
 *   const stats = await MallPlanBridge.getDealStats({ cityTier:'一线', bizCategoryL1:'餐饮' });
 *   // => { count:59, p25:4.58, p50:7.40, p75:9.80, byBiz:{...} }
 *
 *   // 查询本企业基准 (按业态分组的中位数租金)
 *   const baseline = await MallPlanBridge.getEnterpriseBaseline({ cityTier:'一线' });
 * ============================================================ */
const MallPlanBridge = {
  /* —— 置信度权重 (SCHEMA.md 5.3) —— */
  CONFIDENCE_WEIGHT: { high: 1.0, mid: 0.7, low: 0.3 },

  /* —— 阈值常量 —— */
  MIN_SAMPLES_STATS:    5,    /* ≥5 笔才出统计 */
  MIN_SAMPLES_RELIABLE: 50,   /* ≥50 笔标记"可靠阈值" */

  /* ===================== 项目档案 ===================== */

  /** 列出所有项目档案 */
  async listProjects(){
    try{
      const ids = (await MallPlanStore.get('project_list')) || [];
      const projects = [];
      for(const id of ids){
        const p = await MallPlanStore.get('project_' + id);
        if(p) projects.push(p);
      }
      return projects;
    }catch(e){ console.warn('[Bridge.listProjects]',e); return []; }
  },

  /** 读单个项目档案 */
  async getProject(projectId){
    if(!projectId) return null;
    return await MallPlanStore.get('project_' + projectId);
  },

  /** 写项目档案 (返回完整数据,补全 projectId/createdAt) */
  async putProject(project){
    if(!project) return null;
    if(!project.projectId){ project.projectId = this.generateProjectId(); }
    const now = new Date().toISOString();
    if(!project.createdAt) project.createdAt = now;
    project.updatedAt = now;
    project.schemaVersion = project.schemaVersion || '1.0';
    await MallPlanStore.set('project_' + project.projectId, project);
    const ids = (await MallPlanStore.get('project_list')) || [];
    if(!ids.includes(project.projectId)){
      ids.push(project.projectId);
      await MallPlanStore.set('project_list', ids);
    }
    return project;
  },

  /** 生成 projectId: PRJ_YYYYMMDD_NNN */
  generateProjectId(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    const rand = String(Math.floor(Math.random()*900)+100);
    return `PRJ_${y}${m}${day}_${rand}`;
  },

  /* ===================== 成交库 ===================== */

  async listDeals(){
    try{
      const ids = (await MallPlanStore.get('deal_list')) || [];
      const deals = [];
      for(const id of ids){
        const d = await MallPlanStore.get('deal_' + id);
        if(d) deals.push(d);
      }
      return deals;
    }catch(e){ console.warn('[Bridge.listDeals]',e); return []; }
  },

  async pushDeal(deal){
    if(!deal) return null;
    if(!deal.dealId){
      const d = new Date();
      const ts = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`;
      const rand = String(Math.floor(Math.random()*900)+100);
      deal.dealId = `DEAL_${ts}_${rand}`;
    }
    deal.confidence = deal.confidence || 'mid';
    deal.source     = deal.source     || '本项目签约';
    deal.createdAt  = deal.createdAt  || new Date().toISOString();
    deal.schemaVersion = deal.schemaVersion || '1.0';
    if(deal.rentDaily && !deal.rentMonthly){ deal.rentMonthly = +(deal.rentDaily * 30).toFixed(2); }
    else if(deal.rentMonthly && !deal.rentDaily){ deal.rentDaily = +(deal.rentMonthly / 30).toFixed(2); }
    await MallPlanStore.set('deal_' + deal.dealId, deal);
    const ids = (await MallPlanStore.get('deal_list')) || [];
    if(!ids.includes(deal.dealId)){
      ids.push(deal.dealId);
      await MallPlanStore.set('deal_list', ids);
    }
    try{ MallPlanStore.log({ action:'bridge_push_deal', dealId:deal.dealId, brand:deal.brandName, biz:deal.bizCategoryL2, rentDaily:deal.rentDaily }); }catch(e){}
    return deal;
  },

  async pushDealsBatch(deals){
    if(!Array.isArray(deals)) return 0;
    let ok = 0;
    for(const d of deals){ const r = await this.pushDeal(d); if(r) ok++; }
    return ok;
  },

  /* ===================== 历史回归 (M6 杀手锏) ===================== */

  /**
   * 按筛选条件查询成交统计 (加权百分位)
   * @returns { count, reliable, hasStats, p25, p50, p75, mean, min, max, avgArea, byBiz, samples }
   */
  async getDealStats(filter){
    filter = filter || {};
    const allDeals = await this.listDeals();
    const matched = allDeals.filter(d=>{
      if(filter.cityTier      && d.cityTier      !== filter.cityTier)      return false;
      if(filter.city          && d.city          !== filter.city)          return false;
      if(filter.bizCategoryL1 && d.bizCategoryL1 !== filter.bizCategoryL1) return false;
      if(filter.bizCategoryL2 && d.bizCategoryL2 !== filter.bizCategoryL2) return false;
      if(filter.floorCode     && d.floorCode     !== filter.floorCode)     return false;
      if(typeof d.rentDaily !== 'number' || d.rentDaily <= 0)              return false;
      return true;
    });

    const result = {
      filter:    filter,
      count:     matched.length,
      reliable:  matched.length >= this.MIN_SAMPLES_RELIABLE,
      hasStats:  matched.length >= this.MIN_SAMPLES_STATS,
      samples:   matched
    };
    if(matched.length === 0){
      Object.assign(result, { p25:null, p50:null, p75:null, mean:null, min:null, max:null, avgArea:null, byBiz:{} });
      return result;
    }
    const overall = this._calcPercentiles(matched.map(d=>({ v:d.rentDaily, w:this.CONFIDENCE_WEIGHT[d.confidence]||0.5 })));
    Object.assign(result, overall);
    const areas = matched.map(d=>d.buildingArea).filter(a=>typeof a==='number'&&a>0);
    result.avgArea = areas.length ? +(areas.reduce((s,a)=>s+a,0)/areas.length).toFixed(0) : null;
    const byBiz = {};
    matched.forEach(d=>{
      const k = d.bizCategoryL2 || '其他';
      if(!byBiz[k]) byBiz[k] = [];
      byBiz[k].push({ v:d.rentDaily, w:this.CONFIDENCE_WEIGHT[d.confidence]||0.5, area:d.buildingArea });
    });
    result.byBiz = {};
    Object.keys(byBiz).forEach(k=>{
      const arr = byBiz[k];
      if(arr.length < 2){
        result.byBiz[k] = { count:arr.length, p25:arr[0].v, p50:arr[0].v, p75:arr[0].v, mean:arr[0].v };
        return;
      }
      result.byBiz[k] = this._calcPercentiles(arr);
      result.byBiz[k].count = arr.length;
    });
    return result;
  },

  /** 加权百分位计算 (线性插值) */
  _calcPercentiles(samples){
    if(samples.length === 0) return { p25:null, p50:null, p75:null, mean:null, min:null, max:null };
    const sorted = samples.slice().sort((a,b)=>a.v - b.v);
    const totalW = sorted.reduce((s,x)=>s+x.w, 0);
    const findPct = (pct)=>{
      const target = totalW * pct;
      let cum = 0;
      for(let i=0; i<sorted.length; i++){
        cum += sorted[i].w;
        if(cum >= target){
          if(i === 0) return sorted[0].v;
          const prevCum = cum - sorted[i].w;
          const ratio = (target - prevCum) / sorted[i].w;
          return sorted[i-1].v + (sorted[i].v - sorted[i-1].v) * ratio;
        }
      }
      return sorted[sorted.length-1].v;
    };
    const mean = sorted.reduce((s,x)=>s + x.v*x.w, 0) / totalW;
    return {
      p25:  +findPct(0.25).toFixed(2),
      p50:  +findPct(0.50).toFixed(2),
      p75:  +findPct(0.75).toFixed(2),
      mean: +mean.toFixed(2),
      min:  +sorted[0].v.toFixed(2),
      max:  +sorted[sorted.length-1].v.toFixed(2)
    };
  },

  /* ===================== 本企业基准 (投拓核心入口) ===================== */

  /**
   * 按业态大类返回基准租金 (元/㎡/月) — 给投拓测算用
   * @returns { hasData, count, reliable, baseline: { '餐饮':{p50_daily,p50_monthly,count}, ... }, overall, source }
   */
  async getEnterpriseBaseline(filter){
    filter = filter || {};
    const allDeals = await this.listDeals();
    const matched = allDeals.filter(d=>{
      if(filter.cityTier && d.cityTier !== filter.cityTier) return false;
      if(filter.city     && d.city     !== filter.city)     return false;
      if(typeof d.rentDaily !== 'number' || d.rentDaily <= 0) return false;
      return true;
    });
    const result = {
      hasData:   matched.length >= this.MIN_SAMPLES_STATS,
      count:     matched.length,
      reliable:  matched.length >= this.MIN_SAMPLES_RELIABLE,
      filter:    filter,
      baseline:  {},
      source:    matched.length > 0 ? '本企业历史成交' : '无数据'
    };
    if(matched.length === 0) return result;
    const groups = {};
    matched.forEach(d=>{
      const k = d.bizCategoryL1 || '其他';
      if(!groups[k]) groups[k] = [];
      groups[k].push({ v:d.rentDaily, w:this.CONFIDENCE_WEIGHT[d.confidence]||0.5 });
    });
    Object.keys(groups).forEach(k=>{
      const arr = groups[k];
      const stat = this._calcPercentiles(arr);
      result.baseline[k] = {
        count:        arr.length,
        p50_daily:    stat.p50,
        p50_monthly:  +(stat.p50 * 30).toFixed(0),
        p25_daily:    stat.p25,
        p75_daily:    stat.p75,
        p25_monthly:  +(stat.p25 * 30).toFixed(0),
        p75_monthly:  +(stat.p75 * 30).toFixed(0)
      };
    });
    const overall = this._calcPercentiles(matched.map(d=>({ v:d.rentDaily, w:this.CONFIDENCE_WEIGHT[d.confidence]||0.5 })));
    result.overall = {
      p50_daily:    overall.p50,
      p50_monthly:  +(overall.p50 * 30).toFixed(0),
      p25_daily:    overall.p25,
      p75_daily:    overall.p75
    };
    return result;
  },

  /** 元信息 */
  meta:{
    version:     '1.0',
    schemaVersion:'1.0',
    minSamples:  5,
    minReliable: 50,
    note:        'MallPlan Bridge 提供跨模块的项目档案、成交库、品牌库共享通道。所有数据通过 MallPlanStore 持久化,后端切换无需改 Bridge。'
  }
};

const fmtPct = (v,frac=1)=>{

const fmtWan = (v,frac=1)=>{

function toast(msg, kind="ok"){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show " + (kind==="err"?"err":"ok");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

function modal({title, body, foot, closable}){
  $("#modalTitle").textContent = title || "";
  $("#modalBody").innerHTML = body || "";
  $("#modalFoot").innerHTML = "";
  if(foot){
    foot.forEach(b=>{
      const btn = document.createElement("button");
      btn.className = "btn " + (b.kind || "");
      btn.textContent = b.label;
      /* v13.0:支持按钮 id (用于动态修改按钮文本/状态, 例如企业版强制复制) */
      if(b.id) btn.id = b.id;
      btn.onclick = ()=>{
        const r = b.onClick ? b.onClick() : undefined;
        /* v13.0:如果 onClick 返回 false,且 close !== true,则阻止关闭 */
        if(r === false) return;
        if(b.close!==false) closeModal(true);
      };
      $("#modalFoot").appendChild(btn);
    });
  }
  /* v12.0:closable === false 进入"门禁锁定"模式 — 隐藏 X 按钮、禁用背景点击、禁用 ESC */
  const isLocked = (closable === false);
  $("#modalBg").dataset.locked = isLocked ? "1" : "";
  const closeBtn = $("#modalClose");
  if(closeBtn) closeBtn.style.display = isLocked ? "none" : "";
  $("#modalBg").classList.add("show");
}
function closeModal(force){
  /* v12.0:被锁定的模态(门禁/激活闸口)只能由按钮回调主动调用 closeModal(true) 来关闭 */
  if(!force && $("#modalBg").dataset.locked === "1") return;
  $("#modalBg").classList.remove("show");
  $("#modalBg").dataset.locked = "";
  const closeBtn = $("#modalClose");
  if(closeBtn) closeBtn.style.display = "";
}

function download(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();}, 100);
}

/* v5.1 新增:导出报告为 Word 文档 (.doc 格式)
 * 用 MS Office 兼容的 HTML+namespace 头,Word 能直接打开并保留样式
 * 不依赖外部库,招商人员下载后可直接编辑修改 */
function exportReportAsWord(reportId, filename){
  const el = document.getElementById(reportId);
  if(!el){ toast("请先生成报告","err"); return; }

  /* v12.0:试用版/免费版 均加水印,激活后无水印;水印加密度 + 多位置 */
  const isWatermarked = (typeof license !== 'undefined' && (license.tier === 'free' || license.tier === 'trial'));
  const wmText = (license && license.tier === 'trial') ? 'MallPlan 试用版' : 'MallPlan 免费版';
  const watermarkHtml = isWatermarked ?
    `<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:80pt;color:rgba(212,166,75,.16);font-weight:900;z-index:0;pointer-events:none;letter-spacing:.05em">${wmText}</div>
     <div style="position:fixed;top:18%;left:14%;transform:rotate(-30deg);font-size:36pt;color:rgba(212,166,75,.10);font-weight:700;z-index:0;pointer-events:none">${wmText}</div>
     <div style="position:fixed;bottom:14%;right:10%;transform:rotate(-30deg);font-size:36pt;color:rgba(212,166,75,.10);font-weight:700;z-index:0;pointer-events:none">${wmText}</div>
     <div style="position:fixed;top:78%;left:6%;transform:rotate(-30deg);font-size:24pt;color:rgba(212,166,75,.08);font-weight:600;z-index:0;pointer-events:none">${wmText} · 仅供试用</div>` : '';

  /* Word 兼容的 HTML 头 (MS Office "Word XML namespace" 声明) */
  const head = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${escapeHtml(filename)}</title>
<style>
  @page { margin: 2cm 2.5cm; size: A4 portrait }
  body{font-family:"Microsoft YaHei","SimSun",serif;line-height:1.65;font-size:12pt;color:#222;position:relative}
  h1{font-size:20pt;margin:0 0 6pt;color:#111}
  h2{font-size:14pt;margin:18pt 0 8pt;color:#111;border-bottom:1px solid #ccc;padding-bottom:3pt}
  h3{font-size:11pt;margin:12pt 0 5pt;color:#333}
  table{width:100%;border-collapse:collapse;margin:8pt 0;font-size:10.5pt}
  table th,table td{border:1px solid #ddd;padding:5pt 8pt;text-align:left;vertical-align:top}
  table th{background:#f5f5f5;font-weight:bold;color:#333}
  .num{text-align:right}
  .meta{color:#666;font-size:9pt;margin-bottom:14pt}
  .meta span{margin-right:14pt}
  .quote{background:#fafafa;border-left:3pt solid #c98828;padding:7pt 12pt;color:#444;margin:9pt 0}
  .sig{margin-top:24pt;color:#555;font-size:9pt}
  .footer{margin-top:24pt;padding-top:8pt;border-top:1px solid #eee;color:#888;font-size:9pt;text-align:center}
  small{font-size:9pt;color:#888}
  details{display:block}
  details summary{display:none}  /* Word 不支持 details,展开内容 */
</style>
</head><body>${watermarkHtml}`;
  const body = el.innerHTML;
  const html = head + body + "</body></html>";

  /* application/msword + .doc 扩展名,Word 自动识别 */
  const blob = new Blob(['\ufeff' + html], { type: 'application/msword;charset=utf-8' });
  download(blob, filename);
  toast(license && (license.tier === 'free' || license.tier === 'trial') ? `已导出 Word（含水印·${license.tier==='trial'?'试用版':'免费版'}）` : "已导出 Word 文档", "ok");
}

/* v5 维度系数取值辅助函数(都返回多维 obj,缺省返回基准对象) */
function dimCoeff(dim, key, fallback){
  return (COEFFS[dim] && COEFFS[dim][key]) || fallback;
}

/* v5 综合系数计算(给定一组维度,返回各变量乘积)
 * 用于:租金 / 坪效 / 客单价 / 人工 / 装修 五个变量分别取对应维度的乘积
 * dimensions: { city, circle, mall, projectSize }
 */
function projectCoeffs({city, circle, mall, projectSize}){
  const c = dimCoeff("city",        city,        {rent:1, turnover:1, ticket:1, labor:1, fitOut:1});
  const ci= dimCoeff("circle",      circle,      {rent:1, turnover:1, ticket:1, labor:1});
  const m = dimCoeff("mall",        mall,        {rent:1, turnover:1, ticket:1, fitOut:1});
  const sz= dimCoeff("projectSize", projectSize, {rent:1, turnover:1, ticket:1});
  return {
    rent:     c.rent     * ci.rent     * m.rent     * sz.rent,
    turnover: c.turnover * ci.turnover * m.turnover * sz.turnover,
    ticket:   c.ticket   * ci.ticket   * m.ticket   * sz.ticket,
    labor:    c.labor    * ci.labor    * 1.0        * 1.0,    /* mall/size 不影响人工 */
    fitOut:   c.fitOut   * 1.0         * (m.fitOut||1) * 1.0, /* v6.0:城市 × 商场档位共同决定装修标准 */
    /* 调试 */
    breakdown: {city:c, circle:ci, mall:m, size:sz}
  };
}

/* 业态匹配度查询函数 */
function coeffFloor(bizL1, floor) {
  return (COEFFS.floorByBiz[bizL1] && COEFFS.floorByBiz[bizL1][floor]) || 1.0;
}
function coeffBizCity(bizL1, city) {
  return (COEFFS.bizCityElast[bizL1] && COEFFS.bizCityElast[bizL1][city]) || 1.0;
}
/* v10.1 新增:业态在不同商圈位置的承租弹性 */
function coeffBizCircle(bizL1, circle) {
  return (COEFFS.bizCircleElast[bizL1] && COEFFS.bizCircleElast[bizL1][circle]) || 1.0;
}
/* 面积偏离业态典型区间时的惩罚系数
 * area: 实际面积; areaMin/areaMax: 业态典型范围
 * 算法:在区间内 = 1.0; 偏离越远,降幅越大,但有底线 0.7
 */
function coeffAreaFit(area, areaMin, areaMax) {
  if (!area || !areaMin || !areaMax) return 1.0;
  if (area >= areaMin && area <= areaMax) return 1.0;
  if (area < areaMin) {
    const ratio = area / areaMin;
    return Math.max(0.70, 0.85 + 0.15 * ratio);
  }
  // area > areaMax
  const ratio = areaMax / area;
  return Math.max(0.75, 0.85 + 0.15 * ratio);
}

/* v7:本地密码哈希(简单 SHA-256,够防止意外查看)。 */
async function hashPwd(pwd){
  if(!pwd) return "";
  try{
    const buf = new TextEncoder().encode(pwd);
    const h = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ /* 兼容性兜底:简单哈希 */
    let h=0; for(let i=0;i<pwd.length;i++) h=(h*31 + pwd.charCodeAt(i))|0;
    return "fb_"+(h>>>0).toString(16);
  }
}

  const newState = JSON.parse(JSON.stringify(def));

      usableArea: "",                                   /* V1.13:建筑面积(待补) */
      frontWidth: old.frontWidth || "",

      corner: old.corner || false,

      floorHeight: "",

      powerCapacity: "",
      hasGas: "",
      hasWaterDrain: "",
      fireRating: "",
      acType: "",
      exhaustType: "",
      engineerRemarks: "",
      /* 兼容旧版字段(过渡期)*/
      _legacyArea: old.area,
      _legacyBiz: old.biz,
      _legacySubBiz: old.subBiz,
      _legacyStatus: old.status,
      _legacyFloor: old.floor

  /* 迁移 deals:同样字段对齐 */
  newState.deals = (oldData.deals || []).map(old => {
    const newBizL1 = bizL1Map[old.biz] || old.biz || "";
    const newBizL2 = subBizMap[old.subBiz] || old.subBiz || "";

  console.log(`迁移完成: ${newState.shops.length} 铺位, ${newState.deals.length} 成交`);

}

/* ============================================================
 * v3 字段访问适配层
 * 旧代码大量使用 s.area / s.biz / s.subBiz / s.status / s.note / s.floor 等字段
 * v3 实际字段是 V1.13 风格: buildingArea / bizCategoryL1 / bizCategoryL2 / leaseStatus / remarks / floorId
 * 双向同步:读时各种命名都返回值;写新字段时同步刷旧字段(为 v2 时期写的代码兼容)
 * ============================================================ */

/* 给 shop 对象做字段同步,确保新旧字段都能用
 * 策略:V1.13 字段是权威源,但如果旧字段被外部代码改动,要能感知到
 * 实现:每次 sync 检查 v1.13 字段为空时才用旧字段填充,反之 V1.13 字段始终复制到旧字段
 */
function syncShop(shop){
  if(!shop) return shop;

  /* Step 1: 旧字段 → V1.13(只在 V1.13 字段空时填充) */
  if((!shop.buildingArea || shop.buildingArea === "") && shop.area !== undefined && shop.area !== "") {
    shop.buildingArea = String(shop.area);
  }
  if(!shop.bizCategoryL1 && shop.biz) shop.bizCategoryL1 = shop.biz;
  if(!shop.bizCategoryL2 && shop.subBiz) shop.bizCategoryL2 = shop.subBiz;
  if(!shop.leaseStatus && shop.status) shop.leaseStatus = shop.status;
  if(!shop.remarks && shop.note) shop.remarks = shop.note;

  /* Step 2: 检测旧字段被改动(area/biz 等被改后,值与 V1.13 不一致) */
  if(shop.area !== undefined && shop.area !== "" && +shop.area !== +shop.buildingArea){
    shop.buildingArea = String(shop.area);
  }
  if(shop.biz && shop.biz !== shop.bizCategoryL1) shop.bizCategoryL1 = shop.biz;
  if(shop.subBiz && shop.subBiz !== shop.bizCategoryL2) shop.bizCategoryL2 = shop.subBiz;
  if(shop.status && shop.status !== shop.leaseStatus) shop.leaseStatus = shop.status;
  if(shop.note && shop.note !== shop.remarks) shop.remarks = shop.note;

  /* Step 3: V1.13 → 旧(权威值复制到旧字段名,确保旧代码能读到正确值) */
  if(shop.buildingArea !== undefined && shop.buildingArea !== "") shop.area = +shop.buildingArea || 0;
  if(shop.bizCategoryL1) shop.biz = shop.bizCategoryL1;
  if(shop.bizCategoryL2) shop.subBiz = shop.bizCategoryL2;
  if(shop.leaseStatus) shop.status = shop.leaseStatus;
  if(shop.remarks) shop.note = shop.remarks;

  /* Step 4: floorId → floor (取楼层 floorCode) */
  if(shop.floorId && state && state.project && state.project.floors){
    const f = state.project.floors.find(x => x.id === shop.floorId);
    if(f) shop.floor = f.floorCode;
  } else if(shop.floor && state && state.project && state.project.floors){
    /* 反向:旧 floor("L2") → floorId("fl_L2") */
    const f = state.project.floors.find(x => x.floorCode === shop.floor);
    if(f) shop.floorId = f.id;
  }

  return shop;
}

/* 给 deal 对象做字段同步 */
function syncDeal(deal){
  if(!deal) return deal;
  if(deal.bizCategoryL1 !== undefined) deal.biz = deal.bizCategoryL1 || deal.biz;
  if(deal.bizCategoryL2 !== undefined) deal.subBiz = deal.bizCategoryL2 || deal.subBiz;
  if(deal.brandName !== undefined) deal.brand = deal.brandName || deal.brand;
  if(deal.buildingArea !== undefined && deal.buildingArea !== "") deal.area = +deal.buildingArea || deal.area;
  if(deal.rentQuote !== undefined && deal.rentQuote !== "") deal.rent = +deal.rentQuote || deal.rent;
  if(deal.fitmentFreeMonths !== undefined && deal.fitmentFreeMonths !== "") deal.free = +deal.fitmentFreeMonths || deal.free;
  if(deal.leaseYears !== undefined && deal.leaseYears !== "") deal.years = +deal.leaseYears || deal.years;
  /* 反向回填 */
  if(deal.biz && !deal.bizCategoryL1) deal.bizCategoryL1 = deal.biz;
  if(deal.subBiz && !deal.bizCategoryL2) deal.bizCategoryL2 = deal.subBiz;
  if(deal.brand && !deal.brandName) deal.brandName = deal.brand;
  return deal;
}

/* 操作工具:推荐使用,自动 sync */
function pushShop(shop){ syncShop(shop); state.shops.push(shop); Store.save(); return shop; }
function pushDeal(deal){ syncDeal(deal); state.deals.push(deal); Store.save(); return deal; }
function updateShop(id, updates){
  const idx = state.shops.findIndex(s => s.id === id);
  if(idx < 0) return null;
  state.shops[idx] = syncShop({...state.shops[idx], ...updates});
  Store.save();
  return state.shops[idx];
}
function updateDeal(id, updates){
  const idx = state.deals.findIndex(d => d.id === id);
  if(idx < 0) return null;
  state.deals[idx] = syncDeal({...state.deals[idx], ...updates});
  Store.save();
  return state.deals[idx];
}
function deleteShop(id){ state.shops = state.shops.filter(s => s.id !== id); Store.save(); }
function deleteDeal(id){ state.deals = state.deals.filter(d => d.id !== id); Store.save(); }

let state = Store.load();
/* v3:启动时把所有 shops/deals 字段同步一次,确保新旧字段都可用 */
if(state.shops) state.shops.forEach(syncShop);
if(state.deals) state.deals.forEach(syncDeal);
