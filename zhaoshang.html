function fromV113Format(v113){
  const fresh = Store.fresh();
  /* 项目基本 */
  fresh.project.name = v113.name || fresh.project.name;
  /* 楼层 */
  if(v113.floors && v113.floors.length){
    fresh.project.floors = v113.floors.map(f => ({
      id: f.id,
      name: f.name || f.id,
      floorCode: f.name?.replace(/层$/,'') || "L1",
      avgFloorHeight: "",
      totalArea: 0,
      remarks: ""
    }));
  }
  /* 自定义标签 */
  if(v113.customTags && v113.customTags.length){
    fresh.project.customTags = v113.customTags.map(t => ({
      id: t.id,
      name: t.name || "未命名",
      icon: t.icon || "🏷️",
      color: t.color || "#888"
    }));
  }
  /* 铺位 */
  fresh.shops = (v113.shops || []).map(shop => {
    const newShop = {
      id: shop.id || uuid(),
      shopId: shop.shopId || "",
      shopName: shop.shopName || "",
      floorId: shop.floorId,
      buildingArea: shop.buildingArea || "",
      usableArea: shop.usableArea || "",
      frontWidth: 5, anchorDist: 15, corner: false, urgency: "mid",
      bizCategoryL1: shop.bizCategoryL1 || "",
      bizCategoryL2: shop.bizCategoryL2 || "",
      leaseStatus: shop.leaseStatus || "待招商",
      brandName: shop.brandName || "",
      brandLevel: shop.brandLevel || "",
      rentQuote: shop.rentQuote || "",
      propertyFee: shop.propertyFee || "",
      promotionFee: shop.promotionFee || "",
      fitmentFreeMonths: shop.fitmentFreeMonths || "",
      leaseYears: shop.leaseYears || "",
      rentIncrementPct: shop.rentIncrementPct || "",
      rentIncrementEveryYears: shop.rentIncrementEveryYears || "",
      leaseStartDate: shop.leaseStartDate || "",
      leaseEndDate: shop.leaseEndDate || "",
      deliveryDate: shop.deliveryDate || "",
      openingDate: shop.openingDate || "",
      salesperson: shop.salesperson || "",
      negotiationStage: shop.negotiationStage || "",
      remarks: shop.remarks || "",
      tags: shop.tags || [],
      floorHeight: shop.floorHeight || "",
      loadLimit: shop.loadLimit || "",
      powerCapacity: shop.powerCapacity || "",
      hasGas: shop.hasGas || "",
      hasWaterDrain: shop.hasWaterDrain || "",
      fireRating: shop.fireRating || "",
      acType: shop.acType || "",
      exhaustType: shop.exhaustType || "",
      engineerRemarks: shop.engineerRemarks || ""
    };
    syncShop(newShop);
    return newShop;
  });
  /* v3 extras 回填 */
  if(v113._v3_extras){
    if(v113._v3_extras.city) fresh.project.city = v113._v3_extras.city;
    if(v113._v3_extras.circle) fresh.project.circle = v113._v3_extras.circle;
    if(v113._v3_extras.mall) fresh.project.mall = v113._v3_extras.mall;
    if(v113._v3_extras.owner) fresh.project.owner = v113._v3_extras.owner;
    if(v113._v3_extras.deals) fresh.deals = v113._v3_extras.deals.map(d => { syncDeal(d); return d; });
    if(v113._v3_extras.benchmark) fresh.benchmark = v113._v3_extras.benchmark;
  }
  return fresh;
}

function importAll(){
  const inp = $("#fileImport");
  /* v5:接受 .json + .xlsx + .mallpkg.json */
  inp.accept = ".json,.xlsx,.mallpkg.json,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  inp.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const fname = (f.name || "").toLowerCase();
    /* v5 新增:Excel 分流 */
    if(fname.endsWith(".xlsx") || fname.endsWith(".xls")){
      importFromExcel(f).finally(()=>{ inp.value = ""; });
      return;
    }
    /* JSON 路径(含 .mallpkg.json) */
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const obj = JSON.parse(r.result);
        if(!obj || typeof obj !== "object") throw new Error("非有效 JSON");

        /* 自动识别格式 */
        let format = "v3";
        if(obj._exportVersion === "v5.0" && obj._exportType === "personal-data") format = "v5-personal";
        else if(obj._exportSchema === "MallBroker-V1.13-compatible") format = "v113-compat";
        else if(obj.shops && obj.floors && !obj._dataVersion) format = "v113-native";

        const formatLabel = {
          "v5-personal": "v5 本人数据(含项目场景配置)",
          "v3": "v3/v4 完整数据",
          "v113-compat": "mallplan兼容格式 (含 v3 算账数据)",
          "v113-native": "mallplan兼容格式 (原生数据)"
        }[format];

        if(!confirm(`检测到 ${formatLabel}\n导入将覆盖当前的项目配置/铺位/历史成交,业态基准库会保留。继续?`)) return;

        if(format === "v113-compat" || format === "v113-native"){
          state = fromV113Format(obj);
        } else if(format === "v5-personal"){
          /* v5 本人数据:只覆盖 project / shops / deals,基准库保留 */
          const benchmark = state.benchmark;  /* 保留当前基准库 */
          state = {
            ...Store.fresh(),
            project: { ...Store.fresh().project, ...obj.project },
            shops: obj.shops || [],
            deals: obj.deals || [],
            benchmark
          };
        } else {
          state = {...Store.fresh(), ...obj};
        }

        if(state.shops) state.shops.forEach(syncShop);
        if(state.deals) state.deals.forEach(syncDeal);

        Store.save(); render();
        toast(`已导入 ${formatLabel} (${state.shops?.length||0} 铺位 / ${state.deals?.length||0} 成交)`, "ok");
      }catch(err){
        console.error(err);
        toast("导入失败:"+err.message,"err");
      }
    };
    r.readAsText(f); inp.value = "";
  };
  inp.click();
}

/* v5 新增:Excel 导入 - 解析 .xlsx 文件,识别"铺位与谈判"和"历史成交"两个 sheet */
function importFromExcel(file){
  return loadXLSXLib().then(XLSX => {
    return new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = (e)=>{
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, {type: "array"});

          /* 找 sheet:支持中文名,也支持任意首个 sheet */
          let shopSheet = wb.Sheets["铺位与谈判"] || wb.Sheets["铺位列表"] || wb.Sheets["Sheet1"] || wb.Sheets[wb.SheetNames[0]];
          let dealSheet = wb.Sheets["历史成交"] || wb.Sheets["成交"];
          let projSheet = wb.Sheets["项目信息"];

          const shopRows = shopSheet ? XLSX.utils.sheet_to_json(shopSheet) : [];
          const dealRows = dealSheet ? XLSX.utils.sheet_to_json(dealSheet) : [];
          const projRows = projSheet ? XLSX.utils.sheet_to_json(projSheet) : [];

          if(!shopRows.length && !dealRows.length){
            toast("Excel 中未找到铺位或成交数据,请确认列名","err");
            reject(new Error("空数据")); return;
          }

          /* v5.1 列名预检诊断:在用户点确认前显示识别到的关键列,让用户提前发现列名问题 */
          const sampleShop = shopRows[0] || {};
          const sampleDeal = dealRows[0] || {};
          const detectedShopCols = Object.keys(sampleShop).slice(0, 12).join("、");
          const criticalShopCols = ["铺位编号","楼层","建筑面积","业态","细分业态"];
          const missingCritical = criticalShopCols.filter(k => !Object.keys(sampleShop).some(col => col.includes(k)));
          const warnTxt = missingCritical.length>0 ? `\n\n⚠ 警告:可能缺少关键列 [${missingCritical.join("、")}],导入后这些字段将取默认值或为空,请检查 Excel 列名。` : "";

          if(!confirm(`Excel 检测到 ${shopRows.length} 个铺位 + ${dealRows.length} 条成交\n\n铺位表实际列名:${detectedShopCols}${warnTxt}\n\n导入将覆盖当前铺位/成交,基准库保留。继续?`)){
            resolve(); return;
          }

          /* 字段映射:Excel 列名 → 内部字段
           * v5.1 修复:为缺失字段提供合理默认值,避免待报价看板字段空白
           * - frontWidth: Excel 通常不填面宽 → 默认 5m(中等)
           * - anchorDist: Excel 通常不填到主力店距离 → 默认 15m(中等)
           * - corner/urgency 等:确保有合理默认
           * - 列名匹配增强:精确匹配失败时,改用模糊匹配(列名包含关键词即视为命中)*/
          const fuzzyGet = (row, ...candidates)=>{
            // 先精确匹配
            for(const k of candidates){
              if(row[k] !== undefined && row[k] !== "" && row[k] !== null) return row[k];
            }
            // 退化为模糊匹配:任何 row key 包含 candidate 关键词
            const keys = Object.keys(row);
            for(const cand of candidates){
              const found = keys.find(k => k.includes(cand) || cand.includes(k.replace(/[\s()()㎡平米米元月%/]/g,"")));
              if(found && row[found] !== undefined && row[found] !== "" && row[found] !== null){
                return row[found];
              }
            }
            return "";
          };
          const mapShop = (row)=>{
            const get = (...keys)=> fuzzyGet(row, ...keys);
            const cornerRaw = String(get("转角","Corner")||"");
            const isCorner = cornerRaw === "是" || cornerRaw === "true" || cornerRaw === "1";
            const areaVal = +get("建筑面积(㎡)","建筑面积","面积","Area") || 0;
            const usableVal = +get("使用面积(㎡)","使用面积","实用面积") || 0;
            const fwVal = +get("面宽(米)","面宽","FrontWidth") || 0;
            const adVal = +get("距主力店(米)","距主力店","AnchorDist") || 0;
            const urgencyRaw = String(get("紧迫度","Urgency")||"mid").toLowerCase();
            const urgencyVal = ["low","mid","high"].includes(urgencyRaw) ? urgencyRaw : "mid";
            // 业态自动归类:如果只填了细分业态(如"川渝火锅"),反查所属大类
            let bizL1 = String(get("业态大类","业态","类别","类目","Biz")||"");
            let bizL2 = String(get("细分业态","子业态","SubBiz")||"");
            if(bizL2 && !bizL1){
              for(const cat in (state.benchmark||{})){
                if(state.benchmark[cat][bizL2]){ bizL1 = cat; break; }
              }
            }
            if(!bizL1) bizL1 = "餐饮";  /* 兜底 */
            return {
              id: "shop_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
              shopId: String(get("铺位编号","编号","Shop ID","ID")||""),
              shopName: String(get("铺位名称","名称")||""),
              floor: String(get("楼层","Floor")||"L1"),
              area: areaVal || usableVal || 100,           /* 缺面积时默认 100㎡ */
              buildingArea: String(areaVal || usableVal || 100),
              usableArea: usableVal,
              frontWidth: fwVal || 5,                       /* v5.1 修复:Excel 不填默认 5m 中等面宽 */
              anchorDist: adVal || 15,                      /* v5.1 修复:不填默认 15m */
              corner: isCorner ? "是" : "否",                /* v5.1 修复:统一为字符串(原 boolean 与其他代码不兼容) */
              biz: bizL1,
              subBiz: bizL2,
              bizCategoryL1: bizL1,
              bizCategoryL2: bizL2,
              status: String(get("招商状态","状态")||"待招商"),
              leaseStatus: String(get("招商状态","状态")||"待招商"),
              brandName: String(get("品牌名","品牌")||""),
              brandLevel: String(get("品牌实力","品牌等级")||""),
              brandTier: String(get("品牌实力","品牌等级")||""),
              salesperson: String(get("招商负责人","负责人")||""),
              negotiationStage: String(get("谈判阶段")||""),
              rentQuote: +get("意向租金(元/㎡)","意向租金") || 0,
              propertyFee: +get("物业费(元/㎡)","物业费") || 0,
              fitmentFreeMonths: +get("免租期(月)","免租期") || 0,
              leaseYears: +get("合同年限") || 0,
              rentIncrementPct: +get("递增率(%)","递增率") || 0,
              urgency: urgencyVal,
              tagIds: [],
              tags: [],
              remarks: String(get("备注","Notes")||"")
            };
          };

          const mapDeal = (row)=>{
            const get = (...keys)=> fuzzyGet(row, ...keys);
            // 业态自动归类
            let bizL1 = String(get("业态大类","业态","类别","Biz")||"");
            let bizL2 = String(get("细分业态","子业态","SubBiz")||"");
            if(bizL2 && !bizL1){
              for(const cat in (state.benchmark||{})){
                if(state.benchmark[cat][bizL2]){ bizL1 = cat; break; }
              }
            }
            return {
              id: "deal_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
              shopId: String(get("铺位编号","编号")||""),
              brand: String(get("品牌","品牌名","品牌方")||""),
              biz: bizL1,
              subBiz: bizL2,
              floor: String(get("楼层")||""),
              area: +get("面积(㎡)","面积","Area","建筑面积") || 0,
              rent: +get("签约租金(元/㎡)","签约租金","租金") || 0,
              mgmt: +get("物业费(元/㎡)","物业费") || 0,
              free: +get("免租期(月)","免租期") || 0,
              allowance: +get("装补(元)","装补","装修补贴") || 0,
              incr: +get("递增率(%)","递增率") || 0,
              years: +get("合同年限") || 0,
              rentToSales: +get("租售比") || 0,
              createdAt: String(get("签约日期","日期")||""),
              createdBy: String(get("经办人","负责人")||"")
            };
          };

          state.shops = shopRows.map(mapShop);
          /* v5.1 修复:Excel 缺细分业态时,自动取该大类第一个细分,避免后续 Calc.bench 失败 */
          state.shops.forEach(s=>{
            if(!s.subBiz && s.biz && state.benchmark[s.biz]){
              const firstSub = Object.keys(state.benchmark[s.biz])[0];
              if(firstSub){ s.subBiz = firstSub; s.bizCategoryL2 = firstSub; }
            }
          });

          /* 项目信息 sheet 是 KV 表,可选导入 */
          if(projRows.length){
            const projMap = {};
            projRows.forEach(r => { if(r["字段"] && r["值"]) projMap[r["字段"]] = String(r["值"]); });

            if(projMap["城市级别"]) state.project.city = projMap["城市级别"];

            if(projMap["商场定位"]) state.project.mall = projMap["商场定位"];
            if(projMap["项目体量"]) state.project.projectSize = projMap["项目体量"].replace(/㎡$/,"");
            if(projMap["项目负责人"]) state.project.owner = projMap["项目负责人"];
          }

          state.shops.forEach(syncShop);
          state.deals.forEach(syncDeal);
          Store.save(); render();
          toast(`已导入 Excel:${state.shops.length} 个铺位 + ${state.deals.length} 条成交`,"ok");
          resolve();
        } catch(err){
          console.error(err);
          toast("Excel 解析失败:"+err.message,"err");
          reject(err);
        }
      };
      r.onerror = ()=>{ toast("文件读取失败","err"); reject(r.error); };
      r.readAsArrayBuffer(file);
    });
  }).catch(err => {
    console.error(err);
    toast("Excel 库加载失败,请检查网络后重试","err");
  });
}

/* ============================================================
 * v13.0 设备指纹与防盗用模块
 * ------------------------------------------------------------
 * 设计原则:
 *   1. 个人版(¥99)→ 单设备绑定:激活时记录指纹,启动时校验,不一致拒绝
 *   2. 企业版(¥1,999/年)→ 多设备登记:每激活一台机器都生成回执码,
 *      用户必须把回执码发给商务(后台登记),便于"卖出 N 个许可对应 N 台设备"
 *   3. 试用版(trial 激活码 / 7 天免试)→ 不做指纹绑定(降低试用门槛)
 *   4. 指纹采集:UA + 屏幕分辨率 + 时区 + 语言 + Canvas + WebGL
 *      用 SHA-256 生成稳定 16 位指纹(不可逆,保护用户隐私)
 *   5. 指纹不一致时,提示用户「联系商务重置」,不直接拉黑
 * ============================================================ */

/* v13.0 v 采集设备指纹原料(同步,不依赖第三方库) */
function collectFingerprintRaw(){
  const items = [];
  try{ items.push(navigator.userAgent || ''); }catch(e){ items.push(''); }
  try{ items.push((navigator.languages||[navigator.language||'']).join(',')); }catch(e){ items.push(''); }
  try{ items.push(navigator.platform || ''); }catch(e){ items.push(''); }
  try{ items.push(navigator.hardwareConcurrency || 0); }catch(e){ items.push(0); }
  try{ items.push(navigator.deviceMemory || 0); }catch(e){ items.push(0); }
  try{ items.push(screen.width + 'x' + screen.height + 'x' + screen.colorDepth); }catch(e){ items.push(''); }
  try{ items.push(window.devicePixelRatio || 1); }catch(e){ items.push(1); }
  try{ items.push((new Date()).getTimezoneOffset()); }catch(e){ items.push(0); }
  try{ items.push(Intl.DateTimeFormat().resolvedOptions().timeZone || ''); }catch(e){ items.push(''); }

  /* Canvas 指纹 — GPU/字体渲染差异会导致像素哈希不同 */
  try{
    const c = document.createElement('canvas');
    c.width = 220; c.height = 30;
    const cx = c.getContext('2d');
    cx.textBaseline = 'top';
    cx.font = '14px "Arial"';
    cx.fillStyle = '#f60';
    cx.fillRect(125,1,62,20);
    cx.fillStyle = '#069';
    cx.fillText('MallPlan-FP-2025', 2, 2);
    cx.fillStyle = 'rgba(102,204,0,0.7)';
    cx.fillText('MallPlan-FP-2025', 4, 17);
    items.push(c.toDataURL().slice(-120));
  }catch(e){ items.push('canvas-err'); }

  /* WebGL 指纹 — 显卡型号差异会导致 vendor/renderer 不同 */
  try{
    const gc = document.createElement('canvas');
    const gl = gc.getContext('webgl') || gc.getContext('experimental-webgl');
    if(gl){
      const ext = gl.getExtension('WEBGL_debug_renderer_info');
      if(ext){
        items.push(gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) || '');
        items.push(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || '');
      } else {
        items.push(gl.getParameter(gl.VENDOR) || '');
        items.push(gl.getParameter(gl.RENDERER) || '');
      }
    } else {
      items.push('no-webgl');
    }
  }catch(e){ items.push('webgl-err'); }

  return items.join('||');
}

/* v13.0 v 用 SubtleCrypto 计算 SHA-256, 截取前 16 字符作为短指纹
 * 异步函数,需要 await; 兼容降级:不支持时用 djb2 哈希 */
async function computeDeviceFingerprint(){
  const raw = collectFingerprintRaw();
  try{
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
      const enc = new TextEncoder();
      const buf = await crypto.subtle.digest('SHA-256', enc.encode(raw));
      const arr = Array.from(new Uint8Array(buf));
      const hex = arr.map(b=>b.toString(16).padStart(2,'0')).join('');
      return 'FP-' + hex.slice(0,16).toUpperCase();
    }
  }catch(e){}
  /* 降级 djb2 哈希 */
  let h = 5381;
  for(let i=0;i<raw.length;i++){ h = ((h<<5)+h+raw.charCodeAt(i))|0; }
  return 'FP-' + (h>>>0).toString(16).toUpperCase().padStart(8,'0').slice(0,16);
}

/* v13.0 v 同步缓存指纹值 — 避免每次都异步计算阻塞 UI
 * 启动时计算一次,之后所有调用直接读 _CACHED_FINGERPRINT */
let _CACHED_FINGERPRINT = null;
async function ensureFingerprint(){
  if(_CACHED_FINGERPRINT) return _CACHED_FINGERPRINT;
  _CACHED_FINGERPRINT = await computeDeviceFingerprint();
  return _CACHED_FINGERPRINT;
}
function getFingerprintSync(){
  return _CACHED_FINGERPRINT || 'FP-PENDING';
}

const LICENSE_STORAGE_KEY = 'mallplan_pricing_license_v1';
/* v12.0 license 增加字段:
 *   freeTrialStartedAt:Number — 用户首次点击"立即试用"的时间戳;
 *     未启动 = null/undefined,启动后记录,7 天后视为试用过期(进入硬墙);
 *   FREE_TRIAL_DAYS = 7 — 免试码本地体验天数(产品销售策略可调)
 * v13.0 license 再增字段:
 *   boundFingerprint:String — 激活时绑定的设备指纹(FP-XXXXXXXXXXXXXXXX);
 *     仅个人版/企业版会写入,用于启动时校验;试用版/免费版不绑定
 *   deviceLabel:String — 用户激活时填的设备别名(如「办公室电脑」),便于商务后台对账 */
const FREE_TRIAL_DAYS = 7;
let license = { tier:'free', key:'', activatedAt:null, expiryDate:null, freeTrialStartedAt:null, boundFingerprint:null, deviceLabel:null };

/* v13.0 设备指纹不匹配时的状态标志(由 loadLicense 设置, 启动门禁会读取) */
let _fingerprintMismatch = false;

/* v12.0 试用辅助:返回当前免试体验剩余天数(仅对 tier==='free' 有意义)
 *   未启动免试  → null
 *   尚在免试期  → 正整数(剩余天数)
 *   免试已过期  → 0 */
function getFreeTrialRemaining(){
  if(!license || license.tier !== 'free' || !license.freeTrialStartedAt) return null;
  const elapsed = Date.now() - license.freeTrialStartedAt;
  const total = FREE_TRIAL_DAYS * 86400000;
  if(elapsed >= total) return 0;
  return Math.max(1, Math.ceil((total - elapsed) / 86400000));
}
function isFreeTrialExpired(){
  return license.tier === 'free' && license.freeTrialStartedAt && getFreeTrialRemaining() === 0;
}
function isFreeTrialActive(){
  return license.tier === 'free' && license.freeTrialStartedAt && getFreeTrialRemaining() > 0;
}

/* —— 密钥生成与校验(算法与配套激活码后台保持完全一致) —— */
function generateKeyChecksum(dataPart){
  let sum = 0;
  for(let i=0;i<8;i++){
    const v = parseInt(dataPart[i],16);
    sum = (sum * 37 + v * (i+1)) % 65536;
  }
  return sum.toString(16).toUpperCase().padStart(4,'0');
}

/* v10.1 安全加固:
 *  - 移除 generateLicenseKey 函数(主程序不再具备生成能力,防止用户通过 DevTools 自助生成)
 *  - 校验算法加入盐值偏移,与配套激活码后台保持一致
 *  - 主程序仅保留 verifyLicenseKey,激活码必须由配套的「激活码管理后台」生成 */

function generateKeyChecksum(dataPart){
  /* 与配套激活码后台严格一致的校验算法 */
  let sum = 0;
  for(let i=0;i<8;i++){
    const v = parseInt(dataPart[i],16);
    sum = (sum * 37 + v * (i+1)) % 65536;
  }
  return sum.toString(16).toUpperCase().padStart(4,'0');
}

function verifyLicenseKey(key){
  if(!key || typeof key !== 'string') return null;
  const k = key.toUpperCase().trim();
  if(!/^MB-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}$/.test(k)) return null;
  /* v10.1 修复:先去掉 MB- 前缀,再去除连字符,否则 B 会被误判为 hex */
  const hex = k.slice(3).replace(/-/g,'');
  if(hex.length !== 12) return null;
  if(hex[0] !== 'A') return null;
  const typeChar = hex[1];
  if(typeChar !== '1' && typeChar !== '2' && typeChar !== '3') return null;
  const dataPart = hex.slice(0,8);
  const checksum = hex.slice(8,12);
  if(checksum !== generateKeyChecksum(dataPart)) return null;
  const info = {};
  if(typeChar==='1') info.type = 'personal';
  else if(typeChar==='2'){
    info.type = 'enterprise';
    info.expiryYear = 2024 + parseInt(hex[2],16);
    info.expiryMonth = Math.min(Math.max(parseInt(hex[3],16),1),12);
  } else {
    info.type = 'trial';
    info.trialDays = Math.min(Math.max(parseInt(hex[2]+hex[3],16),1),255);
  }
  return info;
}

function loadLicense(){
  try{
    const d = localStorage.getItem(LICENSE_STORAGE_KEY);
    if(d){
      const p = JSON.parse(d);
      if(p && p.tier){
        if(p.tier === 'enterprise' && p.expiryDate){
          const [ey,em] = String(p.expiryDate).split('-').map(Number);
          if(ey && em){
            const expEnd = new Date(ey, em, 0);
            if(new Date() > expEnd){
              /* v12.0:企业版到期回落,保留 freeTrialStartedAt */
              license = { tier:'free', key:'', activatedAt:null, expiryDate:null, freeTrialStartedAt: p.freeTrialStartedAt || null, boundFingerprint:null, deviceLabel:null };
              saveLicense(); return;
            }
          }
        }
        if(p.tier === 'trial' && p.trialExpiry){
          if(Date.now() > p.trialExpiry){
            /* v12.0:正式试用码到期回落,保留 freeTrialStartedAt */
            license = { tier:'free', key:'', activatedAt:null, expiryDate:null, freeTrialStartedAt: p.freeTrialStartedAt || null, boundFingerprint:null, deviceLabel:null };
            saveLicense(); return;
          }
        }
        license = p;
        /* v12.0:确保字段完整 */
        if(typeof license.freeTrialStartedAt === 'undefined') license.freeTrialStartedAt = null;
        /* v13.0:确保指纹字段完整 */
        if(typeof license.boundFingerprint === 'undefined') license.boundFingerprint = null;
        if(typeof license.deviceLabel === 'undefined') license.deviceLabel = null;
        return;
      }
    }
  }catch(e){}
  license = { tier:'free', key:'', activatedAt:null, expiryDate:null, freeTrialStartedAt:null, boundFingerprint:null, deviceLabel:null };
}

/* v13.0 启动后异步校验设备指纹是否一致;
 * — 个人版 / 企业版 已绑定指纹 → 必须一致才能继续使用
 * — 不一致 → 设置 _fingerprintMismatch = true,启动门禁会显示「指纹不匹配」专属界面
 * — 试用版/免费版/未绑定 → 跳过 */
async function verifyFingerprintOnStartup(){
  if(license.tier !== 'personal' && license.tier !== 'enterprise') return true;
  if(!license.boundFingerprint) return true; /* 老激活码未绑定指纹,放行 */
  const currentFp = await ensureFingerprint();
  if(currentFp !== license.boundFingerprint){
    _fingerprintMismatch = true;
    return false;
  }
  return true;
}

function activateLicense(){
  const input = $("#licenseKeyInput");
  const msgEl = $("#activateMsg");
  if(!input || !msgEl) return;
  const key = (input.value || '').trim().toUpperCase();
  if(!key){ msgEl.textContent = '请输入激活码'; return; }
  const info = verifyLicenseKey(key);
  if(!info){ msgEl.textContent = '激活码无效，请检查格式'; return; }
  if(info.type === 'enterprise'){
    const now = new Date();
    const expEnd = new Date(info.expiryYear, info.expiryMonth, 0);
    if(now > expEnd){
      msgEl.textContent = '该激活码已于 '+info.expiryYear+'年'+info.expiryMonth+'月 过期，请续费获取新激活码';
      return;

  closeModal();

/* v10.1:执行真正的激活,并存储联系方式到 license 对象,然后展示回执码
 * v13.0:个人版/企业版激活时, 强制写入当前设备的指纹和别名(用户填写)
 *       试用版不绑定指纹(降低试用门槛, 鼓励传播) */
async function doActivateWithContact(key, info, contact, deviceLabel){
  /* v13.0:确保指纹已计算 */
  const fp = await ensureFingerprint();
  if(info.type === 'personal'){
    license = { tier:'personal', key, activatedAt:Date.now(), expiryDate:null, contact,
                boundFingerprint: fp, deviceLabel: (deviceLabel||'').trim() || '未命名设备' };
  } else if(info.type === 'enterprise'){
    const expStr = info.expiryYear+'-'+String(info.expiryMonth).padStart(2,'0');
    license = { tier:'enterprise', key, activatedAt:Date.now(), expiryDate:expStr, contact,
                boundFingerprint: fp, deviceLabel: (deviceLabel||'').trim() || '未命名设备' };
  } else if(info.type === 'trial'){
    const trialMs = info.trialDays * 86400000;
    /* 试用版不绑定指纹 */
    license = { tier:'trial', key, activatedAt:Date.now(), expiryDate:null, trialExpiry:Date.now()+trialMs, contact,
                boundFingerprint: null, deviceLabel: null };
  }
  saveLicense();
  updateLicenseUI();

  /* v12.0:激活后重渲染,清除所有 trial-locked UI */
  if(typeof render === 'function') render();

  /* 生成激活回执码,用户复制给商务,商务在后台录入即可同步信息 */
  const receipt = generateActivationReceipt(key, license, contact);

  closeModal();
  setTimeout(()=>showActivationReceiptDialog(key, license, contact, receipt), 250);
}

/* v10.1:生成激活回执码
 * 格式:RCPT-{base64(JSON{k:激活码, t:激活时间戳, c:联系方式})}
 * v13.0:回执码加入 fp(设备指纹) + dl(设备别名), 用于后台对账「一码绑定 N 台机器」 */
function generateActivationReceipt(key, lic, contact){
  try{
    const payload = {
      k: key,
      t: lic.activatedAt,
      tier: lic.tier,
      exp: lic.expiryDate || null,
      tex: lic.trialExpiry || null,
      c: contact,
      /* v13.0 新增字段 */
      fp: lic.boundFingerprint || null,
      dl: lic.deviceLabel || null,
      v: 13  /* 回执码协议版本号 */
    };
    /* 用 base64 编码减少肉眼可读性,但允许后台解码 */
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    return 'RCPT-' + b64;
  }catch(e){
    return null;
  }
}

/* —— v12.0 试用版/免费版 水印(canvas 导出场景,如截图) —— */
function drawFreeWatermark(ctx, w, h){
  if(typeof license === 'undefined' || (license.tier !== 'free' && license.tier !== 'trial')) return;
  const wmText = (license.tier === 'trial') ? 'MallPlan 试用版' : 'MallPlan 免费版';
  ctx.save();
  ctx.font = '48px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(212,166,75,0.20)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.translate(w/2, h/2);
  ctx.rotate(-Math.PI/4);
  ctx.fillText(wmText, 0, 0);
  /* 多位置水印,提升防截图取证强度 */
  ctx.font = '24px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(212,166,75,0.13)';
  ctx.fillText(wmText, -w*0.35, -h*0.35);
  ctx.fillText(wmText, w*0.35, h*0.35);
  ctx.restore();
}

function checkFreeLimit(type){
  if(!isFreeVersion()) return true;
  if(type === 'shops' && state.shops.length >= FREE_LIMIT_SHOPS){
    showUpgradeRequiredModal('shops');
    return false;
  }
  if(type === 'deals' && state.deals.length >= FREE_LIMIT_DEALS){
    showUpgradeRequiredModal('deals');
    return false;
  }
  return true;
}

/* ============================================================
 * v13.0 设备指纹相关的弹窗 / 流程
 * ------------------------------------------------------------
 * — showFingerprintMismatchDialog: 启动时指纹不匹配的硬墙
 * — generateUnbindRequest:        生成解绑申请码
 * — showUnbindDialog:             用户申请解绑(更换电脑/重装系统)

/* v13.0 生成解绑申请码 — 用户把这串发给商务,商务核对后通过激活码后台
 * 撤销旧设备绑定,然后用户在新设备上重新激活即可。
 * 格式: UNBIND-{base64(JSON{k, oldFp, newFp, t, c, dl})} */
function generateUnbindRequest(reason){
  try{
    const payload = {
      k: license.key,
      tier: license.tier,
      oldFp: license.boundFingerprint || null,
      newFp: getFingerprintSync(),
      oldDl: license.deviceLabel || null,
      t: Date.now(),
      reason: (reason||'').slice(0,200),
      c: license.contact || null,
      v: 13
    };
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    return 'UNBIND-' + b64;
  }catch(e){ return null; }
}

/* v13.0 用户在 reason 输入框中边输边重新生成申请码 */
function updateUnbindRequestCode(){
  const r = ($('#unbind_reason')?.value || '').trim();
  const ta = $('#unbindCode');
  if(!ta) return;
  const req = generateUnbindRequest(r);
  if(req) ta.value = req;
}

      <div style="text-align:center;padding:14px 0">
        <div style="width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:rgba(156,139,217,.18);border:2px solid var(--violet);display:grid;place-items:center;font-size:28px">📅</div>
        <div style="font-size:18px;font-weight:700;color:var(--ink-1)">您的试用版剩余 <span style="color:var(--violet);font-family:var(--font-serif);font-size:24px">${remain}</span> 天</div>
        <div style="font-size:12px;color:var(--ink-3);margin-top:6px">激活码:<span style="font-family:var(--font-mono)">${license.key||'—'}</span></div>
      </div>
      <div style="background:rgba(212,166,75,.08);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:11px 14px;font-size:12.5px;color:var(--ink-2);line-height:1.7;margin-top:8px">
        💡 试用期内全功能体验,导出文件含「试用版」水印。<br>
        如需正式版,可在「许可证管理」中输入个人/企业版激活码。
      </div>
    `,
    foot: [
      {label:'查看价格方案', kind:'ghost', onClick:()=>{ setTimeout(showLicenseDialog,200); }, close:true},
      {label:'开始使用', kind:'primary', onClick:()=>{}, close:true}
    ]
  });
}

/* v13.0 设备指纹不匹配 — 硬墙弹窗
 * 触发条件:已激活个人/企业版,但当前设备指纹 ≠ 激活时绑定的指纹
 * (用户共享激活码、换电脑、清浏览器缓存、显卡驱动更新等都会触发)
 * 处理方式:
 *   - 个人版:必须联系商务重置 (商务在后台清除原绑定后,本机重新激活)
 *   - 企业版:可使用同一激活码"再次激活"完成新设备登记 (生成新的回执码)
 *   - 也提供「使用其他激活码」入口,让用户输入买给本机的新激活码 */
function showFingerprintMismatchDialog(){
  const isEnterprise = license.tier === 'enterprise';
  const tierLabel = isEnterprise ? '企业专业版' : '个人专业版';
  const oldFp = license.boundFingerprint || '—';
  const newFp = getFingerprintSync();
  const oldDl = license.deviceLabel || '默认设备';
  const oldDate = license.activatedAt ? new Date(license.activatedAt).toLocaleDateString('zh-CN') : '—';

  modal({
    title: '🔒 设备验证未通过',
    body: `
      <div style="text-align:center;padding:14px 0 6px">
        <div style="width:72px;height:72px;margin:0 auto 14px;border-radius:50%;background:rgba(232,87,107,.16);border:2px solid var(--rose);display:grid;place-items:center;font-size:32px">🚫</div>
        <div style="font-size:18px;font-weight:700;color:var(--ink-1)">本机非该激活码绑定的设备</div>
        <div style="font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.7;max-width:430px;margin-left:auto;margin-right:auto">
          ${tierLabel}激活码 <code style="color:var(--amber);font-family:var(--font-mono);font-size:11px">${license.key||'—'}</code><br>
          已于 ${oldDate} 在另一台设备上激活并绑定。<br>
          ${isEnterprise ? '企业版支持多台设备授权,可在本机重新激活完成新设备登记。' : '个人版为单设备授权,如需在本机使用,请联系商务重置绑定。'}
        </div>
      </div>

      <div style="background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:11px 14px;margin:14px 0;font-size:11.5px;color:var(--ink-2);line-height:1.85">
        <div style="color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-weight:600">指纹对比</div>
        <div><span style="color:var(--ink-3)">原绑定设备：</span><strong style="color:var(--ink-1)">${escapeHtml(oldDl)}</strong> · <code style="color:var(--azure);font-family:var(--font-mono);font-size:10.5px">${oldFp}</code></div>
        <div><span style="color:var(--ink-3)">当前设备：</span><strong style="color:var(--rose)">本机(未授权)</strong> · <code style="color:var(--rose);font-family:var(--font-mono);font-size:10.5px">${newFp}</code></div>
      </div>

      <div style="background:rgba(212,166,75,.08);border:1px dashed var(--amber);border-radius:9px;padding:12px 14px">
        <div style="font-size:12px;color:var(--amber);font-weight:600;margin-bottom:6px">📞 解决办法</div>
        <div style="font-size:11.5px;color:var(--ink-2);line-height:1.75">
          ${isEnterprise
            ? '<strong>方案1</strong>(推荐):在本机用同一激活码重新激活,系统会生成本机的新回执码,发给商务在后台登记即可完成多设备授权。<br><strong>方案2</strong>:联系商务重置原绑定。'
            : ('<strong>方案1</strong>:联系商务,告知您的激活码<code style="font-family:var(--font-mono);font-size:11px;color:var(--amber)">' + (license.key||'—') + '</code>,商务后台清除原绑定后,本机重新激活即可。<br><strong>方案2</strong>:升级到企业版(¥1,999/年),支持多设备授权。')
          }
        </div>
        <div style="margin-top:10px;padding-top:8px;border-top:1px solid rgba(212,166,75,.2);font-size:11px;color:var(--ink-3);font-family:var(--font-mono);line-height:1.85">
          微信:<strong style="color:var(--ink-1)">${BUSINESS_CONTACT.wechat}</strong>　电话:<strong style="color:var(--ink-1)">${BUSINESS_CONTACT.phone}</strong>
        </div>
      </div>

      <div style="background:rgba(91,154,255,.06);border:1px solid var(--azure);border-radius:9px;padding:11px 14px;margin-top:12px">
        <div style="font-size:12px;color:var(--azure);font-weight:600;margin-bottom:6px">🔑 已有本机的激活码?</div>
        <div style="display:flex;gap:8px">
          <input id="fpMismatchKeyInput" class="license-input" type="text" placeholder="MB-XXXX-XXXX-XXXX" maxlength="17" oninput="this.value=this.value.toUpperCase()" style="flex:1">
          <button class="btn primary" onclick="fpMismatchActivate()" id="fpMismatchBtn">激活</button>
        </div>
        <div id="fpMismatchMsg" style="margin-top:8px;font-size:11.5px;min-height:16px;color:var(--rose)"></div>
        ${isEnterprise ? '<div style="margin-top:6px;font-size:10.5px;color:var(--ink-4)">企业版用户可输入同一激活码完成本机登记,或输入新激活码切换。</div>' : ''}
      </div>
    `,
    foot: [
      {label:'查看价格方案', kind:'ghost', onClick:()=>{ setTimeout(showLicenseDialog,200); }, close:true},
      {label:'放弃使用本机', kind:'primary', onClick:()=>{
        /* 用户主动放弃,清除本机许可证回到 free 状态(保留 freeTrialStartedAt 防止重领试用) */
        const oldFreeTrialStartedAt = license.freeTrialStartedAt || null;
        license = { tier:'free', key:'', activatedAt:null, expiryDate:null, freeTrialStartedAt: oldFreeTrialStartedAt, boundFingerprint:null, deviceLabel:null };
        _fingerprintMismatch = false;
        saveLicense();
        updateLicenseUI();
        toast('已重置本机许可证,可重新激活或开启免费试用', 'ok');
        setTimeout(()=>{ closeModal(true); setTimeout(showStartupGateDialog, 250); }, 200);
      }, close:false}
    ],
    closable:false
  });

  /* 输入框聚焦 */
  setTimeout(()=>{ const i=$('#fpMismatchKeyInput'); if(i) i.focus(); }, 250);
}

/* v13.0 指纹不匹配硬墙下的"再激活"逻辑:
 * — 企业版:同一激活码也可再激活(本机登记为新设备)
 * — 个人版:同一激活码必须商务后台重置原绑定后才能用,所以这里只接受新激活码
 *   (实际产品上线时,商务重置后会让用户重新激活,这里给个明确提示) */
async function fpMismatchActivate(){
  const input = $('#fpMismatchKeyInput');
  const msgEl = $('#fpMismatchMsg');
  if(!input || !msgEl) return;
  const key = (input.value || '').trim().toUpperCase();
  if(!key){ msgEl.textContent = '请输入激活码'; return; }
  const info = verifyLicenseKey(key);
  if(!info){ msgEl.textContent = '激活码无效,请检查格式 (MB-XXXX-XXXX-XXXX)'; return; }
  if(info.type === 'enterprise'){
    const now = new Date();
    const expEnd = new Date(info.expiryYear, info.expiryMonth, 0);
    if(now > expEnd){
      msgEl.textContent = '该激活码已于 '+info.expiryYear+'年'+info.expiryMonth+'月 过期,请联系商务续费';
      return;
    }
  }
  /* 个人版:若输入的还是原激活码,必须商务重置后才能本机激活 */
  if(info.type === 'personal' && key === license.key){
    msgEl.innerHTML = '⚠ 该激活码已绑定其他设备。请先联系商务重置原绑定,商务确认后再次输入即可激活。<br><span style="color:var(--ink-4);font-size:10.5px">(企业版可直接再激活完成多设备登记)</span>';
    return;
  }
  /* 通过,清除指纹不匹配标志,清除原 license,进入正常激活流程 */
  _fingerprintMismatch = false;
  license = { tier:'free', key:'', activatedAt:null, expiryDate:null, freeTrialStartedAt:license.freeTrialStartedAt||null, boundFingerprint:null, deviceLabel:null };
  saveLicense();
  closeModal(true);
  setTimeout(()=>{
    if(typeof showContactCaptureDialog === 'function'){
      showContactCaptureDialog(key, info);
    }
  }, 200);
}

/* v12.0 启动门禁的激活函数(独立于 activateLicense,避免 DOM 引用错乱) */
function gateActivateLicense(){
  const input = $("#gateLicenseKeyInput");
  const msgEl = $("#gateActivateMsg");
  if(!input || !msgEl) return;
  const key = (input.value || '').trim().toUpperCase();
  if(!key){ msgEl.textContent = '请输入激活码'; return; }
  const info = verifyLicenseKey(key);
  if(!info){ msgEl.textContent = '激活码无效,请检查格式 (MB-XXXX-XXXX-XXXX)'; return; }
  if(info.type === 'enterprise'){
    const now = new Date();
    const expEnd = new Date(info.expiryYear, info.expiryMonth, 0);
    if(now > expEnd){
      msgEl.textContent = '该激活码已于 '+info.expiryYear+'年'+info.expiryMonth+'月 过期,请联系商务续费';
      return;
    }
  }
  /* v12.0:门禁内激活,直接收联系方式后激活 */
  closeModal(true);
  setTimeout(()=>{
    if(typeof showContactCaptureDialog === 'function'){
      showContactCaptureDialog(key, info);
    } else {
      /* 兜底:无 contact 流程时直接激活 */
      const newLic = { tier: info.type, key, activatedAt: Date.now() };
      if(info.type === 'enterprise'){
        newLic.expiryDate = info.expiryYear + '-' + String(info.expiryMonth).padStart(2,'0');
      } else if(info.type === 'trial'){
        newLic.trialExpiry = Date.now() + info.trialDays*86400000;
      }
      license = newLic; saveLicense(); updateLicenseUI();
      toast('✅ 激活成功!','ok');
      render();
    }
  }, 200);
}



/* —— 绑定许可证按钮 —— */
$("#licenseBtn").onclick = showLicenseDialog;

/* —— 初始化许可证 —— */
loadLicense();
updateLicenseUI();

/* v13.0 启动流程:
 *   1. 异步算指纹 (~50-200ms)
 *   2. 已激活个人/企业版 → 校验指纹
 *      - 一致 → 静默放行
 *      - 不一致 → 锁定弹「设备已变更」对话框,引导申请解绑
 *   3. 试用版/免费版 → 走原有的 showStartupGateDialog 流程
 */
let _v13StartupDone = false;
async function v13StartupSequence(){
  if(_v13StartupDone) return;  /* 防 DOMContentLoaded + 兜底 双触发 */
  _v13StartupDone = true;
  await ensureFingerprint();
  /* 已激活的正式版,先校验指纹 */
  if(license.tier === 'personal' || license.tier === 'enterprise'){
    const ok = await verifyFingerprintOnStartup();
    if(!ok){
      /* 指纹不匹配 → 锁定弹「设备已变更」对话框 */
      showFingerprintMismatchDialog();
      return;
    }
    /* 指纹一致 → 不弹任何门禁,正常使用 */
    return;
  }
  /* 试用版/免费版 → 走原启动门禁 */
  showStartupGateDialog();
}

/* 启动 */
document.addEventListener("DOMContentLoaded", ()=>{
  // DOM 加载完成后渲染(防止 nav 按钮还没绑定)
  render();
  /* v13.0:启动门禁弹窗(每次软件打开都弹) */
  setTimeout(v13StartupSequence, 300);
});
// 立即渲染一次(应对内联 script 在 body 末尾的情况)
render();
/* v13.0:DOMContentLoaded 已触发场景兜底 */
if(document.readyState === 'complete' || document.readyState === 'interactive'){
  setTimeout(v13StartupSequence, 300);
}
</script>
