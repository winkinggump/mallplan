<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MallPlan 投拓测算 v1.0</title>
<style>
:root{--c-ink:#1a1f2e;--c-ink-soft:#3d4658;--c-ink-muted:#6e7689;--c-line:#e4e1d8;--c-line-soft:#efece4;--c-paper:#faf8f3;--c-surface:#fff;--c-surface-2:#f5f2ea;--c-navy:#1e3a5f;--c-navy-soft:#2d4f7f;--c-gold:#b88a4a;--c-gold-soft:#d4a866;--c-positive:#2d6a4f;--c-warning:#c08a2e;--c-danger:#a83246;--c-info:#2d5f8f;--c-violet:#5a3d7a;--c-violet-soft:#7a5d9a;--f-display:'Noto Serif SC','Songti SC','STSong',serif;--f-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;--f-mono:'JetBrains Mono','SF Mono',Consolas,monospace;--s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-7:32px;--s-8:40px;--r-sm:3px;--r-md:6px;--r-lg:10px;--sh-1:0 1px 2px rgba(26,31,46,.04),0 1px 1px rgba(26,31,46,.03);--sh-2:0 2px 8px rgba(26,31,46,.06),0 1px 2px rgba(26,31,46,.04);--sh-3:0 8px 24px rgba(26,31,46,.08),0 2px 6px rgba(26,31,46,.04)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--f-body);color:var(--c-ink);background:var(--c-paper);line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
table{border-collapse:collapse;width:100%}
.topbar{position:sticky;top:0;z-index:50;background:var(--c-surface);border-bottom:1px solid var(--c-line);height:64px;display:flex;align-items:center;padding:0 var(--s-7);gap:var(--s-4)}
.brand{display:flex;align-items:center;gap:var(--s-3)}
.brand-mark{width:36px;height:36px;background:var(--c-navy);color:var(--c-gold-soft);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;border-radius:var(--r-sm);position:relative}
.brand-mark::after{content:'';position:absolute;inset:3px;border:1px solid var(--c-gold);border-radius:2px}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text .name{font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--c-ink);letter-spacing:.02em}
.brand-text .sub{font-size:10px;color:var(--c-ink-muted);letter-spacing:.15em;text-transform:uppercase;margin-top:2px}
.type-switcher{display:flex;background:var(--c-surface-2);border-radius:var(--r-md);padding:3px}
.type-switcher button{padding:6px 16px;font-size:13px;color:var(--c-ink-soft);border-radius:4px;transition:all .2s;font-weight:500}
.type-switcher button:hover{color:var(--c-ink)}
.type-switcher button.active{background:var(--c-navy);color:#fff;box-shadow:var(--sh-1)}
.topbar-spacer{flex:1}
.project-tag{display:flex;align-items:center;gap:var(--s-2);padding:4px 10px;background:var(--c-surface-2);border-radius:var(--r-sm);font-size:11px;color:var(--c-ink-soft)}
.top-actions{display:flex;gap:var(--s-2);align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:12px;font-weight:500;border-radius:var(--r-md);border:1px solid transparent;transition:all .15s;white-space:nowrap}
.btn-ghost{color:var(--c-ink-soft);border-color:var(--c-line);background:var(--c-surface)}
.btn-ghost:hover{color:var(--c-ink);border-color:var(--c-ink-muted);background:var(--c-surface-2)}
.btn-primary{background:var(--c-navy);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.dropdown{position:relative}
.dropdown-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:200px;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-md);box-shadow:var(--sh-3);padding:6px;display:none;z-index:100}
.dropdown.open .dropdown-menu{display:block}
.dropdown-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;font-size:13px;color:var(--c-ink);border-radius:var(--r-sm);text-align:left}
.dropdown-menu button:hover{background:var(--c-surface-2)}
.dropdown-divider{height:1px;background:var(--c-line-soft);margin:4px 0}
.app-shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}
.sidebar{background:var(--c-surface);border-right:1px solid var(--c-line);padding:var(--s-5) 0;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}
.nav-section{padding:0 var(--s-4);margin-bottom:var(--s-5)}
.nav-section-title{font-size:10px;color:var(--c-ink-muted);letter-spacing:.18em;text-transform:uppercase;font-weight:600;margin-bottom:var(--s-3);padding:0 var(--s-3);display:flex;align-items:center;gap:var(--s-2)}
.nav-section-title::before{content:'';width:12px;height:1px;background:var(--c-gold)}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:2px;font-size:13px;color:var(--c-ink-soft);border-radius:var(--r-sm);cursor:pointer;transition:all .15s;border-left:2px solid transparent}
.nav-item:hover{background:var(--c-surface-2);color:var(--c-ink)}
.nav-item.active{background:var(--c-surface-2);color:var(--c-navy);border-left-color:var(--c-gold);font-weight:500}
.nav-item .nav-num{font-family:var(--f-display);font-size:11px;color:var(--c-ink-muted);width:18px;font-weight:600}
.main{padding:var(--s-6) var(--s-7);max-width:1400px}
.page-head{margin-bottom:var(--s-6);padding-bottom:var(--s-4);border-bottom:1px solid var(--c-line)}
.breadcrumb{font-size:11px;color:var(--c-ink-muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:var(--s-3);font-weight:500}
.page-title{font-family:var(--f-display);font-size:26px;font-weight:600;color:var(--c-ink);letter-spacing:-.01em;margin-bottom:var(--s-2)}
.page-desc{color:var(--c-ink-muted);font-size:13px;max-width:720px}
.card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-md);padding:var(--s-5);margin-bottom:var(--s-5);box-shadow:var(--sh-1)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s-4);padding-bottom:var(--s-3);border-bottom:1px solid var(--c-line-soft)}
.card-title{font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--c-ink);display:flex;align-items:center;gap:10px}
.card-title::before{content:'';width:3px;height:14px;background:var(--c-gold)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s-3) var(--s-4)}
.form-row{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:12px;color:var(--c-ink-soft);font-weight:500;display:flex;align-items:center;gap:4px}
.form-label .hint{color:var(--c-ink-muted);font-weight:400;font-size:11px}
.form-label .req{color:var(--c-danger);font-size:11px}
.form-input,.form-select{width:100%;padding:7px 10px;font-size:13px;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-sm);color:var(--c-ink);transition:border-color .15s;font-variant-numeric:tabular-nums}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--c-navy);box-shadow:0 0 0 3px rgba(30,58,95,.08)}
.form-input.numeric{font-family:var(--f-mono);text-align:right}
.form-suffix{position:relative}
.form-suffix input{padding-right:36px}
.form-suffix .suffix{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--c-ink-muted)}
.form-input[readonly],.form-input.derived{background:var(--c-surface-2);color:var(--c-ink-soft);cursor:not-allowed}
.data-table{width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.data-table thead th{text-align:left;font-weight:600;font-size:11.5px;color:var(--c-ink-soft);letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;background:var(--c-surface-2);border-bottom:1px solid var(--c-line);white-space:nowrap}
.data-table thead th.num{text-align:right}
.data-table tbody td{padding:8px 12px;border-bottom:1px solid var(--c-line-soft);color:var(--c-ink)}
.data-table tbody td.num{text-align:right;font-family:var(--f-mono);font-size:12.5px}
.data-table tbody tr:hover{background:var(--c-surface-2)}
.data-table tbody td input,.data-table tbody td select{width:100%;border:none;background:transparent;text-align:right;font-family:var(--f-mono);font-size:12.5px;padding:2px 4px;border-radius:2px}
.data-table tbody td input:focus{outline:none;background:rgba(184,138,74,.08);box-shadow:inset 0 0 0 1px var(--c-gold)}
.data-table tbody tr.total td{border-bottom:2px solid var(--c-ink);font-weight:700;background:var(--c-surface-2)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--s-3);margin-bottom:var(--s-4)}
.kpi{background:var(--c-surface);border:1px solid var(--c-line);border-left:3px solid var(--c-gold);padding:var(--s-3) var(--s-4);border-radius:var(--r-sm)}
.kpi-label{font-size:11px;color:var(--c-ink-muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;font-weight:500}
.kpi-value{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--c-ink);font-variant-numeric:tabular-nums;line-height:1.1;display:flex;align-items:baseline;gap:4px}
.kpi-value .unit{font-family:var(--f-body);font-size:12px;color:var(--c-ink-muted);font-weight:400}
.kpi-trend{font-size:11px;color:var(--c-ink-muted);margin-top:4px}
.kpi.positive .kpi-value{color:var(--c-positive)}
.kpi.negative .kpi-value{color:var(--c-danger)}
.kpi.highlight{border-left-color:var(--c-navy);background:linear-gradient(180deg,var(--c-surface),var(--c-surface-2))}
.tabs{display:flex;border-bottom:1px solid var(--c-line);margin-bottom:var(--s-4);flex-wrap:wrap}
.tab{padding:9px 16px;font-size:13px;font-weight:500;color:var(--c-ink-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab.active{color:var(--c-navy);border-bottom-color:var(--c-gold)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:11px;font-weight:500;border-radius:10px;background:var(--c-surface-2);color:var(--c-ink-soft)}
.badge.positive{background:rgba(45,106,79,.1);color:var(--c-positive)}
.badge.warning{background:rgba(192,138,46,.1);color:var(--c-warning)}
.badge.danger{background:rgba(168,50,70,.1);color:var(--c-danger)}
.badge.info{background:rgba(45,95,143,.1);color:var(--c-info)}
.notice{display:flex;gap:var(--s-3);padding:var(--s-3) var(--s-4);background:rgba(184,138,74,.06);border-left:3px solid var(--c-gold);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:12.5px;color:var(--c-ink-soft);margin-bottom:var(--s-4)}
.table-wrap{overflow-x:auto;margin:0 calc(-1 * var(--s-2));padding:0 var(--s-2)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4)}
@media(max-width:1100px){.two-col{grid-template-columns:1fr}}
.mode-intro{background:var(--c-surface);border:1px solid var(--c-line);border-left:4px solid var(--c-gold);border-radius:var(--r-md);padding:var(--s-5) var(--s-6);margin-bottom:var(--s-5);box-shadow:var(--sh-1)}
.mode-intro-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.mode-intro-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.mode-intro-icon.lease{background:rgba(184,138,74,.12);color:var(--c-gold)}
.mode-intro-icon.dev{background:rgba(45,95,143,.12);color:var(--c-navy)}
.mode-intro-icon.ent{background:rgba(90,61,122,.12);color:var(--c-violet)}
.mode-intro h3{font-size:17px;font-weight:600;color:var(--c-ink)}
.mode-intro .sub{font-size:12px;color:var(--c-ink-muted)}
.dashboard-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-3);margin-bottom:var(--s-4)}
.dash-card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-md);padding:var(--s-4);box-shadow:var(--sh-1);border-top:3px solid var(--c-navy)}
.dash-card.green{border-top-color:var(--c-positive)}
.dash-card.amber{border-top-color:var(--c-warning)}
.dash-card.red{border-top-color:var(--c-danger)}
.dash-card.purple{border-top-color:var(--c-violet)}
.dash-card.gold{border-top-color:var(--c-gold)}
.dash-label{font-size:11px;color:var(--c-ink-muted);letter-spacing:.04em;font-weight:500;margin-bottom:4px}
.dash-value{font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--c-ink);line-height:1.1}
.dash-value .unit{font-family:var(--f-body);font-size:13px;color:var(--c-ink-muted);font-weight:400;margin-left:2px}
.dash-sub{font-size:11px;color:var(--c-ink-muted);margin-top:4px}
.decision-banner{padding:var(--s-4) var(--s-5);border-radius:var(--r-md);font-size:15px;font-weight:700;text-align:center;margin-bottom:var(--s-4);letter-spacing:.5px}
.decision-banner.go{background:rgba(45,106,79,.1);color:var(--c-positive);border:1px solid var(--c-positive)}
.decision-banner.warn{background:rgba(192,138,46,.1);color:var(--c-warning);border:1px solid var(--c-warning)}
.decision-banner.no{background:rgba(168,50,70,.1);color:var(--c-danger);border:1px solid var(--c-danger)}
.mode-select-card{border:2px solid var(--c-line);border-radius:var(--r-md);cursor:pointer;transition:all .15s;padding:16px;background:var(--c-surface)}
.mode-select-card:hover{border-color:var(--c-gold-soft);box-shadow:var(--sh-2)}
.mode-select-card.active{border-color:var(--c-navy);background:rgba(30,58,95,.04)}
.mode-flow-step{padding:5px 12px;background:var(--c-surface-2);border:1px solid var(--c-line);border-radius:14px;font-size:11px;font-weight:600;white-space:nowrap}
.mode-flow-arrow{color:var(--c-ink-muted);font-size:12px;font-weight:700}
.collapse-head{display:flex;align-items:center;justify-content:space-between;padding:var(--s-3) 0;cursor:pointer;-webkit-user-select:none;user-select:none}
.collapse-body{display:none;padding:var(--s-2) 0}
.collapse.open .collapse-body{display:block}
.modal-mask{position:fixed;inset:0;background:rgba(26,31,46,.4);backdrop-filter:blur(2px);z-index:200;display:none;align-items:center;justify-content:center;padding:var(--s-5)}
.modal-mask.open{display:flex}
.modal{background:var(--c-surface);border-radius:var(--r-lg);max-width:540px;width:100%;box-shadow:var(--sh-3);overflow:hidden}
.modal-head{padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--c-line-soft);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:var(--f-display);font-size:16px;font-weight:600}
.modal-body{padding:var(--s-4) var(--s-5);font-size:13px;color:var(--c-ink-soft);line-height:1.6}
.modal-foot{padding:var(--s-3) var(--s-5);border-top:1px solid var(--c-line-soft);display:flex;justify-content:flex-end;gap:var(--s-2);background:var(--c-surface-2)}
.toast-stack{position:fixed;top:80px;right:24px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.toast-msg{background:var(--c-surface);border:1px solid var(--c-line);border-left:3px solid var(--c-positive);padding:10px 14px;border-radius:var(--r-sm);box-shadow:var(--sh-3);font-size:13px;min-width:220px;animation:slideIn .3s ease}
.toast-msg.warning{border-left-color:var(--c-warning)}.toast-msg.danger{border-left-color:var(--c-danger)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.footer{padding:var(--s-6) var(--s-7);border-top:1px solid var(--c-line);font-size:11.5px;color:var(--c-ink-muted);display:flex;align-items:center;justify-content:space-between}
.footer .rule{display:inline-block;width:24px;height:1px;background:var(--c-gold);margin:0 8px;vertical-align:middle}
.icon-btn{width:26px;height:26px;display:inline-grid;place-items:center;border-radius:var(--r-sm);color:var(--c-ink-muted)}
.icon-btn:hover{background:var(--c-surface-2);color:var(--c-ink)}.icon-btn.danger:hover{background:rgba(168,50,70,.1);color:var(--c-danger)}
@media print{.topbar,.sidebar,.footer,.top-actions,.card-actions{display:none!important}.app-shell{grid-template-columns:1fr}.main{padding:20px}}
::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-track{background:transparent}.sidebar::-webkit-scrollbar-thumb{background:var(--c-line);border-radius:3px}
</style>

/* ============================================================
   M5 · MallPlan 模块切换器
   ============================================================ */
.mallplan-switcher{
  position:fixed; top:8px; right:12px; z-index:9000;
  background:linear-gradient(135deg, #fff 0%, #fdfaf2 100%);
  border:1px solid #e8dcc4; border-radius:24px;
  padding:5px 6px 5px 14px;
  display:flex; align-items:center; gap:4px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  font-size:12.5px; font-family:"Microsoft YaHei","PingFang SC",sans-serif;

  margin-right:6px; padding-right:8px;
  border-right:1px solid #e8dcc4;
}
.mallplan-switcher .mp-mod{
  display:inline-flex; align-items:center; gap:4px;
  padding:5px 12px; border-radius:14px;

}
.mallplan-switcher .mp-mod:hover{
  background:#f5f2ea; color:#1a1a1a;

   ============================================================ */

.input-wrap > .input.with-suffix + .suffix,
.input-wrap .input-suffix{

  border-top-right-radius:4px; border-bottom-right-radius:4px;
  white-space:nowrap;

<script>
/* MallPlan Store 接口 v1.0 · 后端迁移预留 */
window.MALLPLAN_MODULE = 'investment';
/* ============================================================
 * MallPlan Store · 统一存储接口 v1.0
 * ============================================================
 * 设计目的:
 *   1. 为三个模块 (投拓测算/定位落位/招商算账) 提供一致的数据存储接口
 *   2. 抽象 driver (local/remote),后端就绪后可一行切换
 *   3. 每次写入自动附 _meta (updatedAt/updatedBy/version),为审计预留
 *   4. 关键操作日志暂存本地,后端就绪后批量上送
 *
 * 使用:
 *   await MallPlanStore.set('project_xxx', projectData);
 *   const project = await MallPlanStore.get('project_xxx');
 *   await MallPlanStore.log({action:'modify_reserved_price', shopId:'L2-15'});
 *
 * 切换为后端:
 *   MallPlanStore.config.driver = 'remote';
 *   MallPlanStore.config.apiBase = 'https://api.mallplan.com/v1';
 *   MallPlanStore.config.token = '...';
 * ============================================================ */
const MallPlanStore = {
  config: {
    driver:   'local',                /* local | remote */
    apiBase:  '',                     /* 后端 API 根地址,如 https://api.mallplan.com/v1 */
    token:    '',                     /* 后端 Bearer Token */
    keyPrefix:'mallplan_',            /* localStorage key 前缀,避免与其他应用冲突 */
    schemaVersion: '1.0',             /* 当前数据结构版本 */
    currentUser: '',                  /* 当前用户标识 (本地版可为空字符串,后端版必填) */
    logBufferKey:'mallplan_audit_log',/* 审计日志缓冲区 key */
    enableLog:true,                   /* 是否开启审计日志 */
  },

  /* —— 读 —— */
  async get(key){
    if(this.config.driver === 'remote'){
      try{
        const r = await fetch(`${this.config.apiBase}/kv/${encodeURIComponent(key)}`,{
          headers:{ 'Authorization':`Bearer ${this.config.token}` }
        });
        if(!r.ok) return null;
        const j = await r.json();
        return j.value || null;
      }catch(e){ console.warn('[MallPlanStore.get]',e); return null; }
    }
    /* local driver */
    try{
      const raw = localStorage.getItem(this.config.keyPrefix + key);
      if(!raw) return null;
      const wrapped = JSON.parse(raw);
      /* 兼容:旧版没有 _meta 包裹的直接返回 */
      return wrapped && wrapped._meta ? wrapped.data : wrapped;
    }catch(e){ console.warn('[MallPlanStore.get]',e); return null; }
  },

  /* —— 写 —— */
  async set(key, data){
    const wrapped = {
      _meta:{
        updatedAt:    new Date().toISOString(),
        updatedBy:    this.config.currentUser || '本地用户',
        schemaVersion:this.config.schemaVersion,
        driver:       this.config.driver,
      },
      data: data
    };
    if(this.config.driver === 'remote'){
      try{
        const r = await fetch(`${this.config.apiBase}/kv/${encodeURIComponent(key)}`,{
          method:'PUT',
          headers:{
            'Content-Type':'application/json',
            'Authorization':`Bearer ${this.config.token}`
          },
          body: JSON.stringify(wrapped)
        });
        return r.ok;
      }catch(e){ console.warn('[MallPlanStore.set]',e); return false; }
    }
    /* local driver */
    try{
      localStorage.setItem(this.config.keyPrefix + key, JSON.stringify(wrapped));
      return true;
    }catch(e){ console.warn('[MallPlanStore.set]',e); return false; }
  },

  /* —— 删 —— */
  async remove(key){
    if(this.config.driver === 'remote'){
      try{
        const r = await fetch(`${this.config.apiBase}/kv/${encodeURIComponent(key)}`,{
          method:'DELETE',
          headers:{ 'Authorization':`Bearer ${this.config.token}` }
        });
        return r.ok;
      }catch(e){ console.warn('[MallPlanStore.remove]',e); return false; }
    }
    try{ localStorage.removeItem(this.config.keyPrefix + key); return true; }
    catch(e){ return false; }
  },

  /* —— 列出键 (前缀过滤) —— */
  async list(prefix){
    if(this.config.driver === 'remote'){
      try{
        const r = await fetch(`${this.config.apiBase}/kv?prefix=${encodeURIComponent(prefix||'')}`,{
          headers:{ 'Authorization':`Bearer ${this.config.token}` }
        });
        if(!r.ok) return [];
        const j = await r.json();
        return j.keys || [];
      }catch(e){ console.warn('[MallPlanStore.list]',e); return []; }
    }
    const full = this.config.keyPrefix + (prefix||'');
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(full)) keys.push(k.substring(this.config.keyPrefix.length));
    }
    return keys;
  },

  /* —— 审计日志 (关键操作留痕) ——
   * 用法: MallPlanStore.log({ action:'modify_rent', shopId:'L2-15', oldValue:20, newValue:22 })
   * 本地版:写入 localStorage 缓冲区,可由用户/管理员手动导出查看
   * 后端版:批量同步到服务器,不可删除 */
  async log(entry){
    if(!this.config.enableLog) return;
    const fullEntry = {
      ts:          new Date().toISOString(),
      user:        this.config.currentUser || '本地用户',
      module:      window.MALLPLAN_MODULE || 'unknown',  /* 各模块在初始化时设置 */
      ...entry
    };
    if(this.config.driver === 'remote'){
      /* 后端版:批量缓冲,每10条或30秒批量上送 */
      try{
        const buf = JSON.parse(localStorage.getItem(this.config.logBufferKey) || '[]');
        buf.push(fullEntry);
        localStorage.setItem(this.config.logBufferKey, JSON.stringify(buf));
        if(buf.length >= 10) this._flushLogs();
      }catch(e){ console.warn('[MallPlanStore.log]',e); }
      return;
    }
    /* 本地版:直接累积存储 */
    try{
      const buf = JSON.parse(localStorage.getItem(this.config.logBufferKey) || '[]');
      buf.push(fullEntry);
      /* 本地版保留最近 1000 条,避免无限增长 */
      if(buf.length > 1000) buf.splice(0, buf.length-1000);
      localStorage.setItem(this.config.logBufferKey, JSON.stringify(buf));
    }catch(e){ console.warn('[MallPlanStore.log]',e); }
  },
  async _flushLogs(){
    if(this.config.driver !== 'remote') return;
    try{
      const buf = JSON.parse(localStorage.getItem(this.config.logBufferKey) || '[]');
      if(buf.length === 0) return;
      const r = await fetch(`${this.config.apiBase}/audit-logs`,{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':`Bearer ${this.config.token}`
        },
        body: JSON.stringify({ logs: buf })
      });
      if(r.ok) localStorage.setItem(this.config.logBufferKey, '[]');
    }catch(e){ console.warn('[MallPlanStore._flushLogs]',e); }
  },
  /* 导出本地审计日志 (本地版导出 JSON,便于人工审阅) */
  exportLogs(){
    try{
      return JSON.parse(localStorage.getItem(this.config.logBufferKey) || '[]');
    }catch(e){ return []; }
  },
  clearLogs(){
    if(!confirm('确认清空本地审计日志?清空后不可恢复。')) return;
    localStorage.setItem(this.config.logBufferKey, '[]');
  },
};

/* —— 兼容旧版 localStorage key 的迁移辅助 ——
 * 各模块在 init 时调用 MallPlanStore.migrateLegacy(oldKey, newKey)
 * 把旧 key 数据迁移到新 key 下,并保留 backup */
MallPlanStore.migrateLegacy = function(oldKey, newKey){
  try{
    const oldData = localStorage.getItem(oldKey);
    const newKeyFull = this.config.keyPrefix + newKey;
    if(oldData && !localStorage.getItem(newKeyFull)){
      /* 备份旧数据 */
      localStorage.setItem(oldKey + '_backup_' + Date.now(), oldData);
      /* 包装写入新 key */
      const wrapped = {
        _meta:{
          updatedAt:     new Date().toISOString(),
          updatedBy:     '迁移工具',
          schemaVersion: this.config.schemaVersion,
          migratedFrom:  oldKey,
        },
        data: JSON.parse(oldData)
      };
      localStorage.setItem(newKeyFull, JSON.stringify(wrapped));
      console.info(`[MallPlanStore] 已迁移 ${oldKey} → ${newKeyFull}`);
      return true;
    }
  }catch(e){ console.warn('[MallPlanStore.migrateLegacy]',e); }
  return false;
};

/* —— 同步读写包装 (兼容旧代码,避免大改 await 链) ——
 * 这一层用于现有同步代码逐步替换:
 *   旧: localStorage.setItem('k', JSON.stringify(o))
 *   新: MallPlanStore.setSync('k', o)
 * 后端切换后,setSync 会自动改为 fire-and-forget 异步调用 + 内存缓存 */
MallPlanStore.setSync = function(key, data){
  if(this.config.driver === 'local'){
    const wrapped = {
      _meta:{
        updatedAt:     new Date().toISOString(),
        updatedBy:     this.config.currentUser || '本地用户',
        schemaVersion: this.config.schemaVersion,
        driver:        this.config.driver,
      },
      data: data
    };
    try{ localStorage.setItem(this.config.keyPrefix + key, JSON.stringify(wrapped)); return true; }
    catch(e){ return false; }
  }
  /* remote: 异步触发,内存缓存,确保 UI 不卡 */
  this._memCache = this._memCache || {};
  this._memCache[key] = data;
  this.set(key, data);  /* 触发但不等 */
  return true;
};
MallPlanStore.getSync = function(key){
  if(this.config.driver === 'local'){
    try{
      const raw = localStorage.getItem(this.config.keyPrefix + key);
      if(!raw) return null;
      const wrapped = JSON.parse(raw);
      return wrapped && wrapped._meta ? wrapped.data : wrapped;
    }catch(e){ return null; }
  }
  /* remote: 同步只能用内存缓存,需用户先调过 await get() */
  this._memCache = this._memCache || {};
  return this._memCache[key] || null;
};

/* ============================================================
 * MallPlan Bridge · 跨模块数据互通桥 v1.0 · M6
 * ============================================================
 * 设计目的:
 *   1. 三个模块 (投拓测算/定位落位/招商算账) 通过 Bridge 共享:
 *      项目档案 (ProjectArchive) / 成交库 (DealLib) / 品牌库 (BrandLib)
 *   2. 提供历史成交回归算法 (加权 P25/中位数/P75) — M6 杀手锏
 *   3. 提供"本企业基准"快速查询 — 让投拓测算引用招商沉淀的真实数据
 *
 * 依赖: MallPlanStore (M1 已部署)
 *
 * 调用示例:
 *   // 写入一笔成交 (招商算账触发)
 *   MallPlanBridge.pushDeal({ projectId:'PRJ_...', brandName:'某品牌', ... });
 *
 *   // 查询同类历史成交分布 (投拓测算调用)
 *   const stats = await MallPlanBridge.getDealStats({ cityTier:'一线', bizCategoryL1:'餐饮' });
 *   // => { count:59, p25:4.58, p50:7.40, p75:9.80, byBiz:{...} }
 *
 *   // 查询本企业基准 (按业态分组的中位数租金)
 *   const baseline = await MallPlanBridge.getEnterpriseBaseline({ cityTier:'一线' });
 * ============================================================ */
const MallPlanBridge = {
  /* —— 置信度权重 (SCHEMA.md 5.3) —— */
  CONFIDENCE_WEIGHT: { high: 1.0, mid: 0.7, low: 0.3 },

  /* —— 阈值常量 —— */
  MIN_SAMPLES_STATS:    5,    /* ≥5 笔才出统计 */
  MIN_SAMPLES_RELIABLE: 50,   /* ≥50 笔标记"可靠阈值" */

  /* ===================== 项目档案 ===================== */

  /** 列出所有项目档案 */
  async listProjects(){
    try{
      const ids = (await MallPlanStore.get('project_list')) || [];
      const projects = [];
      for(const id of ids){
        const p = await MallPlanStore.get('project_' + id);
        if(p) projects.push(p);
      }
      return projects;
    }catch(e){ console.warn('[Bridge.listProjects]',e); return []; }
  },

  /** 读单个项目档案 */
  async getProject(projectId){
    if(!projectId) return null;
    return await MallPlanStore.get('project_' + projectId);
  },

  /** 写项目档案 (返回完整数据,补全 projectId/createdAt) */
  async putProject(project){
    if(!project) return null;
    if(!project.projectId){ project.projectId = this.generateProjectId(); }
    const now = new Date().toISOString();
    if(!project.createdAt) project.createdAt = now;
    project.updatedAt = now;
    project.schemaVersion = project.schemaVersion || '1.0';
    await MallPlanStore.set('project_' + project.projectId, project);
    const ids = (await MallPlanStore.get('project_list')) || [];
    if(!ids.includes(project.projectId)){
      ids.push(project.projectId);
      await MallPlanStore.set('project_list', ids);
    }
    return project;
  },

  /** 生成 projectId: PRJ_YYYYMMDD_NNN */
  generateProjectId(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    const rand = String(Math.floor(Math.random()*900)+100);
    return `PRJ_${y}${m}${day}_${rand}`;
  },

  /* ===================== 成交库 ===================== */

  async listDeals(){
    try{
      const ids = (await MallPlanStore.get('deal_list')) || [];
      const deals = [];
      for(const id of ids){
        const d = await MallPlanStore.get('deal_' + id);
        if(d) deals.push(d);
      }
      return deals;
    }catch(e){ console.warn('[Bridge.listDeals]',e); return []; }
  },

  async pushDeal(deal){
    if(!deal) return null;
    if(!deal.dealId){
      const d = new Date();
      const ts = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`;
      const rand = String(Math.floor(Math.random()*900)+100);
      deal.dealId = `DEAL_${ts}_${rand}`;
    }
    deal.confidence = deal.confidence || 'mid';
    deal.source     = deal.source     || '本项目签约';
    deal.createdAt  = deal.createdAt  || new Date().toISOString();
    deal.schemaVersion = deal.schemaVersion || '1.0';
    if(deal.rentDaily && !deal.rentMonthly){ deal.rentMonthly = +(deal.rentDaily * 30).toFixed(2); }
    else if(deal.rentMonthly && !deal.rentDaily){ deal.rentDaily = +(deal.rentMonthly / 30).toFixed(2); }
    await MallPlanStore.set('deal_' + deal.dealId, deal);
    const ids = (await MallPlanStore.get('deal_list')) || [];
    if(!ids.includes(deal.dealId)){
      ids.push(deal.dealId);
      await MallPlanStore.set('deal_list', ids);
    }
    try{ MallPlanStore.log({ action:'bridge_push_deal', dealId:deal.dealId, brand:deal.brandName, biz:deal.bizCategoryL2, rentDaily:deal.rentDaily }); }catch(e){}
    return deal;
  },

  async pushDealsBatch(deals){
    if(!Array.isArray(deals)) return 0;
    let ok = 0;
    for(const d of deals){ const r = await this.pushDeal(d); if(r) ok++; }
    return ok;
  },

  /* ===================== 历史回归 (M6 杀手锏) ===================== */

  /**
   * 按筛选条件查询成交统计 (加权百分位)
   * @returns { count, reliable, hasStats, p25, p50, p75, mean, min, max, avgArea, byBiz, samples }
   */
  async getDealStats(filter){
    filter = filter || {};
    const allDeals = await this.listDeals();
    const matched = allDeals.filter(d=>{
      if(filter.cityTier      && d.cityTier      !== filter.cityTier)      return false;
      if(filter.city          && d.city          !== filter.city)          return false;
      if(filter.bizCategoryL1 && d.bizCategoryL1 !== filter.bizCategoryL1) return false;
      if(filter.bizCategoryL2 && d.bizCategoryL2 !== filter.bizCategoryL2) return false;
      if(filter.floorCode     && d.floorCode     !== filter.floorCode)     return false;
      if(typeof d.rentDaily !== 'number' || d.rentDaily <= 0)              return false;
      return true;
    });

    const result = {
      filter:    filter,
      count:     matched.length,
      reliable:  matched.length >= this.MIN_SAMPLES_RELIABLE,
      hasStats:  matched.length >= this.MIN_SAMPLES_STATS,
      samples:   matched
    };
    if(matched.length === 0){
      Object.assign(result, { p25:null, p50:null, p75:null, mean:null, min:null, max:null, avgArea:null, byBiz:{} });
      return result;
    }
    const overall = this._calcPercentiles(matched.map(d=>({ v:d.rentDaily, w:this.CONFIDENCE_WEIGHT[d.confidence]||0.5 })));
    Object.assign(result, overall);
    const areas = matched.map(d=>d.buildingArea).filter(a=>typeof a==='number'&&a>0);
    result.avgArea = areas.length ? +(areas.reduce((s,a)=>s+a,0)/areas.length).toFixed(0) : null;
    const byBiz = {};
    matched.forEach(d=>{
      const k = d.bizCategoryL2 || '其他';
      if(!byBiz[k]) byBiz[k] = [];
      byBiz[k].push({ v:d.rentDaily, w:this.CONFIDENCE_WEIGHT[d.confidence]||0.5, area:d.buildingArea });
    });
    result.byBiz = {};
    Object.keys(byBiz).forEach(k=>{
      const arr = byBiz[k];
      if(arr.length < 2){
        result.byBiz[k] = { count:arr.length, p25:arr[0].v, p50:arr[0].v, p75:arr[0].v, mean:arr[0].v };
        return;
      }
      result.byBiz[k] = this._calcPercentiles(arr);
      result.byBiz[k].count = arr.length;
    });
    return result;
  },

  /** 加权百分位计算 (线性插值) */
  _calcPercentiles(samples){
    if(samples.length === 0) return { p25:null, p50:null, p75:null, mean:null, min:null, max:null };
    const sorted = samples.slice().sort((a,b)=>a.v - b.v);
    const totalW = sorted.reduce((s,x)=>s+x.w, 0);
    const findPct = (pct)=>{
      const target = totalW * pct;
      let cum = 0;
      for(let i=0; i<sorted.length; i++){
        cum += sorted[i].w;
        if(cum >= target){
          if(i === 0) return sorted[0].v;
          const prevCum = cum - sorted[i].w;
          const ratio = (target - prevCum) / sorted[i].w;
          return sorted[i-1].v + (sorted[i].v - sorted[i-1].v) * ratio;
        }
      }
      return sorted[sorted.length-1].v;
    };
    const mean = sorted.reduce((s,x)=>s + x.v*x.w, 0) / totalW;
    return {
      p25:  +findPct(0.25).toFixed(2),
      p50:  +findPct(0.50).toFixed(2),
      p75:  +findPct(0.75).toFixed(2),
      mean: +mean.toFixed(2),
      min:  +sorted[0].v.toFixed(2),
      max:  +sorted[sorted.length-1].v.toFixed(2)
    };
  },

  /* ===================== 本企业基准 (投拓核心入口) ===================== */

  /**
   * 按业态大类返回基准租金 (元/㎡/月) — 给投拓测算用
   * @returns { hasData, count, reliable, baseline: { '餐饮':{p50_daily,p50_monthly,count}, ... }, overall, source }
   */
  async getEnterpriseBaseline(filter){
    filter = filter || {};
    const allDeals = await this.listDeals();
    const matched = allDeals.filter(d=>{
      if(filter.cityTier && d.cityTier !== filter.cityTier) return false;
      if(filter.city     && d.city     !== filter.city)     return false;
      if(typeof d.rentDaily !== 'number' || d.rentDaily <= 0) return false;
      return true;
    });
    const result = {
      hasData:   matched.length >= this.MIN_SAMPLES_STATS,
      count:     matched.length,
      reliable:  matched.length >= this.MIN_SAMPLES_RELIABLE,
      filter:    filter,
      baseline:  {},
      source:    matched.length > 0 ? '本企业历史成交' : '无数据'
    };
    if(matched.length === 0) return result;
    const groups = {};
    matched.forEach(d=>{
      const k = d.bizCategoryL1 || '其他';
      if(!groups[k]) groups[k] = [];
      groups[k].push({ v:d.rentDaily, w:this.CONFIDENCE_WEIGHT[d.confidence]||0.5 });
    });
    Object.keys(groups).forEach(k=>{
      const arr = groups[k];
      const stat = this._calcPercentiles(arr);
      result.baseline[k] = {
        count:        arr.length,
        p50_daily:    stat.p50,
        p50_monthly:  +(stat.p50 * 30).toFixed(0),
        p25_daily:    stat.p25,
        p75_daily:    stat.p75,
        p25_monthly:  +(stat.p25 * 30).toFixed(0),
        p75_monthly:  +(stat.p75 * 30).toFixed(0)
      };
    });
    const overall = this._calcPercentiles(matched.map(d=>({ v:d.rentDaily, w:this.CONFIDENCE_WEIGHT[d.confidence]||0.5 })));
    result.overall = {
      p50_daily:    overall.p50,
      p50_monthly:  +(overall.p50 * 30).toFixed(0),
      p25_daily:    overall.p25,
      p75_daily:    overall.p75
    };
    return result;
  },

  /** 元信息 */
  meta:{
    version:     '1.0',
    schemaVersion:'1.0',
    minSamples:  5,
    minReliable: 50,
    note:        'MallPlan Bridge 提供跨模块的项目档案、成交库、品牌库共享通道。所有数据通过 MallPlanStore 持久化,后端切换无需改 Bridge。'
  }
};

  renderScaleAnalysis(){

  renderRevenue(root){

      const rv=rent*mo*m.leasableArea*occ/10000;
      const pv=pm*12*m.leasableArea*occ/10000;
      const ov=rv*r.otherIncomeRate/100;
      const t=rv+pv+ov;tr+=t;
      rows.push({i,rent,pm,occ:occ*100,mo,rv,pv,ov,t});
    }
    root.innerHTML=`
      <div class="page-head"><div class="breadcrumb">02 / 投资测算 / 收入测算</div><h1 class="page-title">收入测算</h1>

          <div class="form-row"><label class="form-label">租金年递增率</label><div class="form-suffix"><input class="form-input numeric" type="number" step="0.5" value="${r.rentGrowth}" onchange="App.setField('revenue.rentGrowth',+this.value);App.go('revenue')"><span class="suffix">%</span></div></div>

  /* M6 — 本企业历史成交基准 (调 MallPlanBridge.getEnterpriseBaseline) */
  async renderEnterpriseBaseline(){
    const host = document.getElementById('m6-baseline-card');
    if(!host) return;
    if(!window.MallPlanBridge){
      host.innerHTML = '';
      return;
    }
    const meta = this.state.project.meta;
    let data;
    try{ data = await MallPlanBridge.getEnterpriseBaseline({ cityTier: meta.cityTier, propertyType: meta.propertyType }); }
    catch(e){ console.warn('[renderEnterpriseBaseline]', e); host.innerHTML = ''; return; }
    /* 状态 1: 无数据 (< MIN_SAMPLES_STATS 笔) */
    if(!data.hasData){
      host.innerHTML = `<div class="card" style="background:linear-gradient(135deg,#fdfaf2 0%,#fff 100%);border-color:#e8d8b3">
        <div class="card-head"><div class="card-title">📈 本企业历史成交基准 (来自成交库)</div>
          <span class="badge" style="background:#fdfaf2;color:#c98828">${data.count}/${MallPlanBridge.MIN_SAMPLES_STATS} 笔 · 暂未激活</span></div>
        <p style="color:#666;font-size:13px;line-height:1.7;margin:8px 4px 4px">
          当前成交库共有 <b>${data.count}</b> 笔同等级城市 (<b>${meta.cityTier||'全部'}</b>) 成交记录, 未达到统计阈值 <b>≥${MallPlanBridge.MIN_SAMPLES_STATS}</b> 笔。
          <br><span style="color:#888;font-size:12px">💡 建议:在「<b>招商算账</b>」模块录入或导入历史成交, 达到 ≥5 笔后此处自动激活基准建议;≥50 笔后投决会报告附录 B 自动启用本企业历史回归。</span>
        </p></div>`;
      return;
    }
    /* 状态 2: 有数据 → 渲染基准卡片 */
    this._m6Baseline = data;
    const reliability = data.reliable
      ? '<span class="badge positive">✓ 高可信 ≥50 笔</span>'
      : '<span class="badge" style="background:#fdfaf2;color:#c98828">参考样本 5-49 笔</span>';
    const rows = Object.keys(data.baseline).map(k=>{

    }).join('');
    const overallP50 = data.overall ? data.overall.p50_monthly : '—';
    host.innerHTML = `<div class="card" style="background:linear-gradient(135deg,#fdfaf2 0%,#fff 100%);border-color:#e8d8b3">
      <div class="card-head"><div class="card-title">📈 本企业历史成交基准 (来自成交库)</div>${reliability}</div>

        基于本企业 <b>${data.count}</b> 笔历史成交 (筛选: ${meta.cityTier||'全部'}城市 / ${meta.propertyType||'全部物业'}), 按业态大类返回中位数租金建议。
      </p>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>业态大类</th><th class="num">样本数</th><th class="num">P25 (元/㎡/月)</th><th class="num">中位数 ★</th><th class="num">P75</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px;background:#fff;border:1px dashed #d8c896;border-radius:4px">
        <div style="flex:1">
          <div style="font-size:12px;color:#888">综合中位数租金</div>
          <div style="font-size:18px;font-weight:600;color:#c98828">${overallP50} <span style="font-size:12px;color:#888;font-weight:400">元/㎡/月</span></div>
        </div>

  /* M6 — 一键应用本企业基准 */
  async applyM6Baseline(){
    if(!this._m6Baseline || !this._m6Baseline.overall){ this.toast('暂无可应用的基准数据','warn'); return; }
    const newRent = this._m6Baseline.overall.p50_monthly;
    if(!confirm(`将把"起始租金"设为本企业历史中位数 ${newRent} 元/㎡/月(基于 ${this._m6Baseline.count} 笔成交)。\n\n• 当前值: ${this.state.project.revenue.rentBase} 元/㎡/月\n• 应用后会记录到校准历史 (override)\n\n继续?`)) return;
    const oldRent = this.state.project.revenue.rentBase;
    this.state.project.revenue.rentBase = newRent;
    this.state.project.revenue.rentOverride = true;
    try{
      if(typeof this.recordOverride === 'function'){
        this.recordOverride('revenue.rentBase','综合租金单价(首年)', oldRent, newRent, `应用本企业历史成交基准 (基于 ${this._m6Baseline.count} 笔成交, ${this._m6Baseline.filter.cityTier||'全部'}城市)`);
      }
    }catch(e){ console.warn(e); }
    try{ MallPlanStore.log({ action:'apply_m6_baseline', oldValue: oldRent, newValue: newRent, samples: this._m6Baseline.count }); }catch(e){}
    this.go('revenue');
    this.toast(`✓ 已应用本企业基准 ${newRent} 元/㎡/月`,'positive');
  },
  updateOccupancy(i,v){this.state.project.revenue.occupancy[i]=v;this.go('revenue');},
  applyOccupancyTemplate(){
    const type=this.state.project.meta.type;const db=this.state.db;

    let occ=null;
    const typeMap={lease:'包租·原状(成熟商业)',dev:'资本化改造(重资产)',ent:'委托管理·接管型'};
    const row=db.occupancyCurve.rows.find(x=>x[0]===typeMap[type]);
    if(row)occ=[parseInt(row[1])||70,parseInt(row[2])||85,parseInt(row[3])||90,parseInt(row[4])||92,parseInt(row[5])||94].concat(Array(10).fill(parseInt(row[5])||94));
    if(!occ)occ={lease:[80,90,93,94,95,95,95,95,95,95,95,95,95,95,95],dev:[50,75,88,93,95,95,95,95,95,95,95,95,95,95,95],ent:[75,85,90,92,94,95,95,95,95,95,95,95,95,95,95]}[type];
    this.state.project.revenue.occupancy=occ;this.state.project.revenue.occOverride=false;
    this.toast('已应用数据库默认出租率曲线','positive');this.go('revenue');

  fillFromDB(field){
    if(field!=='rent')return;const ct=this.cityTier(this.state.project.meta.city);const tier=(ct==='三线'||ct==='三线及以下')?'三线及以下':ct;
    const p=this.state.project.meta.propertyType;let k='购物中心';if(p.includes('写字楼'))k='写字楼';else if(p.includes('公寓'))k='公寓';
    const row=this.state.db.rentRef.rows.find(x=>x[0]===`${k}-${tier}`)||this.state.db.rentRef.rows.find(x=>x[0].startsWith(k));
    if(row){this.state.project.revenue.rentBase=row[2];this.state.project.revenue.rentOverride=false;this.toast(`已取DB参考值${row[2]}元/㎡/月,跟随数据库(未锁定)`,'positive');this.go('revenue');}else this.toast('未找到匹配租金','warning');
  },

  /* ==================== 03 · 成本测算 ==================== */
  renderCost(root){

    const opRows=[];
    for(let i=1;i<=y;i++){
      const occ=(rev.occupancy[i-1]||95)/100;
      const rcu=c.rentToOwner*Math.pow(1+c.rentToOwnerGrowth/100,i-1);const rc=type==='lease'?rcu*12*m.leasableArea/10000:0;
      const pm=rev.pmFeeBase*Math.pow(1+rev.pmFeeGrowth/100,i-1);const pv=pm*12*m.leasableArea*occ/10000;const pmc=pv*c.pmCostRate/100;
      const hrc=c.hrTotal*Math.pow(1.03,i-1);

      const ic=type==='dev'?capex*c.insuranceRate/100:0;
      const tc=rc+pmc+hrc+adm+mgmt+mkc+rpc+ic;

          <div class="form-row"><label class="form-label">可改造面积</label><div class="form-suffix"><input class="form-input numeric" type="number" value="${c.renovArea}" onchange="App.setField('cost.renovArea',+this.value);App.go('cost')"><span class="suffix">㎡</span></div></div>
          <div class="form-row"><label class="form-label">设计费</label><div class="form-suffix"><input class="form-input numeric" type="number" step="0.5" value="${c.designFee}" onchange="App.setField('cost.designFee',+this.value);App.go('cost')"><span class="suffix">%</span></div></div>

        </div>
        <div class="kpi-grid" style="margin-top:16px">
          <div class="kpi"><div class="kpi-label">工程造价</div><div class="kpi-value">${rtc.toFixed(0)}<span class="unit">万元</span></div></div>
          <div class="kpi"><div class="kpi-label">设计费</div><div class="kpi-value">${dc.toFixed(0)}<span class="unit">万元</span></div></div>

  fillFromDB_HR(){

    const ct=this.cityTier(this.state.project.meta.city);const si={一线:1,新一线:2,二线:3,三线:4,三线及以下:4}[ct]||4;

  /* ============================================================
     统一参数映射: getAssumptions() — 数据库联动核心
     ============================================================ */
  /* 返回当前项目的完整测算假设,优先读数据库,用户可手工覆盖 */
  getAssumptions(){
    const p=this.state.project;const db=this.state.db;const m=p.meta;const type=m.type;
    const ct=this.cityTier(m.city);const ci={一线:1,新一线:2,二线:3,三线:4,三线及以下:4}[ct]||4;
    let sc=1;if(m.grossArea>150000)sc=4;else if(m.grossArea>80000)sc=3;else if(m.grossArea>30000)sc=2;
    const kind=m.propertyType.includes('写字楼')?'写字楼':m.propertyType.includes('公寓')?'公寓':'购物中心';
    const tierKey=(ct==='三线'||ct==='三线及以下')?'三线及以下':ct;

    /* 租金:项目字段(手工) vs DB rentRef */
    let rentBase=p.revenue.rentBase;
    if(!p.revenue.rentOverride){
      const row=db.rentRef.rows.find(x=>x[0]===`${kind}-${tierKey}`)||db.rentRef.rows.find(x=>x[0].startsWith(kind));
      if(row) rentBase=row[2];
    }
    /* 物业费:项目 vs DB pmFeeStd */
    let pmFeeBase=p.revenue.pmFeeBase;
    if(!p.revenue.pmOverride){
      const row=db.pmFeeStd.rows.find(x=>x[0].includes('购物中心'));
      if(row) pmFeeBase=row[ci];
    }
    /* 出租率:项目 vs 按类型默认曲线 */
    let occ=p.revenue.occupancy;
    if(!p.revenue.occOverride){
      const tplMap={lease:[80,90,93,94,95,95,95,95,95,95,95,95,95,95,95],dev:[50,75,88,93,95,95,95,95,95,95,95,95,95,95,95],ent:[75,85,90,92,94,95,95,95,95,95,95,95,95,95,95]};
      occ=tplMap[type]||tplMap.lease;
    }
    /* 人力:项目 vs DB hrConfig+salaryStd */
    let hrTotal=p.cost.hrTotal;
    if(!p.cost.hrOverride){
      hrTotal=0;const si={一线:1,新一线:2,二线:3,三线:4}[ct]||4;
      db.hrConfig.rows.forEach(r=>{const h=r[sc];let sr=db.salaryStd.rows.find(s=>r[0].includes(s[0]));if(!sr)sr=db.salaryStd.rows.find(s=>s[0]==='客服/行政');hrTotal+=(sr?sr[si]:8)*h;});
    }
    /* 改造造价:项目 vs DB renovStd */
    let renovTotal=p.cost.renovTotal;
    if(!p.cost.renovOverride){
      let key='购物中心·中改造';if(m.propertyType.includes('写字楼'))key='写字楼·中改造';
      const r=db.renovStd.rows.find(x=>x[0]===key);if(r)renovTotal=r[r.length-1];
    }
    /* 税率:项目 vs DB finParams */
    let vatRent=p.tax.vatRent,incomeTax=p.tax.incomeTax,stampTaxRate=p.tax.stampTaxRate;
    if(!p.tax.taxOverride){
      const fr=db.finParams.rows;
      const v=fr.find(x=>x[0].includes('增值税率(租金)'));if(v)vatRent=parseFloat(v[1])||9;
      const c=fr.find(x=>x[0].includes('企业所得税'));if(c)incomeTax=parseFloat(c[1])||25;
      const s=fr.find(x=>x[0].includes('印花税(财产租赁'));if(s)stampTaxRate=parseFloat(s[1])||0.1;
    }
    return{...p.revenue,rentBase,pmFeeBase,occupancy:occ,hrTotal,renovTotal,vatRent,incomeTax,stampTaxRate,type,m,years:m.coopYears,leasableArea:m.leasableArea};
  },

  /* ============================================================
     三种模式独立现金流引擎
     calcCashFlow 自动按 type 派发
     ============================================================ */
  calcCashFlow(){
    const type=this.state.project.meta.type;
    if(type==='dev')return this.calcDevCashFlow();
    if(type==='ent')return this.calcEntCashFlow();
    return this.calcLeaseCashFlow();
  },

  /* --- 包租引擎:支持三种合作模式 --- */
  calcLeaseCashFlow(){
    const a=this.getAssumptions();const y=a.years;const m=this.state.project.meta;
    const t=this.state.project.tax;const c=this.state.project.cost;
    const rev=[],cst=[],tax=[],netCF=[];
    const rtc=a.renovTotal*c.renovArea/10000;const dc=rtc*c.designFee/100;const cc=rtc*c.contingency/100;const capex=rtc+dc+cc;
    netCF.push(-capex);rev.push(0);cst.push(0);tax.push(0);
    for(let i=1;i<=y;i++){
      const occ=(a.occupancy[i-1]||a.occupancy[a.occupancy.length-1]||95)/100;
      const mo=i===1?Math.max(0,12-a.rentFreeMonths):12;
      const ru=a.rentBase*Math.pow(1+a.rentGrowth/100,i-1);
      const pu=a.pmFeeBase*Math.pow(1+a.pmFeeGrowth/100,i-1);
      const rv=ru*mo*m.leasableArea*occ/10000;
      const pv=pu*12*m.leasableArea*occ/10000;
      const ov=rv*a.otherIncomeRate/100;const trv=rv+pv+ov;
      /* 三种合作模式:paymentToOwner */
      const ebitB4Owner=trv-(pv*c.pmCostRate/100)-(a.hrTotal*Math.pow(1.03,i-1))-(c.hrAdmin*Math.pow(1.02,i-1))-(c.hrMgmtFee*Math.pow(1.02,i-1))-(trv*c.marketingRate/100);
      const ownerPay=this.paymentToOwner(i,trv,ebitB4Owner);
      const pmc=pv*c.pmCostRate/100;
      const hrc=a.hrTotal*Math.pow(1.03,i-1);
      const adm=c.hrAdmin*Math.pow(1.02,i-1);
      const mgmt=c.hrMgmtFee*Math.pow(1.02,i-1);
      const mkc=trv*c.marketingRate/100;
      const tc=ownerPay+pmc+hrc+adm+mgmt+mkc;
      const vr=rv/(1+a.vatRent/100)*(a.vatRent/100);
      const vp=pv/(1+t.vatPm/100)*(t.vatPm/100);
      const vt=vr+vp;const sc=vt*t.surcharge/100;
      const st=rv*a.stampTaxRate/1000;
      const ebit=trv-vt-sc-st-tc;
      const cit=Math.max(0,ebit)*a.incomeTax/100;
      const totalTax=vt+sc+st+cit;
      const opCF=trv-tc-totalTax;
      rev.push(trv);cst.push(tc);tax.push(totalTax);netCF.push(opCF);
    }
    return{capex,rev,cst,tax,netCF};
  },

  /* --- 重资产引擎:使用devConfig参数 --- */
  calcDevCashFlow(){
    const a=this.getAssumptions();const y=a.years;const m=this.state.project.meta;
    const t=this.state.project.tax;const c=this.state.project.cost;const dc=this.state.project.devConfig;
    const rev=[],cst=[],tax=[],netCF=[];
    const rtc=a.renovTotal*c.renovArea/10000;const df=rtc*c.designFee/100;const cc=rtc*c.contingency/100;const baseCapex=rtc+df+cc;
    const landCost=m.grossArea*dc.landPrice/10000;
    const capex=baseCapex+landCost;
    netCF.push(-capex);rev.push(0);cst.push(0);tax.push(0);
    for(let i=1;i<=y;i++){
      const occ=(a.occupancy[i-1]||a.occupancy[a.occupancy.length-1]||95)/100;
      const mo=i===1?Math.max(0,12-a.rentFreeMonths):12;
      const ru=a.rentBase*Math.pow(1+a.rentGrowth/100,i-1);
      const pu=a.pmFeeBase*Math.pow(1+a.pmFeeGrowth/100,i-1);
      const rv=ru*mo*m.leasableArea*occ/10000;
      const pv=pu*12*m.leasableArea*occ/10000;
      const ov=rv*a.otherIncomeRate/100;const trv=rv+pv+ov;
      const pmc=pv*c.pmCostRate/100;
      const hrc=a.hrTotal*Math.pow(1.03,i-1);
      const adm=c.hrAdmin*Math.pow(1.02,i-1);
      const mgmt=c.hrMgmtFee*Math.pow(1.02,i-1);
      const mkc=trv*c.marketingRate/100;
      const rpc=capex*c.repairRate/100;const ic=capex*c.insuranceRate/100;
      const tc=pmc+hrc+adm+mgmt+mkc+rpc+ic;
      const vr=rv/(1+a.vatRent/100)*(a.vatRent/100);
      const vp=pv/(1+t.vatPm/100)*(t.vatPm/100);
      const vt=vr+vp;const sc=vt*t.surcharge/100;
      const pt=rv*t.propertyTaxRate/100;
      const st=rv*a.stampTaxRate/1000;
      const ebit=trv-vt-sc-pt-st-tc;
      const cit=Math.max(0,ebit)*a.incomeTax/100;
      const totalTax=vt+sc+pt+st+cit;
      const opCF=trv-tc-totalTax;
      rev.push(trv);cst.push(tc);tax.push(totalTax);netCF.push(opCF);
    }
    const lastNoi=(rev[rev.length-1]||0)-((cst[cst.length-1]||0)+(tax[tax.length-1]||0));
    const capRate=dc.capRate/100;const exitValue=capRate>0?lastNoi/capRate:0;
    const exitTax=exitValue*dc.exitTaxRate/100;
    netCF[netCF.length-1]+=(exitValue-exitTax);
    rev[rev.length-1]+=exitValue;cst[cst.length-1]+=exitTax;
    return{capex,rev,cst,tax,netCF,exitValue};
  },

  /* --- 委管引擎:使用entConfig参数,不吃全部租金 --- */
  calcEntCashFlow(){
    const a=this.getAssumptions();const y=a.years;const m=this.state.project.meta;
    const t=this.state.project.tax;const c=this.state.project.cost;const ec=this.state.project.entConfig;
    const rev=[],cst=[],tax=[],netCF=[];
    const capex=0;
    netCF.push(-capex);rev.push(0);cst.push(0);tax.push(0);
    for(let i=1;i<=y;i++){
      const occ=(a.occupancy[i-1]||a.occupancy[a.occupancy.length-1]||95)/100;
      const mo=i===1?Math.max(0,12-a.rentFreeMonths):12;
      const ru=a.rentBase*Math.pow(1+a.rentGrowth/100,i-1);
      const pu=a.pmFeeBase*Math.pow(1+a.pmFeeGrowth/100,i-1);
      const rv=ru*mo*m.leasableArea*occ/10000;
      const pv=pu*12*m.leasableArea*occ/10000;
      const ov=rv*a.otherIncomeRate/100;
      const totalRent=rv+pv+ov;
      /* 委管收入按用户配置参数 */
      const mgmtRev=totalRent*ec.mgmtFeeRate/100;
      const brandFee=i===1?ec.brandFee:0;
      const leasingFee=i===1?totalRent*ec.leasingCommRate/100:0;
      const perfShare=i>=ec.perfShareStartYear?totalRent*ec.perfShareRate/100:0;
      const totalMgmtRev=mgmtRev+brandFee+leasingFee+perfShare;
      /* 委管成本按用户配置比例 */
      const hrc=a.hrTotal*Math.pow(1.03,i-1)*ec.staffRatio/100;
      const adm=c.hrAdmin*Math.pow(1.02,i-1)*0.5;
      const travel=c.hrMgmtFee*Math.pow(1.02,i-1)*0.3;
      const tc=hrc+adm+travel;
      const vr=totalMgmtRev/(1+t.vatPm/100)*(t.vatPm/100);
      const vt=vr;const sc=vt*t.surcharge/100;
      const ebit=totalMgmtRev-vt-sc-tc;
      const cit=Math.max(0,ebit)*a.incomeTax/100;
      const totalTax=vt+sc+cit;
      const opCF=totalMgmtRev-tc-totalTax;
      rev.push(totalMgmtRev);cst.push(tc);tax.push(totalTax);netCF.push(opCF);
    }
    return{capex,rev,cst,tax,netCF};
  },
  calcNPV(cfs,rate){/* t0(索引0)不折现,i=0→Math.pow(1+rate,0)=1 */return cfs.reduce((s,cf,i)=>s+cf/Math.pow(1+rate,i),0);},
  calcIRR(cfs,guess=0.1){
    /* Bug 5: 先判断是否存在有效IRR——现金流必须同时有正负值 */
    let hasPos=!1,hasNeg=!1;
    for(let k=0;k<cfs.length;k++){if(cfs[k]>0)hasPos=!0;if(cfs[k]<0)hasNeg=!0;}
    if(!hasPos||!hasNeg)return null;
    let r=guess;
    for(let i=0;i<100;i++){let npv=0,dnpv=0;for(let j=0;j<cfs.length;j++){const d=Math.pow(1+r,j);npv+=cfs[j]/d;dnpv-=j*cfs[j]/Math.pow(1+r,j+1);}if(Math.abs(npv)<0.01)return r;if(dnpv===0)break;const nr=r-npv/dnpv;if(Math.abs(nr-r)<1e-6)return nr;r=nr;if(r<-0.99)r=-0.5;if(r>10)r=1;}
    let lo=-0.5,hi=5;for(let i=0;i<80;i++){const mid=(lo+hi)/2;const npv=cfs.reduce((s,c,j)=>s+c/Math.pow(1+mid,j),0);if(npv>0)lo=mid;else hi=mid;}const result=(lo+hi)/2;
    return result>-0.49?result:null; /* 收敛到-50%边界视为无解 */
  },
  calcPayback(cfs){let cum=0;for(var k=0;k<cfs.length;k++){cum+=cfs[k];if(cum>=0&&k>0){var prev=cum-cfs[k];return(k-1)+(-prev)/cfs[k];}}return null;},

  /* 包租支付业主 — 三种合作模式 */
  paymentToOwner(n,totalRev,ebt){
    const c=this.state.project.coop;const mode=c.mode||'固租模式';
    const base=c.startRent*12*this.state.project.meta.leasableArea/10000;
    let factor=1;if(n>=1){const periods=Math.floor((n-1)/c.escalatePeriod)+1;factor=Math.pow(1+c.escalateRate/100,periods);}
    const fixed=base*factor;
    if(mode==='固租模式')return fixed;
    if(mode==='收入分成'){
      const sr= n<=c.revShareYearsFront ? c.revShareRateFront/100 : c.revShareRateBack/100;
      return Math.max(fixed,(totalRev||0)*sr);
    }
    if(mode==='净收益分成'){
      const sr= n<=c.netShareYearsFront ? c.netShareRateFront/100 : c.netShareRateBack/100;
      return fixed+Math.max(0,(ebt||0))*sr;
    }
    return fixed;
  },

    csv+=`=== 核心指标 ===\nIRR,${irr!==null?irr*100+'%':'无有效IRR'}\nNPV(万元),${npv.toFixed(2)}\nCAPEX(万元),${cf.capex.toFixed(2)}\n全周期收入,${cf.rev.reduce((s,x)=>s+x,0).toFixed(2)}万元\n全周期成本,${cf.cst.reduce((s,x)=>s+x,0).toFixed(2)}万元\n全周期税费,${cf.tax.reduce((s,x)=>s+x,0).toFixed(2)}万元\n\n`;
    csv+=`=== 现金流明细(年度) ===\n年度,收入,成本,税费,净现金流,累计净CF\n`;

    csv+=`\n=== 利润表 ===\n年度,营业收入,营业成本,税费,净利润\n`;
    cf.netCF.forEach((nc,i)=>{const yr=i===0?'t0':'第'+i+'年';csv+=`${yr},${(cf.rev[i]||0).toFixed(2)},${(cf.cst[i]||0).toFixed(2)},${(cf.tax[i]||0).toFixed(2)},${((cf.rev[i]||0)-(cf.cst[i]||0)-(cf.tax[i]||0)).toFixed(2)}\n`;});

  /* ============================================================
     M4 · 参数本地校准 (override 历史追溯)
     ============================================================ */
  recordOverride(fieldPath, fieldLabel, oldValue, newValue, reason){
    const p = this.state.project;
    if(!p.overrideHistory) p.overrideHistory = [];
    const entry = {
      fieldPath, fieldLabel,
      oldValue, newValue,
      reason: reason || '',
      ts: new Date().toISOString(),
      user: '本地用户'
    };
    p.overrideHistory.push(entry);
    /* 限制 200 条 */
    if(p.overrideHistory.length > 200) p.overrideHistory.splice(0, p.overrideHistory.length-200);
    /* 审计 */
    try{ MallPlanStore.log({ action:'override_param', fieldPath, oldValue, newValue, reason }); }catch(e){}
    /* 持久化 (复用现有项目保存逻辑) */
    try{ MallPlanStore.setSync('investment_project', this.state.project); }catch(e){}
    this.toast('✓ 已记录参数校准', 'positive');
  },

  promptOverrideEntry(){
    const fields = [
      ['revenue.rentBase', '综合租金单价(首年)', '元/㎡/天'],
      ['revenue.rentGrowth', '租金递增率', '%/年'],
      ['revenue.pmFeeBase', '物业费单价(首年)', '元/㎡/月'],
      ['revenue.pmFeeGrowth', '物业费递增率', '%/年'],
      ['revenue.otherIncomeRate', '多经收入率', '%'],
      ['revenue.rentFreeMonths', '首年免租期', '个月'],
      ['cost.renovTotal', '改造造价标准', '元/㎡'],
      ['cost.hrCost', '人力成本', '万元/年'],
      ['cost.pmCostRate', '物业管理成本率', '%'],
      ['cost.mktRate', '营销费率', '%'],
      ['cost.maintRate', '维修费率', '%'],
      ['tax.discountRate', '折现率', '%'],
      ['tax.loanRate', '贷款利率', '%'],
      ['tax.incomeTax', '企业所得税率', '%'],
    ];
    const opts = fields.map((f,i)=>`${i+1}. ${f[1]}`).join('\n');
    const choice = prompt(`请选择校准字段 (1-${fields.length}):\n\n${opts}`);
    if(!choice) return;
    const idx = +choice - 1;
    if(idx < 0 || idx >= fields.length){ alert('选择无效'); return; }
    const f = fields[idx];
    /* 读当前值 */
    const path = f[0].split('.');
    let cur = this.state.project;
    for(const k of path) cur = cur ? cur[k] : null;
    const oldVal = prompt(`默认/原值 (${f[2]}):`, '');
    if(oldVal === null) return;
    const newVal = prompt(`新值/校准后 (${f[2]}):`, String(cur||''));
    if(newVal === null) return;
    const reason = prompt('校准原因 (例如: 对标周边 凯德/恒隆均值, 本项目核心区位有溢价):', '');
    if(reason === null) return;
    this.recordOverride(f[0], f[1], +oldVal||oldVal, +newVal||newVal, reason);
    this.viewOverrideHistory();
  },

  exportOverrideHistory(){
    const list = this.state.project.overrideHistory || [];
    if(list.length === 0){ alert('暂无校准记录可导出'); return; }
    const head = '字段路径,字段名,原值,新值,原因,时间,用户\n';
    const body = list.map(o => [o.fieldPath, o.fieldLabel, o.oldValue, o.newValue, (o.reason||'').replace(/,/g,'，'), o.ts, o.user].join(',')).join('\n');
    const blob = new Blob(['\ufeff'+head+body], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `参数校准历史_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    this.toast('✓ 校准历史 CSV 已导出', 'positive');
  },

  clearOverrideHistory(){
    if(!confirm('确认清空所有校准记录? 此操作不可恢复。')) return;
    this.state.project.overrideHistory = [];
    try{ MallPlanStore.setSync('investment_project', this.state.project); }catch(e){}

    this.toast('已清空', 'info');
  },


  /* ============================================================
     M3 · 投决会 Word 报告 (8 章节)
     ============================================================ */
  async exportInvestmentReport(){
    try{
      const dropdown = document.getElementById('exportDropdown');
      if(dropdown) dropdown.classList.remove('open');

      if(typeof docx === 'undefined' || typeof saveAs === 'undefined'){
        this.toast('docx 库未加载, 请检查网络后重试', 'warn');
        return;
      }
      this.toast('正在生成投决会 Word 报告...', 'info');

      const p = this.state.project;
      const m = p.meta;
      const cf = this.calcCashFlow();
      const irr = this.calcIRR(cf.netCF);
      const npv = this.calcNPV(cf.netCF, p.tax.discountRate/100);
      const pb = this.calcPayback(cf.netCF);
      const noiFirst = (cf.rev[1]||0) - ((cf.cst[1]||0)+(cf.tax[1]||0));
      const yrs = m.coopYears;
      const totalRev = cf.rev.slice(1).reduce((s,v)=>s+v,0);
      const totalCst = cf.cst.slice(1).reduce((s,v)=>s+v,0);
      const totalTx = cf.tax.slice(1).reduce((s,v)=>s+v,0);
      const totalNet = totalRev - totalCst - totalTx;
      const netMargin = totalRev > 0 ? (totalNet/totalRev*100) : 0;

      const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, Table, TableRow, TableCell, WidthType, BorderStyle, ShadingType } = docx;

      const h = (text, lvl) => new Paragraph({
        heading: lvl || HeadingLevel.HEADING_1,
        spacing: { before: 240, after: 120 },
        children:[ new TextRun({ text, bold:true, font:'微软雅黑', size: lvl===HeadingLevel.HEADING_2?24:28 }) ]
      });
      const para = (text, opts) => new Paragraph({
        spacing:{ after:100 },
        children:[ new TextRun({ text, font:'微软雅黑', size:22, ...(opts||{}) }) ]
      });
      const cell = (text, opts) => new TableCell({
        width:{ size: opts && opts.w || 2000, type: WidthType.DXA },
        shading: opts && opts.head ? { type:ShadingType.CLEAR, fill:'F5F2EA' } : undefined,
        children:[ new Paragraph({
          alignment: opts && opts.align || AlignmentType.LEFT,
          children:[ new TextRun({ text:String(text), font:'微软雅黑', size:20, bold: opts && (opts.head||opts.bold) }) ]
        })]
      });
      const tableOf = (rows, widths) => new Table({
        width:{ size: 9000, type:WidthType.DXA },
        rows: rows.map(r => new TableRow({
          children: r.map((c,ci) => typeof c === 'object' && c.text !== undefined
            ? cell(c.text, { ...c, w: widths ? widths[ci] : 2000 })
            : cell(c, { w: widths ? widths[ci] : 2000 }))
        }))
      });

      const cityTierLabel = (m.cityTier || (m.city ? '同城' : '未填')) + (m.city?` (${m.city})`:'');
      const modeLabel = { lease:'包租模式 (固租模式)', dev:'重资产模式', ent:'委管模式' }[m.type] || m.type;

      // ===== 投资建议 =====
      const irrPass = irr >= p.tax.discountRate;
      const npvPass = npv > 0;
      const pbPass = pb < 8;
      const passCount = [irrPass, npvPass, pbPass].filter(Boolean).length;
      const advice = passCount === 3 ? '建议投资' : passCount === 2 ? '原则同意, 关注关键指标' : '暂缓推进';
      const adviceReason = passCount === 3
        ? '项目财务指标整体良好, IRR 高于基准、NPV 为正、回收期在合理区间。'
        : passCount === 2
        ? '项目核心指标 2/3 达标, 建议商务谈判中锁定保护条款后推进。'
        : '项目财务指标多项不达标, 建议先调整商务条件再评估。';

      const sections = [];

      /* 封面 */
      sections.push(
        new Paragraph({ alignment:AlignmentType.CENTER, spacing:{before:3000,after:240}, children:[new TextRun({ text:m.name||'(未命名项目)', bold:true, size:48, font:'微软雅黑' })]}),
        new Paragraph({ alignment:AlignmentType.CENTER, spacing:{after:120}, children:[new TextRun({ text:'投资决策报告', size:36, font:'微软雅黑' })]}),
        new Paragraph({ alignment:AlignmentType.CENTER, spacing:{after:600}, children:[new TextRun({ text:`${modeLabel.replace(' (固租模式)','')} · ${m.city||''} · ${m.propertyType||''}`, size:24, color:'888888', font:'微软雅黑' })]}),
        new Paragraph({ alignment:AlignmentType.CENTER, spacing:{after:120}, children:[new TextRun({ text:'内部讨论稿', size:22, color:'888888', font:'微软雅黑' })]}),
        new Paragraph({ alignment:AlignmentType.CENTER, spacing:{after:120}, children:[new TextRun({ text:new Date().toLocaleDateString('zh-CN'), size:22, color:'888888', font:'微软雅黑' })]}),
        new Paragraph({ alignment:AlignmentType.CENTER, spacing:{after:120}, children:[new TextRun({ text:'由 MallPlan 投拓测算 v1.0 生成', size:20, color:'aaaaaa', font:'微软雅黑' })]}),
        new Paragraph({ pageBreakBefore:true, children:[] })
      );

      /* 一、项目概况 */
      sections.push(h('一、项目概况'));
      sections.push(tableOf([
        [{text:'项目要素',head:true},{text:'内容',head:true}],
        ['项目名称', m.name || '(未命名)'],

  /* ============================================================
     设备指纹 + 激活码系统 (方案1:纯前端防共享)
     ============================================================ */
  /* 生成设备指纹:屏幕/时区/UA/Canvas组合 */
  genFingerprint(){
    const c=document.createElement('canvas');c.width=200;c.height=50;
    const ctx=c.getContext('2d');ctx.textBaseline='top';
    ctx.fillStyle='#f60';ctx.fillRect(20,10,60,30);
    ctx.fillStyle='#069';ctx.font='12px Arial';ctx.fillText('MallPlanⓒ2026',2,15);
    ctx.strokeStyle='rgba(102,204,0,0.7)';ctx.lineWidth=2;ctx.strokeRect(0,0,200,50);
    const canvasFp=c.toDataURL();
    const parts=[
      screen.width+'x'+screen.height+'x'+screen.colorDepth,
      new Date().getTimezoneOffset(),
      navigator.userAgent,
      navigator.language||'',
      canvasFp,
      navigator.hardwareConcurrency||''
    ];
    return btoa(parts.join('|||')).slice(0,48);
  },

  /* 激活码校验(简版:支持MPINV-格式) */
  verifyLicenseKey(code){
    if(!code)return{valid:false,reason:'激活码为空'};
    const c=code.toUpperCase().trim();
    const m=c.match(/^MPINV-([0-9A-F]{4})-([0-9A-F]{4})-([0-9A-F]{4})$/);
    if(!m)return{valid:false,reason:'格式错误,应为 MPINV-XXXX-XXXX-XXXX'};
    return{valid:true,code:c,format:'MPINV',days:365};
  },

  /* 加载许可证状态 */
  loadLicense(){
    try{
      const raw=localStorage.getItem('mp_license_v10');
      if(!raw)return{status:'free',reason:'未激活'};
      const lic=JSON.parse(raw);
      /* 校验设备指纹是否一致 */
      const fp=this.genFingerprint();
      if(lic.fingerprint!==fp)return{status:'free',reason:'设备指纹不匹配,激活码已在其他设备使用'};
      /* 校验是否过期 */
      if(lic.expireAt&&new Date(lic.expireAt)<new Date())return{status:'free',reason:'激活码已过期('+lic.expireAt+')'};
      return{status:'pro',name:lic.customerName||'专业版用户',expireAt:lic.expireAt};
    }catch(e){return{status:'free',reason:'读取异常'};}
  },

  /* 保存激活信息(绑定设备指纹) */
  saveLicense(licenseKey,customerName=''){
    const lic={key:licenseKey,fingerprint:this.genFingerprint(),activatedAt:new Date().toISOString(),customerName};
    /* MPINV默认365天;MB格式解析有效期 */
    const v=this.verifyLicenseKey(licenseKey);
    if(v.valid)lic.expireAt=new Date(Date.now()+365*24*3600*1000).toISOString().slice(0,10);
    else lic.expireAt=new Date(Date.now()+365*24*3600*1000).toISOString().slice(0,10);
    localStorage.setItem('mp_license_v10',JSON.stringify(lic));
    return lic;
  },

  /* 清除激活(用于设备转移) */
  resetLicense(){localStorage.removeItem('mp_license_v10');this.toast('已清除激活信息,如需在新设备使用请重新输入激活码','info');},

  doActivate(){
    const code=document.getElementById('licInput')?.value?.trim();
    if(!code){this.toast('请输入激活码','danger');return;}
    const v=this.verifyLicenseKey(code);
    if(!v.valid){this.toast(v.reason,'danger');return;}
    const name=document.getElementById('licName')?.value?.trim()||'';
    this.saveLicense(code,name);
    this.closeModal();
    this.toast('✅ 激活成功!专业版已启用,设备已绑定','positive');
  },
